  async function prendre(e){const f=e.target.files&&e.target.files[0];if(!f)return;try{setPhoto(await bnPhotoCompresse(f));}catch(x){}}
  async function valider(){if(!km||!ess)return showToast('Mets les kilomètres et le niveau d’essence','var(--red)');setEnvoi(true);const now=new Date();const d={chauffeurId:ch.id,chauffeur:ch.display,camion:camion||'',jour:jourLocal(),moment:saisie,km:+km,essence:ess,photo,quand:now.toISOString()};
    const row={date:'KM_'+jourLocal()+'_'+ch.id+'_'+saisie+'_'+Date.now().toString(36),donnees:d,updated_at:now.toISOString()};try{await bnPostA(row);}catch(x){await boiteAjouter({type:'post',row});}
    try{localStorage.setItem(cle(saisie),JSON.stringify({km:+km,essence:ess}));}catch(x){}setEtat(o=>Object.assign({},o,{[saisie]:{km:+km,essence:ess}}));
    showToast(/1\/4|Réserve/.test(ess)?'⛽ Noté — le bureau est prévenu qu’il faut faire le plein':'✅ Compteur enregistré','var(--green)');setSaisie(null);setKm('');setEss('');setPhoto(null);setEnvoi(false);}
  if(!etat)return null;const bt={flex:1,padding:'12px 6px',borderRadius:12,border:'none',fontWeight:900,fontSize:14,fontFamily:'inherit'};
  return <div style={{background:'#fff',border:'2px solid #0f172a',borderRadius:18,marginTop:14,padding:12}}>
    <div style={{fontWeight:900,fontSize:16,color:PRO.txt}}>🚚 Compteur du camion {camion?'· '+camion:''}</div>
    {!saisie&&<div style={{display:'flex',gap:8,marginTop:8}}>
      <button onClick={()=>setSaisie('dep')} style={Object.assign({},bt,{background:etat.dep?'#dcfce7':'#2563eb',color:etat.dep?'#166534':'#fff'})}>{etat.dep?'✅ Départ : '+etat.dep.km+' km':'📸 Départ'}</button>
      <button onClick={()=>setSaisie('ret')} style={Object.assign({},bt,{background:etat.ret?'#dcfce7':'#0f766e',color:etat.ret?'#166534':'#fff'})}>{etat.ret?'✅ Retour : '+etat.ret.km+' km':'📸 Retour'}</button></div>}
    {etat.dep&&etat.ret&&!saisie&&<div style={{marginTop:6,fontWeight:900,color:'#166534'}}>Aujourd’hui : {Math.max(0,etat.ret.km-etat.dep.km)} km parcourus</div>}
    {saisie&&<div style={{marginTop:8}}>
      <label style={{display:'block',padding:12,borderRadius:12,border:'2px dashed #2563eb',textAlign:'center',fontWeight:900,color:'#1d4ed8'}}>{photo?'✅ Photo du compteur prise':'📸 Prendre la photo du compteur'}<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={prendre}/></label>
      <input type="number" inputMode="numeric" value={km} onChange={e=>setKm(e.target.value)} placeholder="Kilomètres affichés" style={{width:'100%',boxSizing:'border-box',marginTop:8,padding:12,borderRadius:12,border:'1px solid #cbd5e1',fontSize:17,fontWeight:900}}/>
      <div style={{fontSize:13,fontWeight:900,marginTop:8,color:PRO.gris}}>⛽ Niveau d’essence</div>
      <div style={{display:'flex',gap:5,marginTop:4,flexWrap:'wrap'}}>{['Plein','3/4','1/2','1/4','Réserve'].map(x=><button key={x} onClick={()=>setEss(x)} style={{flex:1,padding:'10px 4px',borderRadius:10,border:'none',fontWeight:900,background:ess===x?(/1\/4|Réserve/.test(x)?'#dc2626':'#2563eb'):'#f1f5f9',color:ess===x?'#fff':PRO.txt}}>{x}</button>)}</div>
      <div style={{display:'flex',gap:8,marginTop:10}}><button onClick={()=>{setSaisie(null);setPhoto(null);}} style={Object.assign({},bt,{background:'#f1f5f9',color:PRO.txt})}>Annuler</button><button disabled={envoi} onClick={valider} style={Object.assign({},bt,{background:'#16a34a',color:'#fff'})}>✅ Valider</button></div></div>}
  </div>;}

/* ═══ ⏱️ Heures travaillées aujourd'hui (d'après les horaires saisis au bureau) ═══ */
function HeuresJour({hj,debutPlanning}){
  const[now,setNow]=useState(Date.now());useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t);},[]);
  const enMin=h=>{const m=String(h||'').match(/(\d{1,2})[:hH](\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
  const off=hj&&hj.s&&hj.s!=='T'&&hj.s!=='RET';if(off)return null;
  let deb=enMin(hj&&hj.d),fin=enMin(hj&&hj.f);if(deb===null)deb=enMin(debutPlanning);if(deb===null)return null;if(fin===null)fin=deb+7*60;if(fin<=deb)fin+=1440;
  const d=new Date(now);const n=d.getHours()*60+d.getMinutes();const total=fin-deb;const fait=Math.max(0,Math.min(total,n-deb));const reste=total-fait;
  const f=m=>Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const termine=n>=fin;const avant=n<deb;const pc=Math.round(fait*100/Math.max(1,total));
  return <div style={{marginTop:10,background:termine?'#16a34a':'rgba(255,255,255,.14)',borderRadius:14,padding:'10px 12px',border:termine?'none':'1px solid rgba(255,255,255,.25)'}}>
    {avant?<div style={{fontWeight:900,fontSize:16}}>⏰ Ta journée commence à {hh(deb)} · {f(total)} prévues</div>:
     termine?<div style={{fontWeight:900,fontSize:18}}>✅ Journée terminée — {f(total)} travaillées</div>:
     <><div style={{display:'flex',alignItems:'baseline',gap:8}}><span style={{fontSize:26,fontWeight:900}}>⏱️ {f(fait)}</span><span style={{fontSize:15,fontWeight:700,opacity:.9}}>travaillées sur {f(total)}</span></div>
       <div style={{height:8,background:'rgba(255,255,255,.25)',borderRadius:6,marginTop:6,overflow:'hidden'}}><div style={{height:'100%',width:pc+'%',background:'#4ade80'}}/></div>
       <div style={{fontSize:14,fontWeight:800,marginTop:6,color:'#fde68a'}}>Encore {f(reste)} — ta journée finit à {hh(fin)}. Ne pars pas avant.</div></>}
  </div>;}

function App(){
  const[ch,setCh]=useState(null);
  const[screen,setScreen]=useState('home');
  /* APPLI PERSONNELLE : lien « index.html?chauffeur=ID » → l'écran ne montre QUE ce chauffeur ; il tape son code */
  const[seulId]=useState(()=>{try{const q=new URLSearchParams(location.search);const v=q.get('chauffeur');
    if(v!==null&&v!==''){localStorage.setItem('cana_moi_id',String(+v));localStorage.removeItem('cana_moi');try{history.replaceState(null,'',location.pathname);}catch(e){}}
    const m=localStorage.getItem('cana_moi_id');return m!==null?+m:null;}catch(e){return null;}});
  const auto=false;
  const[screenData,setScreenData]=useState(null);
  const[planning,setPlanning]=useState(null);
  const screenRef=useRef('home');const dataRef=useRef(null);screenRef.current=screen;dataRef.current=screenData;
  useEffect(()=>{const f=()=>{const p=window.__pile||[];const prec=p.pop();if(prec){setScreen(prec.s||'home');setScreenData(prec.d||null);}else{setScreen('home');setScreenData(null);}};window.addEventListener('popstate',f);return()=>window.removeEventListener('popstate',f);},[]);

  useEffect(()=>{
    if(!ch) return;
    async function loadAll(){
      try{
        const today=jourLocal();
        /* Charger les lignes de jours ET CONFIG_PRINCIPALE (qui contient les drivers) */
        /* Économie de données : l'année complète toutes les 10 min, sinon seulement hier → après-demain */
        const _iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
        const _d=n=>{const x=new Date();x.setDate(x.getDate()+n);return _iso(x);};
        /* 1er chargement = RAPIDE (hier → après-demain) ; l'année complète arrive juste après, en arrière-plan */
        const _premier=!window.__rowsCache;
        const _complet=!_premier&&(window.__forceComplet||Date.now()-(window.__dernierComplet||0)>10*60*1000);
        const _de=_complet?_d(-366):_d(-1),_a=_complet?'2099-12-31':_d(2);
        const [rowsJ, rowsC] = await Promise.all([
          sGet(`planning?date=gte.${_de}&date=lte.${_a}&select=date,donnees&order=date.asc&limit=800`),
          (_complet||_premier)?sGet(`planning?date=in.(CONFIG_PRINCIPALE,CANA_SOURCE)&select=date,donnees&limit=2`):Promise.resolve(window.__cfgCache||[])
        ]);
        if(Array.isArray(rowsJ)){
          if(_complet){window.__rowsCache={};window.__dernierComplet=Date.now();window.__forceComplet=false;}
          if(_premier){window.__rowsCache={};window.__forceComplet=true;setTimeout(loadAll,800);}
          rowsJ.forEach(r=>{if(/^\d{4}-\d{2}-\d{2}$/.test(r.date))window.__rowsCache[r.date]=r;});
        }
        if(Array.isArray(rowsC)&&(_complet||_premier))window.__cfgCache=rowsC;
        const rowsJours=Object.values(window.__rowsCache||{}).sort((x,y)=>x.date<y.date?-1:1);
        const rowsConfig=window.__cfgCache||[];
        /* l'ancienne config d'abord, puis les journées : une journée envoyée par CANA LIVRAISONS remplace tout l'ancien contenu de ce jour */
        const rows=[...(rowsConfig||[]),...(rowsJours||[])];
        /* CANA_SOURCE présent = le planning CANA LIVRAISONS est la SEULE source : on ignore les vieilles livraisons */
        const _sourceUnique=(rowsConfig||[]).some(r=>r.date==='CANA_SOURCE');
        const _joursCana={};(rowsJours||[]).forEach(r=>{let d=r.donnees;if(typeof d==='string'){try{d=JSON.parse(d);}catch(e){d=null;}}if(d&&d.source==='CANA_LIVRAISONS')_joursCana[r.date]=1;});
        const tasks={};
        let drivers=null;
        let binomes=null;
        const driversParDate={};
        const _cliSet={};
        (window.CLIENTS_LISTE||[]).forEach(x=>{if(x)_cliSet[String(x)]=1;});
        (rows||[]).forEach(r=>{
          let d=r.donnees;
          if(typeof d==='string'){try{d=JSON.parse(d);}catch(e){d=null;}}
          if(_sourceUnique&&d&&d.tasks&&(r.date==='CONFIG_PRINCIPALE'||(/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&!_joursCana[r.date]))){/* ancien logiciel : ignoré */}
          else if(d&&d.tasks){if(r.date==='CONFIG_PRINCIPALE'){Object.keys(d.tasks).forEach(k=>{if(!_joursCana[k.split('|')[0]])tasks[k]=d.tasks[k];});}
            else{if(_joursCana[r.date])Object.keys(tasks).forEach(k=>{if(k.split('|')[0]===r.date)delete tasks[k];});Object.assign(tasks,d.tasks);}}
          /* On récolte TOUS les clients connus : bibliothèque, tournées, missions */
          try{
            if(d&&d.library){Object.keys(d.library).forEach(cat=>{(d.library[cat]||[]).forEach(nm=>{if(nm)_cliSet[String(nm)]=1;});});}
            if(d&&d.tournees){(d.tournees||[]).forEach(t=>{
              if(t&&t.name)_cliSet[String(t.name)]=1;
              (t&&t.clients||[]).forEach(nc=>{const nn=(typeof nc==='string')?nc:(nc&&nc.name?nc.name:'');if(nn)_cliSet[String(nn)]=1;});
            });}
            if(d&&d.tasks){Object.keys(d.tasks).forEach(k=>{(d.tasks[k]||[]).forEach(t=>{if(t&&t.client)_cliSet[String(t.client).replace(/^[^A-Za-zÀ-ÿ0-9]+/,'').trim()]=1;});});}
          }catch(e){}
          /* Horaires + camions de CHAQUE date (et pas seulement aujourd'hui) */
          if(d&&d.binomes&&r.date===today){binomes=d.binomes;}
          if(d&&d.drivers&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)){
            driversParDate[r.date]=d.drivers;
            if(r.date===today)drivers=d.drivers;
          }
          /* CONFIG_PRINCIPALE contient aussi les drivers */
          if(d&&d.drivers&&r.date==='CONFIG_PRINCIPALE'){
            if(!drivers)drivers=d.drivers;
          }
        });
        const _lc=Object.keys(_cliSet).filter(x=>x&&x.length>1).sort();
        if(_lc.length){window.CLIENTS_LISTE=_lc;window._allTasks=tasks;}
        /* Mettre à jour le camion du chauffeur connecté si changé côté planning */
        if(drivers&&Array.isArray(drivers)&&drivers[ch.id]){
          const dj=drivers[ch.id];
          const nouveauCamion=dj.truck;
          const nvStart=dj.start, nvEnd=dj.end;
          if((nouveauCamion&&nouveauCamion!==ch.truck)||(nvStart&&nvStart!==ch.start)||(nvEnd&&nvEnd!==ch.end)){
            try{localStorage.setItem('cana_ch_truck_'+ch.id,nouveauCamion||'');}catch(e){}
            setCh(prev=>({...prev,
              truck:nouveauCamion||prev.truck,
              start:nvStart||prev.start,
              end:nvEnd||prev.end
            }));
          }
        }
        try{ await chargerFiches(); }catch(e){}
        /* Horaires du mois en cours + du mois suivant */
        const horaires={};
        try{
          const m1=today.slice(0,7);
          const dn=new Date(); dn.setMonth(dn.getMonth()+1);
          const m2=dn.getFullYear()+'-'+String(dn.getMonth()+1).padStart(2,'0');
          const mois=[m1,m2];
          for(const mm of mois){
            const rh=await sGet('planning?date=eq.HORAIRES_'+mm+'&select=donnees&limit=1');
            if(rh&&rh.length&&rh[0].donnees){
              let dh=rh[0].donnees;
              if(typeof dh==='string'){try{dh=JSON.parse(dh);}catch(e){dh=null;}}
              if(dh&&dh.h)horaires[mm]=dh.h;
            }
          }
        }catch(e){}
        const nouveauPlanning={tasks,drivers,driversParDate,horaires,binomes};
        /* Détecter les nouvelles missions du jour pour CE chauffeur */
        const mesMissionsAvant=window._dernierNbMissions;
        const mesMissionsMaintenant=getMissions(nouveauPlanning,ch.id,today);
        const nbMaintenant=mesMissionsMaintenant.length;
        if(false&&typeof mesMissionsAvant==='number' && nbMaintenant>mesMissionsAvant){
          /* Une ou plusieurs nouvelles missions ! Alerter avec la dernière ajoutée */
          const nouvelle=mesMissionsMaintenant[mesMissionsMaintenant.length-1];
          alerterNouvelleMission(nouvelle||{});
        }
        window._dernierNbMissions=nbMaintenant;
        /* ⚠️ MODIFICATION DE TOURNÉE : on compare avec ce que le chauffeur avait déjà vu */
        try{
          const sigK='cana_vu_'+ch.id+'_'+today;
          const sigNow=JSON.stringify(mesMissionsMaintenant.map(m=>(m.heure||'')+' '+(m.client||m.task||'')));
          const sigAvant=localStorage.getItem(sigK);
          if(sigAvant!==null&&sigAvant!==sigNow){
            const av=JSON.parse(sigAvant),ap=JSON.parse(sigNow);
            const ajout=ap.filter(x=>av.indexOf(x)<0),retire=av.filter(x=>ap.indexOf(x)<0);
            alerterModifTournee(ajout,retire);
            try{const ka='cana_alertes_'+ch.id;const la=JSON.parse(localStorage.getItem(ka)||'[]');la.push({type:'modif',titre:'Modification de tournée',detail:(ajout.length?'Ajouté : '+ajout.join(', '):'')+(retire.length?' · Retiré : '+retire.join(', '):''),heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),vu:false});localStorage.setItem(ka,JSON.stringify(la.slice(-40)));}catch(e){}
          }
          localStorage.setItem(sigK,sigNow);
        }catch(e){}
        if(Object.keys(tasks).length>0){setPlanning(nouveauPlanning);if(!_premier){try{localStorage.setItem('cana_plan_cache',JSON.stringify(nouveauPlanning));localStorage.setItem('cana_plan_cache_t',String(Date.now()));}catch(e){}}window.__derniereSync=Date.now();}
        else{
          const rows2=await sGet(`planning?date=eq.${today}&limit=1`);
          if(rows2?.length&&rows2[0].donnees){
            let d2=rows2[0].donnees;
            if(typeof d2==='string'){try{d2=JSON.parse(d2);}catch(e){}}
            setPlanning(d2);
          }
        }
      }catch(e){}
    }
    /* affichage IMMÉDIAT de la dernière journée connue (même sans internet) */
    try{const c=JSON.parse(localStorage.getItem('cana_plan_cache')||'null');if(c&&c.tasks)setPlanning(c);}catch(e){}
    window.__rafraichir=()=>{window.__forceComplet=true;loadAll();};
    loadAll();
    const iv=setInterval(loadAll,10000);
    /* 🚨 ALERTE CHAUFFEUR : si l'appli ne reçoit plus rien, il le voit en GROS (il ne doit rater aucun client) */
    if(!window.__ivAlerte)window.__ivAlerte=setInterval(()=>{
      const age=Date.now()-(window.__derniereSync||0);let el=document.getElementById('alerteReseau');
      if(window.__derniereSync&&age<90000){if(el)el.remove();return;}
      if(!el){el=document.createElement('div');el.id='alerteReseau';el.style.cssText='position:fixed;left:8px;right:8px;bottom:12px;z-index:99998;background:#b91c1c;color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:inherit';document.body.appendChild(el);}
      const h=window.__derniereSync?new Date(window.__derniereSync).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
      el.innerHTML='🚨 PAS DE CONNEXION'+(window.__derniereErreur?' ('+window.__derniereErreur+')':'')+'<div style="font-weight:600;font-size:13px;margin-top:4px">Tes livraisons affichées datent de '+h+'. Vérifie internet / 4G, puis appuie sur Réessayer. Si ça dure plus de 5 minutes, appelle le responsable pour connaître ta tournée.</div><button id="alerteRetry" style="margin-top:8px;width:100%;padding:12px;border:none;border-radius:10px;background:#fff;color:#b91c1c;font-weight:900;font-size:15px">🔄 Réessayer</button>';
      document.getElementById('alerteRetry').onclick=()=>{if(window.__rafraichir)window.__rafraichir();};
    },15000);
    const _vis=()=>{if(!document.hidden)loadAll();};document.addEventListener('visibilitychange',_vis);window.addEventListener('online',_vis);
    return()=>clearInterval(iv);
  },[ch]);

  if(!ch&&auto) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:18,fontWeight:900,background:'#071526'}}>⏳ Ouverture de ta journée…</div>;
  if(!ch) return <LoginSimple seulId={seulId} onLogin={d=>{setCh(d);setScreen('home');demanderPermissionNotif();debloquerAudio();}}/>;
  const nav=(s,data=null)=>{if(s==='installer'){if(window.__installer){window.__installer.prompt();window.__installer=null;}else if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches){showToast('✅ L’application est déjà installée','var(--green)');}else{alert('Pour installer CANA Chauffeur :\n\nAndroid (Chrome) : menu ⋮ → « Installer l’application » (ou « Ajouter à l’écran d’accueil »).\n\niPhone (Safari) : bouton Partager ⬆️ → « Sur l’écran d’accueil ».');}return;}
    if(s==='gps'){const v=gpsChoix(ch)==='oui'?'non':'oui';localStorage.setItem('cana_gps_'+ch.id,v);if(v==='oui')gpsDemarrer(ch);showToast(v==='oui'?'📍 Position partagée pendant la tournée':'📍 Position plus partagée (au prochain démarrage)',v==='oui'?'var(--green)':'#ea580c');return;}
    try{window.__pile=window.__pile||[];window.__pile.push({s:screenRef.current,d:dataRef.current});history.pushState({cana:window.__pile.length},'');}catch(e){}
    if(s==='refresh'){if(window.__rafraichir)window.__rafraichir();showToast('🔄 Synchronisation…','var(--green)');return;}setScreen(s);setScreenData(data);};
  const back=()=>{setScreen('home');setScreenData(null);};

  if(screen==='home') return <AccueilPro ch={ch} planning={planning} onNavigate={nav}/>;
  if(screen==='home_old') return <HomeScreen ch={ch} planning={planning} onNavigate={nav} unreadMsg={0} onLogout={()=>{setCh(null);setScreen('home');setPlanning(null);}}/>;
  if(screen==='tournee') return <TourneeScreen ch={ch} planning={planning} onNavigate={nav} onBack={back}/>;
  if(screen==='carte') return <TourneeScreen key="carte" ch={ch} planning={planning} onNavigate={nav} onBack={back} mode="carte"/>;
  if(screen==='autres') return <AutresMissionsScreen ch={ch} planning={planning} onNavigate={nav} onBack={back}/>;
  if(screen==='signes_tel') return <MesSignesScreen ch={ch} onBack={back} onNavigate={nav}/>;
  if(screen==='langue') return <div className="screen" style={{background:PRO.fond}}><Header title="🌍 Langue" onBack={back}/><div className="scroll" style={{padding:14}}>{Object.entries(LANGUES).map(([k,v])=><button key={k} onClick={()=>{try{localStorage.setItem('cana_langue',k);}catch(e){}location.reload();}} style={{display:'block',width:'100%',marginBottom:10,padding:16,borderRadius:14,border:langue()===k?'3px solid #2563eb':'1px solid #cbd5e1',background:'#fff',fontWeight:900,fontSize:19,textAlign:'left'}}>{langue()===k?'✅ ':''}{v}</button>)}<div style={{color:PRO.gris,fontSize:13}}>Les noms des clients et les bons restent en français.</div></div></div>;
  if(screen==='feuille') return <FeuilleService ch={ch} init={screenData} onBack={back} onNavigate={nav}/>;
  if(screen==='horaires') return <MesHorairesPro ch={ch} onBack={back} onNavigate={nav}/>;
  if(screen==='alertes') return <AlertesScreen ch={ch} onNavigate={nav} onBack={back}/>;
  if(screen==='menu') return <MenuPro ch={ch} onNavigate={nav} onLogout={()=>{setCh(null);setScreen('home');setPlanning(null);}}/>;
  if(screen==='today') return <TodayScreen ch={ch} planning={planning} onNavigate={nav} onBack={back}/>;
  if(screen==='photo_libre') return <PhotoScreen ch={ch} mission={screenData||{client:'',task:'Photo de preuve',heure:''}} onBack={()=>setScreen('today')} ia={false}/>;
  if(screen==='mission_detail'&&screenData) return <MissionDetailScreen ch={ch} mission={screenData} planning={planning} onBack={()=>{const r=window.__retour||'tournee';window.__retour=null;setScreen(r);}} onNavigate={nav}/>;
  if(screen==='calendar') return <CalendarScreen ch={ch} planning={planning} onBack={back} onNavigate={nav}/>;
  if(screen==='horscarte') return <HorsCarteScreen ch={ch} onBack={back}/>;
  if(screen==='incident') return <IncidentScreen ch={ch} onBack={back}/>;
  if(screen==='statut') return <StatutScreen ch={ch} onBack={back}/>;
  if(screen==='bilan') return <BilanScreen ch={ch} planning={planning} onBack={back}/>;
  if(screen==='score') return <ScoreScreen ch={ch} planning={planning} onBack={back}/>;
  if(screen==='checklist_fin') return <ChecklistFinScreen ch={ch} onBack={back}/>;
  if(screen==='historique') return <HistoriqueScreen ch={ch} onBack={back}/>;
  if(screen==='preuves') return <PreuvesScreen ch={ch} onBack={back}/>;
  if(screen==='messages') return <MessagesScreen ch={ch} onBack={back}/>;
  if(screen==='help') return <HelpScreen ch={ch} onBack={back}/>;
  if(screen==='conges') return <CongesScreen ch={ch} onBack={back}/>;
  if(screen==='bon') return <BonScreen ch={ch} mission={screenData} onBack={back}/>;
  if(screen==='materiel') return <MaterielScreen ch={ch} planning={planning} onBack={back} init={screenData}/>;
  if(screen==='bons') return <BonsScreen ch={ch} planning={planning} init={screenData} onNavigate={nav} onBack={()=>{if(screenData&&screenData.fromMission){const r=window.__retour||'tournee';window.__retour=null;setScreen(r);setScreenData(null);}else back();}}/>;
  if(screen==='horaires') return <HorairesScreen ch={ch} planning={planning} onBack={back}/>;
  if(screen==='plus') return <PlusScreen ch={ch} onNavigate={nav} onBack={back} onLogout={()=>{setCh(null);setScreen('home');setPlanning(null);}}/>;
  return <HomeScreen ch={ch} planning={planning} onNavigate={nav} unreadMsg={0} onLogout={()=>{setCh(null);setScreen('home');setPlanning(null);}}/>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>

<script>
/* ═══ AUTO-UPDATE : recharge la dernière version automatiquement ═══ */
(function(){
  var APP_TITRE = document.title;
  /* Vérifier s'il y a une nouvelle version toutes les 2 minutes */
  var _monVersion = null;
  function checkUpdate(){
    /* Ajouter un timestamp pour contourner le cache */
    fetch(window.location.href + '?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(html){
        /* Extraire un identifiant de version (taille du fichier) */
        var v = html.length;
        if(_monVersion === null){
          _monVersion = v;
        } else if(Math.abs(v - _monVersion) > 50){
          /* Nouvelle version détectée */
          afficherBanniereUpdate();
        }
      })
      .catch(function(){});
  }

  function afficherBanniereUpdate(){
    if(document.getElementById('update-banner')) return;
    var b = document.createElement('div');
    b.id = 'update-banner';
    b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:9999999;font-family:-apple-system,Arial,sans-serif;box-shadow:0 -4px 20px rgba(0,0,0,.3);animation:slideUp .3s';
    b.innerHTML = '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">🔄</span><div><div style="font-size:14px;font-weight:900">Nouvelle version disponible !</div><div style="font-size:11px;opacity:.9">Cliquez pour mettre à jour</div></div></div><button onclick="location.reload(true)" style="background:#fff;color:#16a34a;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:900;cursor:pointer">Mettre à jour</button>';
    document.body.appendChild(b);
    var st = document.createElement('style');
    st.textContent = '@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}';
    document.head.appendChild(st);
  }

  /* Vérifier au chargement puis toutes les 2 minutes */
  setTimeout(checkUpdate, 5000);
  setInterval(checkUpdate, 120000);

  /* Recharger la dernière version quand on revient sur l'onglet/app */
  var _lastCheck = Date.now();
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && Date.now() - _lastCheck > 60000){
      _lastCheck = Date.now();
      checkUpdate();
    }
  });
})();
</script>

<script>
/* ══ PWA — le manifest est un VRAI fichier (manifest-chauffeur.json)
      déclaré dans le <head>. Chrome exige un vrai fichier pour proposer
      « Installer l'application ». ══ */

/* ══ SERVICE WORKER — obligatoire pour que Chrome propose l'installation ══ */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw-chauffeur.js').catch(function(){});
  });
}

/* Capturer l'événement d'installation et afficher un bouton flottant */
var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  afficherBoutonInstall();
});

function estInstallee(){
  try{
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches)
        || navigator.standalone === true;
  }catch(e){return false;}
}
function afficherBoutonInstall(){
  if(estInstallee()) return;
  if(document.getElementById('btn-install-flottant')) return;
  var btn=document.createElement('button');
  btn.id='btn-install-flottant';
  btn.innerHTML='⬇️ Installer l\'application';
  btn.style.cssText='position:fixed;top:12px;right:12px;z-index:9999999;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,.4);font-family:-apple-system,Arial,sans-serif';
  btn.onclick=installerApp;
  document.body.appendChild(btn);
}

function installerApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice){
      deferredPrompt=null;
      var btn=document.getElementById('btn-install-flottant');
      if(btn) btn.remove();
    });
  } else {
    var ua=navigator.userAgent;
    var msg='';
    if(/iPhone|iPad|iPod/.test(ua)){
      msg='Sur iPhone :\n1. Appuyez sur Partager (carre avec fleche en bas)\n2. "Sur l\'ecran d\'accueil"\n3. Ajouter';
    } else if(/Android/.test(ua)){
      msg='Sur Android :\n1. Menu 3 points en haut a droite\n2. "Installer l\'application"';
    } else {
      msg='Sur PC (Chrome/Edge) :\n1. Icone d\'installation dans la barre d\'adresse (a droite)\nOu 3 points > Applications > Installer';
    }
    alert(msg);
  }
}

/* Si déjà installable au chargement, montrer le bouton après 3s */
window.addEventListener('load',function(){
  setTimeout(function(){
    if(deferredPrompt && !document.getElementById('btn-install-flottant')){
      afficherBoutonInstall();
    }
  },3000);
});
</script>



<script>

          'linear-gradient(135deg,#0ea5e9,#0284c7)',null
        );
      },2000);
    });

})();
</script>
