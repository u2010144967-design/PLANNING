<script>
// ================= ÉCRITURE FIABLE DANS LA BASE =================
// Écrire un jour qui EXISTE déjà était refusé (conflit) : on précise maintenant à la base que la ligne
// est repérée par sa « date » (on_conflict=date) pour qu'elle la REMPLACE. Plans B automatiques si besoin.
var clDerniereErreur='';
(function(){
  if(window.__clFetchFix)return;window.__clFetchFix=true;
  var _f=window.fetch.bind(window);
  window.fetch=async function(url,opt){
    try{
      var u=String(url||'');var m=((opt&&opt.method)||'GET').toUpperCase();
      var pr=opt&&opt.headers&&(opt.headers.Prefer||opt.headers.prefer)||'';
      if(m!=='POST'||u.indexOf('/rest/v1/planning')<0||u.indexOf('on_conflict')>=0||!/merge-duplicates/.test(pr))return _f(url,opt);
      var u2=u+(u.indexOf('?')>=0?'&':'?')+'on_conflict=date';
      var r=await _f(u2,opt);if(r.ok)return r;
      var st=r.status,txt='';try{txt=await r.clone().text();}catch(e){}
      clDerniereErreur='écriture '+st+' '+txt.slice(0,120);
      if(st===400||st===409||st===404){var r0=await _f(url,opt);if(r0.ok)return r0;st=r0.status;try{txt=await r0.clone().text();}catch(e){}clDerniereErreur='écriture '+st+' '+txt.slice(0,120);r=r0;}
      // plan C : modifier la ligne existante
      var row=null;try{row=JSON.parse(opt.body);}catch(e){}
      if(row&&!Array.isArray(row)&&row.date){
        try{var h=Object.assign({},opt.headers);h.Prefer='return=minimal';
          var r2=await _f(u.split('?')[0]+'?date=eq.'+encodeURIComponent(row.date),{method:'PATCH',headers:h,body:JSON.stringify({donnees:row.donnees,updated_at:row.updated_at||new Date().toISOString()})});
          if(r2.ok)return r2;clDerniereErreur+=' | modif '+r2.status;}catch(e){clDerniereErreur+=' | modif bloquée';}
      }
      return r;
    }catch(e){clDerniereErreur='connexion : '+(e&&e.message||e);throw e;}
  };
})();

</script>

/* ═══ Tâche (charger, décharger, commande...) ou vraie livraison client ? ═══ */
function estTache(m){ return !!(m && m.category === 'task'); }
function libFait(m){ return estTache(m) ? 'Mission accomplie' : 'Livraison confirmée'; }
function libAction(m){ return estTache(m) ? 'MARQUER MISSION ACCOMPLIE' : 'CONFIRMER LA LIVRAISON'; }
function libCourt(m){ return estTache(m) ? 'Fait' : 'Livré'; }

/* ═══ HORAIRES MENSUELS (partagés avec le planning) ═══ */
function hmDuree(s,e){
  if(!s||!e)return 0;
  var a=s.split(':'),b=e.split(':');
  var m1=parseInt(a[0],10)*60+parseInt(a[1],10);
  var m2=parseInt(b[0],10)*60+parseInt(b[1],10);
  if(m2<=m1)m2+=1440;
  return (m2-m1)/60;
}
function hmFmt(h){
  if(!h)return '—';
  var t=Math.round(h*60), hh=Math.floor(t/60), mm=t%60;
  return hh+'h'+(mm?String(mm).padStart(2,'0'):'');
}

/* ═══ PAUSE DÉJEUNER : 45 min déduites dès 6h de service ═══ */
var HM_PAUSE = 0.75;                       /* 45 minutes */
var HM_SEUIL_PAUSE = 6;                    /* à partir de 6h de présence */
function hmDureeNette(s, e){
  var b = hmDuree(s, e);
  if(b >= HM_SEUIL_PAUSE) return Math.max(0, b - HM_PAUSE);
  return b;
}
function hmAvecPause(s, e){
  var b = hmDuree(s, e);
  return (b >= HM_SEUIL_PAUSE);
}
var _MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var _JOURS_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
function hmNomMois(m){var p=m.split('-');return _MOIS_FR[parseInt(p[1],10)-1]+' '+p[0];}
function hmJoursDuMois(m){
  var p=m.split('-'), an=parseInt(p[0],10), mo=parseInt(p[1],10);
  var n=new Date(an,mo,0).getDate(), out=[];
  for(var i=1;i<=n;i++){
    var ds=an+'-'+String(mo).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    var d=new Date(ds+'T12:00:00');
    out.push({date:ds,num:i,jour:_JOURS_FR[d.getDay()],we:(d.getDay()===0||d.getDay()===6)});
  }
  return out;
}
/* Horaires officiels du mois pour ce chauffeur (prioritaires sur le reste) */
function horairesMois(planning,driverId,date){
  var hm = planning && planning.horaires;
  if(!hm) return null;
  var m = String(date).slice(0,7);
  var d = hm[m] && hm[m][String(driverId)];
  return (d && d[date]) ? d[date] : null;
}

/* Horaires d'un chauffeur pour une date précise (null si non définis) */
function horairesDu(planning,driverId,date){
  /* 1) Le planning des horaires du mois fait autorité */
  var off = horairesMois(planning,driverId,date);
  if(off && off.s && off.e) return {start:off.s, end:off.e, truck:'', officiel:true};
  /* 2) Sinon, les horaires enregistrés avec la journée */
  var dpd = planning && planning.driversParDate;
  if(!dpd || !dpd[date]) return null;
  var d = dpd[date][driverId];
  if(!d || !d.start || !d.end) return null;
  return {start:d.start, end:d.end, truck:d.truck||''};
}

function getMissions(planning,driverId,date){
  if(!planning?.tasks) return[];
  const res=[];
  Object.keys(planning.tasks).forEach(k=>{
    const[d,di,h]=k.split('|');
    if(d===date&&parseInt(di)===driverId){
      (planning.tasks[k]||[]).forEach(t=>{
        if(t&&(t.client||t.task)) res.push({...t,heure:h,_key:k});
      });
    }
  });
  return res.sort((a,b)=>a.heure.localeCompare(b.heure));
}

function getAllMissionDates(planning,driverId){
  if(!planning?.tasks) return{};
  const dates={};
  Object.keys(planning.tasks).forEach(k=>{
    const[d,di]=k.split('|');
    if(parseInt(di)===driverId&&(planning.tasks[k]||[]).some(t=>t?.client||t?.task)){
      if(!dates[d]) dates[d]=0;
      dates[d]+=(planning.tasks[k]||[]).length;
    }
  });
  return dates;
}

    fetch('https://api.open-meteo.com/v1/forecast?latitude=43.2965&longitude=5.3698&current=temperature_2m,weathercode,windspeed_10m&timezone=Europe/Paris')
      .then(r=>r.json()).then(d=>{
        if(d?.current){
          const c=d.current.weathercode;
          const ico=c===0?'☀️':c<=3?'⛅':c<=67?'🌧️':'⛈️';
          setM({temp:Math.round(d.current.temperature_2m),wind:Math.round(d.current.windspeed_10m),ico,desc:c===0?'Ensoleillé':c<=3?'Nuageux':c<=67?'Pluie':'Orage'});
        }
      }).catch(()=>{});
  },[]);
  if(!m) return null;
  const alerte=m.wind>60;
  return(
    <div className="meteo-bar" style={{borderColor:alerte?'rgba(239,68,68,.3)':'rgba(255,255,255,.08)',background:alerte?'rgba(239,68,68,.06)':'rgba(255,255,255,.04)'}}>
      <span style={{fontSize:20}}>{m.ico}</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,color:'#fff',fontSize:12}}>{m.desc} · {m.temp}°C</div>
        <div style={{fontSize:10,color:alerte?'#ef4444':'var(--muted)',fontWeight:alerte?800:400}}>{alerte?'⚠️ Mistral fort — ':''}{m.wind} km/h</div>
      </div>
      {alerte&&<span style={{fontSize:9,fontWeight:900,color:'#ef4444',background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:5,padding:'2px 6px'}}>PRUDENCE</span>}
    </div>
  );
}

  const[equipe,setEquipe]=useState(filtre(DRIVERS_LIVE));
  const[sel,setSel]=useState(null);
  const[introuvable,setIntrouvable]=useState(false);
  useEffect(()=>{
    let vivant=true;
    chargerEquipe().then(()=>{ if(!vivant)return; const L=filtre(DRIVERS_LIVE.slice()); setEquipe(L);
      if(perso){ if(L[0]){setSel(L[0]);setPavOuvert(true);} else setIntrouvable(true); } });
    return ()=>{ vivant=false; };

/* ═══════════════════ MES HORAIRES (mois complet) ═══════════════════ */
function HorairesScreen({ch,planning,onBack}){
  const [mois,setMois]=useState(new Date().toISOString().slice(0,7));
  const today=jourLocal();
  const jours=hmJoursDuMois(mois);
  let total=0, nbJours=0;
  const lignes=jours.map(j=>{
    const h=horairesDu(planning,ch.id,j.date);
    const dur=h?hmDureeNette(h.start,h.end):0;   /* pause déduite */
    if(dur>0){total+=dur;nbJours++;}
    return {...j,h,dur,estAujourdhui:j.date===today};
  });
  function changerMois(d){
    const p=mois.split('-');
    const x=new Date(parseInt(p[0]),parseInt(p[1])-1+d,1);
    setMois(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));
  }
  return(
    <div className="screen">
      <Header title="🕐 Mes horaires" onBack={onBack} ch={ch}/>
      <div className="scroll">

        {/* Mois */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px'}}>
          <button onClick={()=>changerMois(-1)} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,color:'#fff',width:44,height:44,fontSize:20,fontWeight:800,cursor:'pointer'}}>‹</button>
          <div style={{flex:1,textAlign:'center',fontSize:17,fontWeight:900,color:'#fff',textTransform:'capitalize'}}>{hmNomMois(mois)}</div>
          <button onClick={()=>changerMois(1)} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,color:'#fff',width:44,height:44,fontSize:20,fontWeight:800,cursor:'pointer'}}>›</button>
        </div>

        {/* Total du mois */}
        <div style={{margin:'0 14px 14px',background:'linear-gradient(135deg,#0f1e33,#0a1628)',border:'1px solid rgba(34,197,94,.35)',borderRadius:18,padding:'16px 18px'}}>
          <div style={{fontSize:12,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>Total travaillé</div>
          <div style={{fontSize:34,fontWeight:900,color:'#22c55e',lineHeight:1.1}}>{hmFmt(total)}</div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{nbJours} jour{nbJours>1?'s':''} · moyenne {hmFmt(nbJours?total/nbJours:0)}/jour</div><div style={{fontSize:10,color:'#fbbf24',marginTop:3,fontWeight:700}}>Pause de 45 min déduite dès 6h de service</div>
        </div>

        {/* Les jours */}
        <div style={{padding:'0 14px 20px'}}>
          {lignes.map(l=>(
            <div key={l.date} style={{
              display:'flex',alignItems:'center',gap:12,padding:'11px 14px',marginBottom:6,borderRadius:13,
              background:l.estAujourdhui?'rgba(14,165,233,.14)':(l.h?'var(--card)':'transparent'),
              border:'1px solid '+(l.estAujourdhui?'rgba(14,165,233,.5)':(l.h?'var(--border)':'rgba(255,255,255,.05)')),
              opacity:(!l.h&&l.we)?.45:1
            }}>
              <div style={{textAlign:'center',minWidth:44}}>
                <div style={{fontSize:10,fontWeight:800,color:l.we?'var(--muted)':'#94a3b8'}}>{l.jour}</div>
                <div style={{fontSize:19,fontWeight:900,color:l.estAujourdhui?'#38bdf8':(l.h?'#fff':'var(--muted)'),lineHeight:1}}>{l.num}</div>
              </div>
              <div style={{width:3,alignSelf:'stretch',minHeight:30,borderRadius:2,background:l.h?'#22c55e':'rgba(255,255,255,.07)'}}/>
              <div style={{flex:1,minWidth:0}}>
                {l.h?(
                  <div style={{fontSize:17,fontWeight:900,color:'#fff'}}>{l.h.start} <span style={{color:'var(--muted)',fontWeight:700}}>→</span> {l.h.end}</div>
                ):(
                  <div style={{fontSize:13,fontWeight:700,color:'var(--muted)'}}>{l.we?'Week-end':'Repos / non défini'}</div>
                )}
              </div>
              {l.dur>0&&<div style={{fontSize:14,fontWeight:900,color:'#22c55e',flexShrink:0}}>{hmFmt(l.dur)}</div>}
              {l.estAujourdhui&&<div style={{fontSize:8,fontWeight:900,padding:'3px 6px',borderRadius:5,background:'#0ea5e9',color:'#fff',flexShrink:0}}>AUJOURD'HUI</div>}
            </div>
          ))}
        </div>

        <div style={{padding:'0 14px 24px',fontSize:11,color:'var(--muted)',textAlign:'center',lineHeight:1.6}}>
          Horaires définis par ton responsable.<br/>Une erreur ? Préviens-le avec le bouton 💬 Messages.
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ MISSIONS DU JOUR ═══════════════════ */
function TodayScreen({ch,planning,onNavigate,onBack}){
  const today=jourLocal();
  /* Chercher les missions sur les 14 prochains jours + aujourd'hui */
  const msAll=planning?(() => {
    const res=[];
    /* « Mes livraisons » = la journée d'AUJOURD'HUI uniquement (les autres jours sont dans 📅 Mon planning) */
    for(let offset=0;offset<1;offset++){
      const d=new Date();d.setDate(d.getDate()+offset);
      const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      getMissions(planning,ch.id,ds).forEach(m=>res.push({...m,_date:ds}));
    }
    return res.sort((a,b)=>a._date===b._date?a.heure.localeCompare(b.heure):a._date.localeCompare(b._date));
  })():[];
  const ms=msAll.map(m=>{
    var mk='LIV_'+ch.id+'_'+(m._date||today)+'_'+(m.client||m.task||'')+'_'+(m.heure||'');
    try{if(localStorage.getItem(mk)==='done')return{...m,_statut:'done'};}catch(e){}
    return m;
  });
  const done=ms.filter(m=>m._statut==='done').length;
  const restant=ms.length-done;
  const pct=ms.length>0?Math.round(done/ms.length*100):0;
  /* Répartition par type */
  const repartition={
    traiteur:ms.filter(m=>m.category==='traiteur').length,
    collectivite:ms.filter(m=>m.category==='collectivite').length,
    centre:ms.filter(m=>m.category==='centre').length,
    task:ms.filter(m=>m.category==='task').length
  };
  const typesInfo=[
    {key:'traiteur',ico:'🎉',lbl:'Traiteur',col:'#a855f7'},
    {key:'collectivite',ico:'🏢',lbl:'Resto co',col:'#3b82f6'},
    {key:'centre',ico:'🌳',lbl:'Centre',col:'#22c55e'},
    {key:'task',ico:'📋',lbl:'Tâche',col:'#f59e0b'}
  ].filter(t=>repartition[t.key]>0);

  const CATCOL={
    traiteur:{c:'#a855f7',bg:'rgba(168,85,247,.14)',l:'TRAITEUR',ico:'🎉'},
    collectivite:{c:'#3b82f6',bg:'rgba(59,130,246,.14)',l:'RESTO CO',ico:'🏢'},
    centre:{c:'#22c55e',bg:'rgba(34,197,94,.14)',l:'CENTRE',ico:'🌳'},
    task:{c:'#f59e0b',bg:'rgba(245,158,11,.14)',l:'TÂCHE',ico:'📋'}
  };

  /* Trier : à faire d'abord (par heure), livrées à la fin */
  const msTries=[...ms].sort((a,b)=>{
    const ad=a._statut==='done'?1:0, bd=b._statut==='done'?1:0;
    if(ad!==bd)return ad-bd;
    return (a.heure||'').localeCompare(b.heure||'');
  });

  return(
    <div className="screen">
      <Header title="🚚 Mes livraisons" onBack={onBack} ch={ch}/>
      <div className="scroll">
        {!planning&&<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>⏳ Chargement...</div>}

        {planning&&ms.length>0&&(
          <div style={{padding:'14px 16px 4px'}}>
            {/* Grande barre de progression */}
            <div style={{background:'linear-gradient(135deg,#0f1e33,#0a1628)',border:'1px solid var(--border)',borderRadius:18,padding:'16px 18px',marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}>
                <div>
                  <div style={{fontSize:13,color:'var(--muted)',fontWeight:600}}>Ma journée</div>
                  <div style={{fontSize:26,fontWeight:900,color:'#fff',lineHeight:1.1}}>{done} <span style={{fontSize:16,color:'var(--muted)'}}>sur {ms.length} faites</span></div>
                </div>
                <div style={{fontSize:34,fontWeight:900,color:pct>=100?'#22c55e':pct>=50?'#0ea5e9':'#f97316',lineHeight:1}}>{pct}%</div>
              </div>
              <div style={{background:'rgba(255,255,255,.08)',borderRadius:10,height:14,overflow:'hidden'}}>
                <div style={{width:pct+'%',height:14,borderRadius:10,background:pct>=100?'linear-gradient(90deg,#22c55e,#16a34a)':'linear-gradient(90deg,#0ea5e9,#0369a1)',transition:'.5s'}}/>
              </div>
              {restant>0&&<div style={{fontSize:13,color:'#f97316',fontWeight:800,marginTop:10,textAlign:'center'}}>🔥 Encore {restant} mission{restant>1?'s':''} à faire !</div>}
              {restant===0&&<div style={{fontSize:14,color:'#22c55e',fontWeight:900,marginTop:10,textAlign:'center'}}>🎉 Bravo ! Toutes tes missions sont faites !</div>}
            </div>

            {/* Répartition par type — discret et élégant */}
            {typesInfo.length>0&&(
              <div style={{display:'flex',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                {typesInfo.map(t=>(
                  <div key={t.key} style={{flex:'1 1 0',minWidth:70,background:t.col+'12',border:'1px solid '+t.col+'30',borderRadius:12,padding:'10px 8px',textAlign:'center'}}>
                    <div style={{fontSize:18,marginBottom:2}}>{t.ico}</div>
                    <div style={{fontSize:20,fontWeight:900,color:t.col,lineHeight:1}}>{repartition[t.key]}</div>
                    <div style={{fontSize:10,color:t.col,fontWeight:700,marginTop:2,opacity:.85}}>{t.lbl}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {planning&&ms.length===0&&(
          <div style={{textAlign:'center',padding:50,color:'var(--muted)'}}>
            <div style={{fontSize:48,marginBottom:12}}>😎</div>
            <div style={{fontWeight:800,fontSize:16,color:'#fff'}}>Aucune livraison aujourd'hui</div>
            <div style={{fontSize:13,marginTop:6}}>Profite de ta journée !</div>
          </div>
        )}

        <div style={{padding:'0 14px 20px'}}>
          {msTries.map((m,i)=>{

                    </div>
                    {/* Séparateur vertical */}
                    <div style={{width:2,alignSelf:'stretch',background:estLivre?'rgba(34,197,94,.2)':cat.c+'33',borderRadius:2,minHeight:44}}/>
                    {/* Client + type */}
                    <div style={{flex:1,minWidth:0}}>
                      {cat.l&&<div style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:10,fontWeight:900,padding:'3px 9px',borderRadius:7,background:cat.bg,color:cat.c,marginBottom:5,letterSpacing:.5}}>{cat.ico} {cat.l}</div>}
                      <div style={{fontSize:13.5,fontWeight:800,color:estLivre?'#94a3b8':'#fff',lineHeight:1.25,textDecoration:estLivre?'line-through':'none'}}>{m.client||m.task}</div>
                      {m.task&&m.client&&<div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{m.task}</div>}
                    </div>
                    {/* Statut à droite */}
                    <div style={{textAlign:'center'}}>
                      {estLivre?(
                        <div style={{fontSize:28}}>✅</div>
                      ):(
                        <div style={{width:32,height:32,borderRadius:'50%',border:`2px solid ${cat.c}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,color:cat.c}}>→</div>

                    </div>
                  </div>
                </div>
              </div>
            );
          })}
          <button onClick={()=>onNavigate('photo_libre',null)}
            style={{width:'100%',marginTop:12,marginBottom:8,padding:'17px 14px',borderRadius:18,border:'2px solid rgba(99,102,241,.55)',background:'linear-gradient(135deg,rgba(99,102,241,.2),rgba(99,102,241,.08))',color:'#c7d2fe',fontSize:18,fontWeight:900,cursor:'pointer',fontFamily:'inherit',textAlign:'center'}}>

            <div style={{fontSize:12,fontWeight:700,color:'var(--muted)',marginTop:5,lineHeight:1.4}}>Choisis le client → prends la photo → elle part chez le responsable et reste sur ton téléphone</div>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ FICHE CLIENT / MISSION DETAIL ═══════════════════ */
function MissionDetailScreen({ch,mission,planning,onBack,onNavigate}){
  const today=jourLocal();
  /* Clé unique pour cette mission (persistance état livré) */
  const missionKey='LIV_'+ch.id+'_'+today+'_'+(mission.client||mission.task||'')+'_'+(mission.heure||'');
  const dejaLivre=(()=>{try{return localStorage.getItem(missionKey)==='done';}catch(e){return false;}})();
  const[statut,setStatut]=useState(mission._statut==='done'||dejaLivre?'done':'pending');
  const[photos,setPhotos]=useState([]);
  const[sig,setSig]=useState(null);
  const[reprises,setReprises]=useState([]);
  const[loading,setLoading]=useState(false);
  const[activeSection,setActiveSection]=useState(null);

  // Charger les preuves existantes
  useEffect(()=>{
    sGet(`planning?date=like.EV_*&date=not.like.EV_LIV_*&select=donnees&order=date.desc&limit=100`).then(rows=>{
      const evts=(rows||[]).map(r=>r.donnees).filter(d=>d&&d._isEvent&&d.chauffeurId===ch.id&&d.date===today&&d.client===(mission.client||mission.task));
      setPhotos(evts.filter(e=>e.type==='photo'));
      const s=evts.find(e=>e.type==='signature');
      if(s) setSig(s);
      setReprises(evts.filter(e=>e.type==='reprise'));
      /* Si une livraison confirmée existe déjà pour cette mission, marquer done */
      if(evts.find(e=>e.type==='livraison_confirmee')){setStatut('done');try{localStorage.setItem(missionKey,'done');}catch(e){}}
    });
  },[]);

  /* L'adresse vient du bon FTBE si on l'a : bien plus précis que le nom du client */
  const _fb=ficheDe(mission.client);
  const _fiche=(_fb||mission.tel||mission.tel2||mission.adresse)?Object.assign({},_fb||{},{
    tel:(_fb&&_fb.tel)||mission.tel||'',
    tel2:(_fb&&_fb.tel2)||mission.tel2||'',
    adresse:(_fb&&_fb.adresse)||mission.adresse||''
  }):null;
  const _adr=(_fiche&&_fiche.adresse)||mission.adresse||mission.client||'';
  const _tel=(_fiche&&_fiche.tel)||mission.tel||'';
  const maps=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(_adr)}`;
  const waze=`https://waze.com/ul?q=${encodeURIComponent(_adr)}&navigate=yes`;

  async function marquerLivre(){
    if(statut==='done'){showToast('Déjà confirmée ✓','var(--green)');return;}
    setStatut('done');
    try{localStorage.setItem(missionKey,'done');}catch(e){}
    showToast('✅ '+libFait(mission)+' — responsable notifié','var(--green)');
    try{envoyerPosition(ch,'livraison');}catch(e){}
    /* Récupérer la dernière photo prise pour cette mission si elle existe */
    var dernierePhoto=null;
    try{
      if(photos&&photos.length){var pp=photos[photos.length-1];dernierePhoto=pp.dataUrl||pp.photo||null;}
    }catch(e){}
    /* Envoyer confirmation au planning */
    try{
      await sPostEvent({
        date:'EV_LIV_'+Date.now()+'_'+ch.id,
        donnees:{
          type:'livraison_confirmee',
          _isEvent:true,
          chauffeurId:ch.id,
          chauffeur:ch.display,
          vehicule:ch.truck,
          client:mission.client||mission.task||'',
          category:mission.category||'',
          estTache:estTache(mission),
          libelle:libFait(mission),
          heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
          heurePrevue:mission.heure||'',
          taskKey:mission._key||'',
          photo:dernierePhoto,
          date:jourLocal(),
          ts:new Date().toISOString()
        },
        updated_at:new Date().toISOString()
      });
    }catch(e){}
    /* Revenir à la liste des missions après 1.2s */
    setTimeout(function(){if(onBack)onBack();},1200);
  }

  const sections=[
    {id:'photo',ico:'📸',lbl:'Prendre une photo',sub:'Photo du dépôt, livraison...',col:'#818cf8',bg:'rgba(99,102,241,.1)',brd:'rgba(99,102,241,.3)'},
    {id:'ia_bac',ico:'🤖',lbl:'Photo IA — Bacs gastro',sub:'L\'IA compte les bacs automatiquement',col:'#f97316',bg:'rgba(249,115,22,.1)',brd:'rgba(249,115,22,.3)'},
    {id:'signature',ico:'✍️',lbl:'Signature client',sub:'Preuve de livraison signée',col:'#22c55e',bg:'rgba(34,197,94,.1)',brd:'rgba(34,197,94,.3)'},
    {id:'reprise',ico:'📦',lbl:'Signaler une reprise',sub:'Bacs, matériel à récupérer',col:'#f59e0b',bg:'rgba(245,158,11,.1)',brd:'rgba(245,158,11,.3)'},
    {id:'retard',ico:'⏰',lbl:'Signaler un retard',sub:'Notifier le responsable',col:'#ef4444',bg:'rgba(239,68,68,.1)',brd:'rgba(239,68,68,.3)'},
  ];

  if(activeSection==='photo') return <PhotoScreen ch={ch} mission={mission} onBack={()=>setActiveSection(null)} ia={false}/>;
  if(activeSection==='ia_bac') return <PhotoIABacsScreen ch={ch} mission={mission} onBack={()=>setActiveSection(null)}/>;
  if(activeSection==='signature') return <SignatureScreen ch={ch} mission={mission} onBack={()=>setActiveSection(null)}/>;
  if(activeSection==='reprise') return <RepriseScreen ch={ch} mission={mission} onBack={()=>setActiveSection(null)}/>;

  return(
    <div className="screen">
      <Header title={mission.client||mission.task||'Mission'} onBack={onBack} right={mission.heure}/>
      <div className="scroll">
        {/* Infos client */}
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'start',marginBottom:10}}>
            <div>
              <div style={{fontSize:16,fontWeight:900,color:'#fff',marginBottom:4}}>{mission.client||mission.task}</div>
              {mission.adresse&&<div style={{fontSize:12,color:'var(--muted)',marginBottom:3}}>📍 {mission.adresse}</div>}
              {mission.convives&&<div style={{fontSize:12,color:'var(--muted)'}}>👥 {mission.convives} convives</div>}
              {mission.codeAcces&&<div style={{fontSize:13,color:'#fbbf24',fontWeight:800,marginTop:3}}>🔑 Code d'accès : {mission.codeAcces}</div>}
              {mission.avec&&<div style={{fontSize:12,color:'#93c5fd',fontWeight:700,marginTop:3}}>👥 Avec {mission.avec}</div>}
              {mission.client&&mission.task&&mission.task!==mission.client&&String(mission.task).toUpperCase().indexOf(String(mission.client).toUpperCase())!==0&&<div style={{fontSize:12,color:'#e2e8f0',marginTop:4}}>📝 {mission.task}</div>}
            </div>
            <span style={{fontSize:22,fontWeight:900,color:'var(--orange)',flexShrink:0}}>{mission.heure}</span>
          </div>

          {/* ═══ LE BON DE LIVRAISON (infos venues du bon FTBE) ═══ */}
          {(()=>{ 
            const f=ficheDe(mission.client);
            if(!f) return null;
            const adr=f.adresse||mission.adresse;

            return (

                {adr&&(

                    <div style={{display:'flex',gap:7,marginTop:7}}>
                      <button onClick={()=>window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(adr),'_blank')}

                {f.tel&&(

                    <button onClick={()=>{window.location.href='tel:'+String(f.tel).replace(/\s/g,'');}}

                      📞 Appeler responsable — {f.tel}

                {f.tel2&&(
                  <div style={{marginBottom:9}}>
                    <button onClick={()=>{window.location.href='tel:'+String(f.tel2).replace(/\s/g,'');}}

                      📞 {f.tel2} · 2e contact
                    </button>
                  </div>

                {f.codeAcces&&(
                  <div style={{marginBottom:9,background:'rgba(168,85,247,.12)',border:'1px solid rgba(168,85,247,.3)',borderRadius:10,padding:'9px 11px'}}>
                    <div style={{fontSize:10,color:'#c084fc',fontWeight:800,marginBottom:2}}>🔑 ACCÈS</div>
                    <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>{f.codeAcces}</div>
                  </div>
                )}
                {f.texteBrut&&(
                  <button onClick={()=>onNavigate('bon',{...mission,_fiche:f})}
                    style={{width:'100%',marginBottom:9,padding:'12px',borderRadius:11,border:'1px solid rgba(249,115,22,.4)',background:'rgba(249,115,22,.12)',color:'#fb923c',fontSize:13,fontWeight:900,cursor:'pointer',fontFamily:'inherit'}}>

                {(f.hDepart||f.fenetre)&&(

                    </div>}
                  </div>
                )}
                <ChecklistMateriel f={f} mkey={missionKey}/>
                {(f.convives||f.heure)&&(
                  <div style={{display:'flex',gap:8}}>
                    {f.convives&&<div style={{flex:1,background:'rgba(255,255,255,.05)',borderRadius:9,padding:'8px',textAlign:'center'}}>

              <div style={{fontWeight:900,color:'#22c55e',fontSize:15}}>{libFait(mission)} !</div>

function PhotoScreen({ch,mission,onBack,ia}){
  const[img,setImg]=useState(null);
  const[cli,setCli]=useState('');
  const[sending,setSending]=useState(false);
  const fileRef=useRef();
  const today=jourLocal();

  function handleFile(e){
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      /* Compresser la photo avant envoi */
      const original=ev.target.result;
      const imgEl=new Image();
      imgEl.onload=function(){
        const MAX=800;
        let w=imgEl.width,h=imgEl.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(imgEl,0,0,w,h);
        setImg(canvas.toDataURL('image/jpeg',0.72));
      };
      imgEl.src=original;
    };
    reader.readAsDataURL(f);
  }

  async function envoyer(){
    if(!img){showToast('Prenez une photo d\'abord','var(--red)');return;}
    if(!cli && !mission.client){showToast('📍 Choisis d\'abord le client en haut','var(--red)');return;}
    setSending(true);

  return(

/* ═══ Garder la photo sur SON téléphone (preuve pour le chauffeur) ═══ */
function garderPhotoSurTelephone(dataUrl, client, heure){
  if(!dataUrl) return false;
  try{
    const obj={ts:Date.now(),client:String(client||''),heure:String(heure||''),
               img:dataUrl,date:jourLocal()};
    /* IndexedDB = archive permanente, jamais purgée automatiquement */
    try{
      const req=indexedDB.open('CanaPhotosArchive',1);
      req.onupgradeneeded=ev=>ev.target.result.createObjectStore('photos',{keyPath:'ts'});
      req.onsuccess=ev=>{
        try{ev.target.result.transaction(['photos'],'readwrite').objectStore('photos').put(obj);}catch(e){}
      };
    }catch(e){}
    /* localStorage = aperçu rapide (50 photos) */
    try{
      const arr=JSON.parse(localStorage.getItem('cana_mes_photos')||'[]');
      arr.unshift({img:dataUrl,nom:String(client||'livraison').slice(0,60),heure:heure||'',ts:obj.ts});
      if(arr.length>50)arr.splice(50);
      localStorage.setItem('cana_mes_photos',JSON.stringify(arr));
    }catch(e){}
    /* Téléchargement immédiat sur le téléphone */
    const nom='CANA_'+String(client||'livraison').replace(/[^a-zA-Z0-9]/g,'_').slice(0,28)
              +'_'+jourLocal()
              +'_'+String(heure||'').replace(':','h')+'.jpg';
    const a=document.createElement('a');
    a.href=dataUrl; a.download=nom;
    document.body.appendChild(a); a.click();
    setTimeout(()=>a.remove(),500);
    return true;
  }catch(e){return false;}
}

/* ═══════════════════ SIGNATURE ═══════════════════ */
function SignatureScreen({ch,mission,onBack}){
  const canvasRef=useRef();
  const[hasDrawn,setHasDrawn]=useState(false);
  const[sending,setSending]=useState(false);
  const[nom,setNom]=useState('');
  const today=jourLocal();

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas) return;
    const rect=canvas.getBoundingClientRect();
    canvas.width=rect.width*window.devicePixelRatio||600;
    canvas.height=200*window.devicePixelRatio||200;
    canvas.style.width=rect.width+'px';
    canvas.style.height='200px';
    const ctx=canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    let drawing=false;
    function getPos(e){
      const r=canvas.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return{x:(src.clientX-r.left),y:(src.clientY-r.top)};
    }
    function start(e){e.preventDefault();drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
    function move(e){e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();setHasDrawn(true);}
    function end(e){e.preventDefault();drawing=false;}
    canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end,{passive:false});
  },[]);

  function effacer(){
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    setHasDrawn(false);
  }

  async function envoyer(){
    if(!hasDrawn){showToast('Demandez la signature d\'abord','var(--red)');return;}
    setSending(true);
    try{
      const canvas=canvasRef.current;
      const sigData=canvas.toDataURL('image/png');
      await sPost('planning',{
        date:'PHOTO_'+Date.now()+'_'+ch.id,
        donnees:{type:'signature',_isEvent:true,chauffeurId:ch.id,chauffeur:ch.display,vehicule:ch.truck,client:mission.client||mission.task,date:today,heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),signature:sigData,dataUrl:sigData,signataire:nom,ts:new Date().toISOString()},
        updated_at:new Date().toISOString()
      });
      showToast('✍️ Signature envoyée au responsable','var(--green)');
      onBack();
    }catch(e){showToast('Erreur','var(--red)');}
    setSending(false);
  }

  return(
    <div className="screen">
      <Header title="✍️ Signature client" onBack={onBack}/>
      <div className="scroll">
        <div style={{padding:'16px'}}>
          <div style={{background:'rgba(34,197,94,.06)',border:'1px solid rgba(34,197,94,.2)',borderRadius:12,padding:12,fontSize:12,color:'#86efac',marginBottom:16}}>
            ✍️ Faites signer le client sur l'écran pour valider la réception de la livraison.
          </div>
          <div className="field"><label>Nom du signataire</label><input value={nom} onChange={e=>setNom(e.target.value)} placeholder="Nom et prénom du client..."/></div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10,fontWeight:900,color:'var(--muted)',textTransform:'uppercase',marginBottom:6}}>Zone de signature</div>
            <canvas ref={canvasRef} id="sig-canvas" style={{width:'100%',height:200,border:'2px solid var(--border)',borderRadius:12,background:'#071526',touchAction:'none',cursor:'crosshair'}}/>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            <button onClick={effacer} className="btn-s" style={{flex:1}}>🗑️ Effacer</button>
          </div>
          <button className="btn-p" onClick={envoyer} disabled={!hasDrawn||sending}
            style={{opacity:!hasDrawn?.5:1}}>
            {sending?'Envoi...':'📤 Valider et envoyer'}
          </button>
        </div>
      </div>
    </div>
  );
}

  });
  const[selectedDate,setSelectedDate]=useState(null);
  const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const JOURS_COURTS=['L','M','M','J','V','S','D'];

  const missionDates=getAllMissionDates(planning,ch.id);
  const today=jourLocal();

  function getDays(){
    const first=new Date(month.year,month.month,1);
    const last=new Date(month.year,month.month+1,0);
    let dow=first.getDay();if(dow===0)dow=7;
    const days=[];
    for(let i=1;i<dow;i++) days.push(null);
    for(let d=1;d<=last.getDate();d++){
      const dt=new Date(month.year,month.month,d);
      days.push(isoLocal(dt));
    }
    return days;
  }

  const days=getDays();
  const selMs=selectedDate&&planning?getMissions(planning,ch.id,selectedDate):[];

  /* Les 7 prochains jours avec horaires */
  const JN=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const semaine=[];
  for(let i=0;i<7;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const ds=isoLocal(d);
    semaine.push({
      date:ds,
      jour:JN[d.getDay()],
      num:d.getDate(),
      horaires:horairesDu(planning,ch.id,ds),
      nb:planning?getMissions(planning,ch.id,ds).length:0,
      estAujourdhui:ds===today
    });
  }

  return(
    <div className="screen">
      <Header title="📅 Mon planning" onBack={onBack}/>
      <div className="scroll">

        {/* Navigation mois */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px 10px'}}>
          <button onClick={()=>setMonth(m=>({year:m.month===0?m.year-1:m.year,month:m.month===0?11:m.month-1}))}
            style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,color:'#fff',padding:'8px 14px',cursor:'pointer',fontWeight:700,fontFamily:'inherit'}}>←</button>
          <div style={{fontSize:16,fontWeight:900,color:'#fff'}}>{MOIS[month.month]} {month.year}</div>
          <button onClick={()=>setMonth(m=>({year:m.month===11?m.year+1:m.year,month:m.month===11?0:m.month+1}))}
            style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,color:'#fff',padding:'8px 14px',cursor:'pointer',fontWeight:700,fontFamily:'inherit'}}>→</button>
        </div>

        {/* En-têtes jours */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',padding:'0 12px',marginBottom:4}}>
          {JOURS_COURTS.map((j,i)=>(
            <div key={i} style={{textAlign:'center',fontSize:10,fontWeight:800,color:'var(--muted)',padding:'4px 0'}}>{j}</div>
          ))}
        </div>

        {/* Grille */}
        <div className="cal-grid">
          {days.map((d,i)=>{
            if(!d) return <div key={i}/>;
            const isToday=d===today;
            const hasMissions=!!missionDates[d];
            const nb=missionDates[d]||0;
            const isSel=d===selectedDate;
            return(
              <div key={i} className={`cal-day ${isToday?'today':''} ${hasMissions?'has-missions':''}`}
                onClick={()=>setSelectedDate(d===selectedDate?null:d)}
                style={{background:isSel&&!isToday?'rgba(249,115,22,.15)':isToday?'var(--orange)':hasMissions?'rgba(34,197,94,.08)':'transparent',border:isSel?'2px solid var(--orange)':'2px solid transparent',cursor:'pointer',borderRadius:10}}>
                <div style={{fontWeight:isToday?900:hasMissions?700:400,color:isToday?'#fff':hasMissions?'#22c55e':'var(--text)'}}>
                  {new Date(d+'T12:00:00').getDate()}
                </div>
                {hasMissions&&<div style={{fontSize:9,color:isToday?'#fff':'#22c55e',fontWeight:800}}>{nb}</div>}
              </div>
            );
          })}
        </div>

        {/* Missions du jour sélectionné */}
        {selectedDate&&(
          <div style={{padding:'16px 16px 8px'}}>
            <div style={{fontSize:12,fontWeight:900,color:'var(--orange)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>
              {new Date(selectedDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
            </div>
            {selMs.length===0&&<div style={{fontSize:13,color:'var(--muted)',padding:'12px 0'}}>Aucune mission ce jour</div>}
            {selMs.map((m,i)=>(
              <div key={i} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:12}}>
                <div style={{fontSize:16,fontWeight:900,color:'var(--orange)',flexShrink:0}}>{m.heure}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:800,color:'#fff'}}>{m.client||m.task}</div>
                  {m.adresse&&<div style={{fontSize:11,color:'var(--muted)'}}>📍 {m.adresse}</div>}
                </div>
                <div style={{fontSize:10,fontWeight:800,padding:'3px 8px',borderRadius:6,background:m._statut==='done'?'rgba(34,197,94,.15)':'rgba(249,115,22,.1)',color:m._statut==='done'?'#22c55e':'#f97316'}}>
                  {m._statut==='done'?'✅':'⏳'}
                </div>
              </div>
            ))}
          </div>
        )}

        {!planning&&<div style={{textAlign:'center',padding:30,color:'var(--muted)'}}>Chargement du planning...</div>}
      </div>
    </div>
  );
}

/* ═══════════════════ HORS CARTE ═══════════════════ */

      if(rows?.length&&rows[0].donnees?.horsCarte) setItems(rows[0].donnees.horsCarte);
      else setItems([]);
    }catch(e){}

  }
  useEffect(()=>{load();const iv=setInterval(load,15000);return()=>clearInterval(iv);},[]);

/* ═══════════════════ SCORE ═══════════════════ */
function ScoreScreen({ch,planning,onBack}){
  const today=jourLocal();
  const ms=planning?getMissions(planning,ch.id,today):[];
  const done=ms.filter(m=>m._statut==='done').length;
  const pct=ms.length>0?Math.round(done/ms.length*100):100;
  const score=Math.min(100,Math.max(0,Math.round(pct*.6+40)));
  const col=score>=80?'#22c55e':score>=60?'#f59e0b':'#ef4444';
  const r=50,circ=2*Math.PI*r;
  return(<div className="screen"><Header title="⭐ Mon score" onBack={onBack}/>
  <div className="scroll"><div className="card" style={{margin:16,textAlign:'center'}}>
    <div style={{position:'relative',width:120,height:120,margin:'0 auto 14px'}}>
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r={r} fill="none" stroke="#1a3550" strokeWidth="10"/>
        <circle cx="60" cy="60" r={r} fill="none" stroke={col} strokeWidth="10" strokeDasharray={`${score/100*circ} ${circ}`} strokeLinecap="round" transform="rotate(-90 60 60)"/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div style={{fontSize:28,fontWeight:900,color:col}}>{score}</div>
        <div style={{fontSize:10,color:'var(--muted)'}}>/ 100</div>
      </div>
    </div>
    <div style={{fontSize:16,fontWeight:800,color:col}}>{score>=90?'Excellent 🏆':score>=80?'Très bien ⭐':score>=70?'Bien 👍':score>=60?'Correct':'À améliorer 💪'}</div>
    <div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>{done}/{ms.length} missions · {new Date().toLocaleDateString('fr-FR')}</div>
  </div></div></div>);
}

var _audioCtx=null;
function debloquerAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!_audioCtx)_audioCtx=new AC();
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    /* Jouer un son inaudible pour débloquer */
    var o=_audioCtx.createOscillator();var g=_audioCtx.createGain();
    o.connect(g);g.connect(_audioCtx.destination);
    g.gain.value=0.0001;
    o.start();o.stop(_audioCtx.currentTime+0.01);
  }catch(e){}
}
function jouerBip(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    var ctx=_audioCtx||new AC();
    if(ctx.state==='suspended')ctx.resume();
    /* Deux bips courts */
    [0,0.25].forEach(function(delay){
      var o=ctx.createOscillator();
      var g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;
      o.type='sine';
      g.gain.setValueAtTime(0.001,ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+0.18);
      o.start(ctx.currentTime+delay);
      o.stop(ctx.currentTime+delay+0.2);
    });
  }catch(e){}
}

/* ═══ PROPOSITIONS CLIENTS : tape 1 lettre → la liste sort ═══ */
function SuggestionsClients({cli,setCli}){
  const [tick,setTick]=React.useState(0);
  /* Recharger depuis le cloud si liste vide */
  React.useEffect(()=>{
    const total=(window.CLIENTS_LISTE||[]).length+Object.keys(typeof FICHES!=='undefined'&&FICHES?FICHES:{}).length;
    if(total<3){
      const SK=typeof SUPA_KEY!=='undefined'?SUPA_KEY:KEY;
      const SU=typeof SUPA_URL!=='undefined'?SUPA_URL:SUPA;
      fetch(SU+'/rest/v1/planning?date=eq.FICHES_CLIENTS&select=donnees&limit=1',
        {headers:{'apikey':SK,'Authorization':'Bearer '+SK}})
      .then(r=>r.ok?r.json():[])
      .then(rows=>{
        if(rows&&rows[0]&&rows[0].donnees){
          let d=rows[0].donnees;
          if(typeof d==='string')try{d=JSON.parse(d);}catch(e){d=null;}
          if(d&&d.clients&&d.clients.length){window.CLIENTS_LISTE=d.clients;}
          if(d&&d.fiches)window.FICHES=Object.assign(window.FICHES||{},d.fiches);
        }
        setTick(t=>t+1);
      }).catch(()=>{});
    }
  },[]);
  const liste=React.useMemo(()=>{
    const s={};
    (window.CLIENTS_LISTE||[]).forEach(n=>{if(n)s[String(n)]=1;});
    try{Object.keys(typeof FICHES!=='undefined'&&FICHES?FICHES:{}).forEach(n=>{if(n)s[String(n)]=1;});}catch(e){}
    if(!Object.keys(s).length&&window._allTasks){
      Object.values(window._allTasks).forEach(arr=>{
        (arr||[]).forEach(t=>{if(t&&t.client&&t.client.length>2)s[String(t.client).replace(/^[^A-Za-zÀ-ɏ0-9]+/,'').trim()]=1;});
      });
    }
    return Object.keys(s).filter(x=>x&&x.length>1).sort();
  },[tick]);
  const q=(cli||'').trim().toUpperCase();
  const props=q?liste.filter(n=>String(n).toUpperCase().includes(q)&&String(n).toUpperCase()!==q).slice(0,8):[];
  return (
    <div>
      <input value={cli} onChange={e=>setCli(e.target.value)}
        placeholder="Tape la 1re lettre du client… (P → POMPIERS)"
        style={{width:'100%',padding:'13px',borderRadius:12,border:'1px solid rgba(255,255,255,.18)',background:'rgba(255,255,255,.07)',color:'#fff',fontSize:16,fontWeight:800,fontFamily:'inherit',boxSizing:'border-box'}}/>

        <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:4,maxHeight:200,overflowY:'auto'}}>
          {props.map(n=>(
            <button key={n} onClick={()=>setCli(n)}

              📍 {n}

  );
}

var DRIVERS_LIVE = DRIVERS.slice();   /* liste réellement utilisée pour se connecter */

async function chargerEquipe(){
  try{
    const rows = await sGet('planning?date=eq.EQUIPE&select=donnees&limit=1');
    if(!rows || !rows.length || !rows[0].donnees) return false;
    let d = rows[0].donnees;
    if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ return false; } }
    if(!d || !d.drivers || !d.drivers.length) return false;
    const COUL = ['#3b82f6','#22c55e','#f97316','#a855f7','#ec4899','#06b6d4','#84cc16','#f59e0b','#ef4444','#8b5cf6'];
    const liste = [];
    /* On parcourt AU MOINS la liste d'origine : un chauffeur absent ou incomplet
       dans la fiche ne doit JAMAIS disparaître de l'écran de connexion. */
    const n = Math.max(d.drivers.length, DRIVERS.length);
    for(let i = 0; i < n; i++){
      const e = d.drivers[i] || {};
      const anc = DRIVERS[i];
      if(e.actif === false) continue;                       /* archivé : seul cas d'exclusion */
      const nom  = e.name || (anc ? anc.name : '');
      const code = String(e.code || (anc ? anc.code : '') || '');   /* code de secours */
      if(!nom || !code) continue;
      liste.push({
        id: i,                                              /* le numéro NE CHANGE JAMAIS */
        name: nom,
        display: (anc && anc.name === nom) ? anc.display : (nom.charAt(0) + nom.slice(1).toLowerCase()),
        color: (anc ? anc.color : COUL[i % COUL.length]),
        code: code,
        truck: e.truck || (anc ? anc.truck : '') || '',
        start: e.start || (anc ? anc.start : '06:00'),
        end: e.end || (anc ? anc.end : '14:00')
      });
    }
    if(liste.length){ DRIVERS_LIVE = liste; return true; }
  }catch(e){}
  return false;
}

/* ═══════════════════ GÉOLOCALISATION ═══════════════════ */
function envoyerPosition(ch,contexte){
  return new Promise(function(resolve){
    if(!navigator.geolocation){resolve(false);return;}
    navigator.geolocation.getCurrentPosition(function(pos){
      var data={
        type:'position_chauffeur',_isEvent:true,
        chauffeurId:ch.id,chauffeur:ch.display,vehicule:ch.truck,
        lat:pos.coords.latitude,lng:pos.coords.longitude,
        precision:Math.round(pos.coords.accuracy),
        contexte:contexte||'manuel',
        date:jourLocal(),
        heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
        ts:new Date().toISOString()
      };
      var headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'};
      fetch(SUPA+'/rest/v1/planning',{method:'POST',headers:headers,body:JSON.stringify({date:'POS_'+ch.id,donnees:data,updated_at:new Date().toISOString()})})

async function consignesPour(jour,client){try{const l=await bnLireA('date=like.CONSIGNE_'+jour+'_*');const k=bnNormA(client);return (l||[]).filter(c=>!c.supprime&&c.texte&&c.client&&(bnNormA(c.client)===k||(bnNormA(c.client).length>=4&&(k.indexOf(bnNormA(c.client))>=0||bnNormA(c.client).indexOf(k)>=0))));}catch(e){return [];}}
async function bnAnnoter(octets,lignes,stabilo,depart,annule){
  if((!lignes||!lignes.length)&&!stabilo&&!depart&&!annule)return octets;
  if(depart){try{await bnLibsA();const p=await pdfjsLib.getDocument({data:octets.slice(0)}).promise;const p1=await p.getPage(1);const tc=await p1.getTextContent();
    const it=tc.items;const dep=it.find(x=>/D[ÉE]PART/i.test(x.str));const chd=it.find(x=>/^\s*CHAUD\s*$/i.test(x.str));const frd=it.find(x=>/^\s*FROID\s*$/i.test(x.str));
    if(dep&&chd&&frd){const doc0=await PDFLib.PDFDocument.load(octets);const pg0=doc0.getPages()[0];const f0=await doc0.embedFont(PDFLib.StandardFonts.HelveticaBold);const bleu=PDFLib.rgb(.05,.2,.6);const x=dep.transform[4]+2;
      pg0.drawText('69 C',{x:x,y:chd.transform[5],size:11,font:f0,color:bleu});pg0.drawText('3 C',{x:x,y:frd.transform[5],size:11,font:f0,color:bleu});octets=await doc0.save();depart=false;}}catch(e){}
    if(depart)lignes=['TEMPERATURE AU DEPART :  CHAUD (69 C)   -   FROID (3 C)'].concat(lignes||[]);}
  if((!lignes||!lignes.length)&&!stabilo&&!annule)return octets;
  try{await bnLibsA();const doc=await PDFLib.PDFDocument.load(octets);const pg=doc.getPages()[0];const {width,height}=pg.getSize();
    if(stabilo&&window.pdfjsLib){try{const p=await pdfjsLib.getDocument({data:octets.slice(0)}).promise;const p1=await p.getPage(1);const tc=await p1.getTextContent();
      tc.items.forEach(it=>{if(/S[ÉE]CURIT[ÉE]\s+CIVILE/i.test(it.str)){const x=it.transform[4],y=it.transform[5],w=it.width||200,h=Math.abs(it.transform[3])||10;pg.drawRectangle({x:x-2,y:y-3,width:w+4,height:h+5,color:PDFLib.rgb(.45,.95,.35),opacity:.45});}});}catch(e){}}
    if(lignes&&lignes.length){const H=30+lignes.length*22;pg.setMediaBox(0,0,width,height+H);if(pg.setCropBox)pg.setCropBox(0,0,width,height+H);
      const f=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);const rouge=PDFLib.rgb(.8,.05,.05);
      pg.drawRectangle({x:6,y:height+4,width:width-12,height:H-8,color:PDFLib.rgb(1,.92,.92),borderColor:rouge,borderWidth:3});
      const nett=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,' ');
      lignes.forEach((l,i)=>pg.drawText(nett(l).slice(0,80),{x:18,y:height+H-30-i*22,size:i?16:17,font:f,color:rouge}));}
    if(annule){const fa=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);const rr=PDFLib.rgb(.86,.05,.05);const t=String(annule).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,' ').toUpperCase().slice(0,30);
      doc.getPages().forEach(pp=>{const z=pp.getSize();pp.drawLine({start:{x:20,y:20},end:{x:z.width-20,y:z.height-20},thickness:7,color:rr,opacity:.85});const ang=Math.atan2(z.height,z.width);const sz=Math.min(64,(z.width*0.9)/(t.length*0.62));const w=fa.widthOfTextAtSize(t,sz);
        pp.drawText(t,{x:z.width/2-Math.cos(ang)*w/2+Math.sin(ang)*sz/3,y:z.height/2-Math.sin(ang)*w/2-Math.cos(ang)*sz/3,size:sz,font:fa,color:rr,rotate:PDFLib.degrees(ang*180/Math.PI),opacity:.9});});}
    return await doc.save();}catch(e){return octets;}}

const _proGeo=(()=>{try{return JSON.parse(localStorage.getItem('cana_geo_app')||'{}');}catch(e){return {};}})();
async function proGeocoder(adr){const k=String(adr||'').toUpperCase().trim();if(!k)return null;if(_proGeo[k]!==undefined)return _proGeo[k];
  try{const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit=1&q='+encodeURIComponent(adr));const j=await r.json();const f=j.features&&j.features[0];_proGeo[k]=f&&f.properties.score>0.35?[f.geometry.coordinates[1],f.geometry.coordinates[0]]:null;}catch(e){return null;}
  try{localStorage.setItem('cana_geo_app',JSON.stringify(_proGeo));}catch(e){}return _proGeo[k];}

/* ═══════════════════ HORS RÉSEAU : tout est gardé sur le téléphone et part tout seul au retour du réseau ═══════════════════ */
const AIDB={db:null,
  async o(){if(this.db)return this.db;this.db=await new Promise((res,rej)=>{const r=indexedDB.open('cana_app',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return this.db;},
  async get(k){try{const db=await this.o();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined);});}catch(e){return undefined;}},
  async set(k,v){try{const db=await this.o();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}},
  async del(k){try{const db=await this.o();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res;});}catch(e){}},
  async cles(p){try{const db=await this.o();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').getAllKeys();t.onsuccess=()=>res((t.result||[]).filter(k=>String(k).indexOf(p)===0));t.onerror=()=>res([]);});}catch(e){return [];}}
};

const _bnDonneesNet=bnDonnees;bnDonnees=async function(k){try{const m=await _bnDonneesNet(k);AIDB.set('meta:'+k,m);return m;}catch(e){const c=await AIDB.get('meta:'+k);if(c)return c;throw e;}};
const _bnPdfANet=bnPdfA;bnPdfA=async function(m){const ck='pdf:'+(m.pid||m.date||'');const c=await AIDB.get(ck);if(c)return c;const b=await _bnPdfANet(m);AIDB.set(ck,b);return b;};
const _bnJourNet=bnBonsDuJour;bnBonsDuJour=async function(d){try{const l=await _bnJourNet(d);AIDB.set('liste:'+d,l);return l;}catch(e){const c=await AIDB.get('liste:'+d);if(c)return c;throw e;}};
async function prechargerBons(planning,ch){
  if(!navigator.onLine||!planning||!ch)return;const ds=jourLocal();const fl='cana_pre_'+ch.id+'_'+ds;
  let cles=[];try{getMissions(planning,ch.id,ds).forEach(m=>{if(m.bonCle)cles.push(m.bonCle);(m.bonCles||[]).forEach(x=>cles.push(x));if(m.tournee&&m.tournee.clients)m.tournee.clients.forEach(c=>c.bonCle&&cles.push(c.bonCle));});}catch(e){}
  cles=[...new Set(cles)];const deja=JSON.parse(localStorage.getItem(fl)||'[]');
  for(const k of cles){if(deja.indexOf(k)>=0)continue;try{const m=await bnDonnees(k);await bnPdfA(m);deja.push(k);localStorage.setItem(fl,JSON.stringify(deja));}catch(e){break;}}

async function envoyerAuto(cle,email,silencieux){

    if(r.ok&&j.ok){if(!silencieux)showToast('✉️ Bon envoyé automatiquement à '+email,'var(--green)');else showToast('✉️ Bon envoyé à '+email,'var(--green)');

/* ═══ CONNEXION SIMPLE : le chauffeur tape SON code — il ne voit jamais les autres chauffeurs ═══ */
function LoginSimple({seulId,onLogin}){
  const[eq,setEq]=useState(DRIVERS_LIVE||[]);const[pin,setPin]=useState('');const[err,setErr]=useState('');const[liste,setListe]=useState(false);const[pret,setPret]=useState(false);
  useEffect(()=>{let v=true;chargerEquipe().finally(()=>{if(v){setEq((DRIVERS_LIVE||[]).slice());setPret(true);}});return()=>{v=false;};},[]);
  const perso=seulId!==null&&seulId!==undefined;const moi=perso?eq.find(d=>d.id===seulId):null;
  if(liste)return <Login onLogin={onLogin}/>;
  const taper=c=>{if(pin.length>=4)return;const np=pin+c;setPin(np);setErr('');
    if(np.length===4)setTimeout(()=>{const d=perso?(moi&&String(moi.code)===np?moi:null):eq.find(x=>String(x.code)===np);
      if(d){if(navigator.vibrate)navigator.vibrate(30);onLogin(d);}else{setErr('Code incorrect, recommence');setPin('');if(navigator.vibrate)navigator.vibrate([60,60,60]);}},120);};
  const K=['1','2','3','4','5','6','7','8','9','⌫','0',''];
  return <div style={{minHeight:'100vh',background:'linear-gradient(160deg,#0b1b33,#1e3a8a)',color:'#fff',display:'flex',flexDirection:'column',alignItems:'center',padding:'calc(28px + env(safe-area-inset-top)) 20px 20px',fontFamily:'inherit'}}>
    <div style={{width:84,height:84,borderRadius:42,background:'#fff',color:'#0b1b33',display:'flex',alignItems:'center',justifyContent:'center',fontSize:34,fontWeight:900,fontFamily:'Georgia,serif',border:'4px solid #e8c66a'}}>HB</div>
    <div style={{marginTop:10,fontWeight:900,letterSpacing:2,fontSize:14,color:'#c7d2fe'}}>HB LOGISTIQUE</div>
    <div style={{marginTop:22,fontSize:30,fontWeight:900,textAlign:'center'}}>{perso?(moi?'Bonjour '+moi.display+' 👋':(pret?'Lien plus valable':'…')):'Bonjour 👋'}</div>
    <div style={{marginTop:6,fontSize:17,color:'#e0e7ff',textAlign:'center'}}>{perso&&pret&&!moi?'Demande ton nouveau lien au responsable.':'Tape ton code à 4 chiffres'}</div>
    <div style={{display:'flex',gap:16,margin:'22px 0 8px'}}>{[0,1,2,3].map(i=><div key={i} style={{width:20,height:20,borderRadius:10,background:pin.length>i?'#fff':'rgba(255,255,255,.25)'}}/>)}</div>
    <div style={{minHeight:24,color:'#fecaca',fontWeight:900,fontSize:16}}>{err}</div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,84px)',gap:14,marginTop:8}}>
      {K.map((k,i)=>k===''?<div key={i}/>:<button key={i} onClick={()=>k==='⌫'?setPin(p=>p.slice(0,-1)):taper(k)} style={{width:84,height:84,borderRadius:42,border:'none',background:k==='⌫'?'transparent':'rgba(255,255,255,.14)',color:'#fff',fontSize:k==='⌫'?28:34,fontWeight:800,fontFamily:'inherit'}}>{k}</button>)}
    </div>
    <div style={{flex:1}}/>
    {!perso&&<button onClick={()=>{window.__modeResponsable=true;setListe(true);}} style={{background:'none',border:'none',color:'#94a3b8',fontSize:12.5,marginTop:20,textDecoration:'underline'}}>Responsable : voir la liste des chauffeurs</button>}
    {perso&&<button onClick={()=>{try{localStorage.removeItem('cana_moi_id');}catch(e){}location.href=location.pathname;}} style={{background:'none',border:'none',color:'#94a3b8',fontSize:12.5,marginTop:20,textDecoration:'underline'}}>Ce n’est pas moi</button>}
  </div>;
}

  const fmtH=v=>Math.floor(v)+' h '+String(Math.round((v%1)*60)).padStart(2,'0');
  async function envoyer(){

    if(!sigC)return showToast('Fais signer le client à la fin','var(--red)');
    setEnvoi(true);const now=new Date();const row={date:'FEUILLE_'+(I.jour||jourLocal())+'_'+Date.now().toString(36)+'_'+ch.id,donnees:{type:'feuille',jour:I.jour||jourLocal(),client,lieu,bonCle:I.bonCle||'',mh:ch.display,mhId:ch.id,

      remarques:rq,signatureClient:sigC.img,signataireClient:sigC.nom,statut:'a_valider',envoyeLe:now.toISOString()},updated_at:now.toISOString()};
    try{await bnPostA(row);showToast('✅ Feuille de service envoyée au bureau','var(--green)');onBack();}
    catch(e){await boiteAjouter({type:'post',row});showToast('📴 Pas de réseau : la feuille partira toute seule','#ea580c');onBack();}setEnvoi(false);}

  if(signe!==null)return <div className="screen" style={{background:PRO.fond}}><Header title={signe==='client'?'✍️ Signature du client':'✍️ '+(L[signe]||{}).nom} onBack={()=>setSigne(null)}/><div className="scroll" style={{padding:14}}>
    {signe!=='client'&&<div style={{background:'#fff',borderRadius:12,padding:12,marginBottom:10,fontSize:14}}>Je confirme mes heures : <b>{L[signe].debut} → {L[signe].fin}</b>{+L[signe].pause?' (pause '+L[signe].pause+' min)':''} = <b>{fmtH(heures(L[signe]))}</b>{L[signe].contrat?<><br/>et j’accepte mon <b>contrat extra</b> pour cette prestation.</>:null}</div>}
    <BnSignPad onAnnule={()=>setSigne(null)} onValide={(img,nom,prenom)=>{if(signe==='client')setSigC({img,nom:(prenom+' '+nom).trim()});else maj(signe,'sig',img);setSigne(null);}}/></div></div>;
  const tot=L.reduce((a,x)=>a+heures(x),0);

        <button onClick={lireContrat} style={{width:'100%',marginTop:10,padding:12,borderRadius:12,border:'2px solid #0f766e',background:'#ecfdf5',color:'#0f766e',fontWeight:900,fontSize:15}}>📄 Lire le contrat avant de signer</button>
