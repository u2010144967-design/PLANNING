<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e6f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vestiaires">
<link rel="apple-touch-icon" href="icon-responsable.png">
<link rel="manifest" href="manifest-vestiaires.json">
<title>Vestiaires — La Table de Cana</title>
<style>
  :root{
    --brand:#0e6f66; --brand2:#12857a; --brand-fonce:#0a544d;
    --fond:#eef1f4; --carte:#ffffff; --bord:#e2e7ee; --bord2:#d2dae4;
    --texte:#17222e; --gris:#657185; --gris-clair:#9aa5b4;
    --occ:#5b6b86; --occ-bg:#eef1f6; --occ-str:#7d8aa3;
    --lib:#1a9d54; --lib-bg:#e7f7ee; --lib-str:#33c477;
    --res:#c07a12; --res-bg:#fdf3e0; --res-str:#eaa63a;
    --ombre-s:0 1px 2px rgba(20,35,55,.05);
    --ombre:0 2px 6px rgba(20,35,55,.06), 0 8px 24px rgba(20,35,55,.07);
    --ombre-fab:0 6px 18px rgba(14,111,102,.4);
    --r:16px; --r-s:12px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--fond); color:var(--texte); line-height:1.45;
    -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none}
  input,select{font-family:inherit; font-size:16px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

  /* ---------- Barre d'appli ---------- */
  .appbar{
    background:linear-gradient(155deg,var(--brand2),var(--brand-fonce));
    color:#fff; position:sticky; top:0; z-index:30;
    padding:calc(var(--safe-t) + 14px) 16px 12px;
    box-shadow:0 4px 16px rgba(10,84,77,.22);
  }
  .appbar-row{display:flex; align-items:center; gap:12px}
  .appbar h1{font-size:20px; font-weight:750; margin:0; letter-spacing:.2px; display:flex; align-items:center; gap:8px}
  .appbar .sous{font-size:12px; opacity:.82; margin:1px 0 0}
  .icone-btn{
    width:40px; height:40px; border-radius:12px; color:#fff; font-size:19px;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.14);
  }
  .icone-btn:active{background:rgba(255,255,255,.26)}
  .appbar .right{margin-left:auto; display:flex; gap:8px}
  .stats{display:flex; gap:8px; margin-top:12px}
  .stat{
    flex:1; background:rgba(255,255,255,.13); border-radius:12px; padding:8px 12px;
    display:flex; align-items:baseline; gap:7px;
  }
  .stat .n{font-size:20px; font-weight:800; line-height:1}
  .stat .l{font-size:11.5px; opacity:.85}
  .stat.pointlib .n{color:#a9f3c8}

  /* ---------- Onglets ---------- */
  .tabs{
    position:sticky; top:calc(var(--safe-t) + 0px); z-index:20;
    background:var(--fond); display:flex; gap:6px; padding:12px 12px 6px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; padding:9px 15px; border-radius:999px; font-size:14px; font-weight:650;
    color:var(--gris); background:var(--carte); border:1px solid var(--bord); white-space:nowrap;
    box-shadow:var(--ombre-s);
  }
  .tab.actif{background:var(--brand); color:#fff; border-color:var(--brand)}
  .tab .pastille{font-size:11px; opacity:.8; margin-left:5px}
  .tab.actif .pastille{opacity:.9}

  main{max-width:900px; margin:0 auto; padding:4px 12px calc(96px + var(--safe-b))}

  /* ---------- Recherche ---------- */
  .recherche-wrap{padding:6px 0 10px}
  .recherche{
    width:100%; padding:12px 15px; border:1px solid var(--bord); border-radius:14px;
    background:var(--carte); box-shadow:var(--ombre-s); font-size:15px;
  }
  .recherche:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,111,102,.12)}

  /* ---------- Cartes casier ---------- */
  .grille{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:11px}
  .casier{
    position:relative; background:var(--carte); border:1px solid var(--bord);
    border-radius:var(--r); padding:14px 15px 14px 18px; box-shadow:var(--ombre-s);
    overflow:hidden; transition:transform .08s, box-shadow .15s; cursor:pointer;
  }
  .casier::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px}
  .casier.occupe::before{background:var(--occ-str)}
  .casier.libre::before{background:var(--lib-str)}
  .casier.reserve::before{background:var(--res-str)}
  .casier:active{transform:scale(.985)}
  .casier:hover{box-shadow:var(--ombre)}
  .cas-haut{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .num{
    font-weight:800; font-size:15px; min-width:34px; height:34px; padding:0 9px;
    border-radius:10px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--brand); color:#fff; letter-spacing:.3px;
  }
  .casier.libre .num{background:var(--lib)}
  .casier.reserve .num{background:var(--res)}
  .prenom{font-weight:700; font-size:16px; flex:1; word-break:break-word}
  .prenom.vide{color:var(--gris-clair); font-weight:500; font-style:italic}
  .etat{font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; letter-spacing:.2px}
  .etat.occupe{background:var(--occ-bg); color:var(--occ)}
  .etat.libre{background:var(--lib-bg); color:var(--lib)}
  .etat.reserve{background:var(--res-bg); color:var(--res)}
  .code-box{
    display:flex; align-items:center; gap:10px; background:#f6f8fb; border:1px solid var(--bord);
    border-radius:12px; padding:9px 13px; margin-top:2px;
  }
  .code-lab{font-size:11px; color:var(--gris); text-transform:uppercase; letter-spacing:.6px; font-weight:700}
  .code-val{font-weight:800; font-size:23px; letter-spacing:5px; margin-left:auto; font-variant-numeric:tabular-nums; color:var(--texte)}
  .code-val.vide{color:var(--gris-clair); letter-spacing:0; font-weight:500; font-size:16px}
  .note{font-size:12.5px; color:var(--gris); margin-top:8px}
  .cas-bas{display:flex; gap:8px; margin-top:11px}
  .pill{
    padding:8px 13px; border-radius:11px; font-size:13px; font-weight:700;
    background:#f2f5f9; color:var(--texte); border:1px solid var(--bord);
  }
  .pill:active{background:#e7ecf3}
  .pill.liberer{background:var(--lib-bg); color:var(--lib); border-color:transparent}
  .pill.liberer:active{background:#d4efe0}
  .pill.modifier{color:var(--brand)}

  .vide-msg{
    text-align:center; color:var(--gris); font-size:14.5px; padding:40px 20px;
    background:var(--carte); border:1px dashed var(--bord2); border-radius:var(--r);
  }
  .vide-msg .emo{font-size:34px; display:block; margin-bottom:8px}

  /* Groupes Libres / Occupés */
  .groupe-titre{font-size:13.5px; font-weight:800; letter-spacing:.3px; margin:4px 2px 10px; display:flex; align-items:center; gap:9px}
  .groupe-titre .trait{flex:1; height:1px; background:var(--bord)}
  .groupe-titre.libre{color:var(--lib)}
  .groupe-titre.libre .rond{width:12px; height:12px; border-radius:50%; background:var(--lib-str); box-shadow:0 0 0 4px var(--lib-bg)}
  .groupe-titre.occ{color:var(--gris); margin-top:22px}
  .casier.libre{background:#eafaf0; border-color:#bfe8cf}
  .casier.libre .num{background:var(--lib)}
  .grille + .groupe-titre{margin-top:22px}

  /* ---------- Codes généraux ---------- */
  .code-carte{background:var(--carte); border:1px solid var(--bord); border-radius:var(--r); padding:14px 15px; box-shadow:var(--ombre-s); position:relative}
  .code-carte .cc-lab{font-size:12.5px; color:var(--gris); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .code-carte input{width:100%; padding:11px 13px; border:1px solid var(--bord); border-radius:11px; font-weight:800; font-size:20px; letter-spacing:3px; background:#f6f8fb}
  .code-carte input:focus{outline:none; border-color:var(--brand); background:#fff}
  .cc-suppr{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:8px; color:var(--gris-clair); font-size:16px}
  .cc-suppr:active{background:#f2f5f9; color:var(--res)}

  /* ---------- Historique ---------- */
  .histo-carte{background:var(--carte); border:1px solid var(--bord); border-radius:var(--r); box-shadow:var(--ombre-s); overflow:hidden}
  .histo-ligne{display:flex; gap:12px; padding:13px 15px; border-bottom:1px solid var(--bord); font-size:14px}
  .histo-ligne:last-child{border-bottom:none}
  .histo-date{color:var(--gris); font-size:12px; min-width:112px; font-variant-numeric:tabular-nums}
  .histo-txt{flex:1}

  /* ---------- Bouton flottant (+) ---------- */
  .fab{
    position:fixed; right:18px; bottom:calc(20px + var(--safe-b)); z-index:25;
    height:58px; padding:0 22px 0 18px; border-radius:999px;
    background:var(--brand); color:#fff; font-size:16px; font-weight:750;
    display:inline-flex; align-items:center; gap:9px; box-shadow:var(--ombre-fab);
  }
  .fab .plus{font-size:26px; line-height:1; margin-top:-2px}
  .fab:active{transform:scale(.96)}
  .fab.cache{display:none}

  /* ---------- Fenêtres (modales) ---------- */
  .voile{position:fixed; inset:0; background:rgba(15,28,42,.55); display:none; z-index:60; align-items:flex-end; justify-content:center}
  .voile.ouvert{display:flex}
  @media(min-width:560px){.voile{align-items:center}}
  .fenetre{
    background:var(--carte); width:100%; max-width:480px; box-shadow:0 -8px 40px rgba(10,20,40,.35);
    border-radius:22px 22px 0 0; max-height:94vh; overflow:auto; animation:monte .22s ease;
    padding-bottom:var(--safe-b);
  }
  @media(min-width:560px){.fenetre{border-radius:22px; animation:pop .18s ease}}
  @keyframes monte{from{transform:translateY(40px)}to{transform:translateY(0)}}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
  .poignee{width:42px; height:5px; background:var(--bord2); border-radius:99px; margin:10px auto 0}
  @media(min-width:560px){.poignee{display:none}}
  .fen-tete{padding:14px 20px 6px; font-size:19px; font-weight:750}
  .fen-corps{padding:8px 20px 6px}
  .champ{margin-bottom:15px}
  .champ label{display:block; font-size:13px; font-weight:700; color:var(--gris); margin-bottom:7px}
  .champ input, .champ select{width:100%; padding:13px 14px; border:1px solid var(--bord2); border-radius:12px; background:#fff}
  .champ input:focus, .champ select:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,111,102,.12)}
  .duo{display:flex; gap:11px}
  .duo .champ{flex:1}
  .segment{display:flex; gap:8px}
  .segment button{flex:1; padding:12px 6px; border:1px solid var(--bord2); background:#fff; border-radius:12px; font-weight:700; font-size:14px; color:var(--gris)}
  .segment button.actif{color:#fff}
  .segment button[data-v="occupe"].actif{background:var(--occ); border-color:var(--occ)}
  .segment button[data-v="libre"].actif{background:var(--lib); border-color:var(--lib)}
  .segment button[data-v="reserve"].actif{background:var(--res); border-color:var(--res)}
  .segment button[data-v="on"].actif,.segment button[data-v="off"].actif{background:var(--brand); border-color:var(--brand)}
  .fen-pied{padding:12px 20px calc(16px + var(--safe-b)); display:flex; gap:10px; align-items:center}
  .btn{padding:13px 18px; border-radius:12px; font-size:15px; font-weight:700; border:1px solid var(--bord2); background:#fff; color:var(--texte)}
  .btn.primaire{background:var(--brand); color:#fff; border-color:var(--brand); flex:1; justify-content:center; display:flex}
  .btn.primaire:active{background:var(--brand-fonce)}
  .btn.large{width:100%; justify-content:center; display:flex}
  .lien-suppr{color:var(--res); font-weight:700; font-size:14px; padding:8px 4px}
  .reglage-item{padding:6px 0 16px; border-bottom:1px solid var(--bord); margin-bottom:16px}
  .reglage-item:last-child{border-bottom:none; margin-bottom:0}

  /* ---------- Écran de code (optionnel) ---------- */
  .verrou{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,var(--brand2),var(--brand-fonce))}
  .verrou.ouvert{display:flex}
  .verrou-carte{background:#fff; border-radius:22px; padding:34px 28px; width:100%; max-width:330px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .verrou-carte h2{margin:8px 0 4px; font-size:21px}
  .verrou-carte p{margin:0 0 18px; color:var(--gris); font-size:13.5px}
  .verrou-carte input{width:100%; padding:15px; font-size:24px; text-align:center; letter-spacing:10px; border:2px solid var(--bord2); border-radius:14px}
  .verrou-err{color:var(--res); font-size:13px; min-height:18px; margin-top:8px}

  .toast{position:fixed; left:50%; bottom:calc(90px + var(--safe-b)); transform:translateX(-50%) translateY(18px); background:#17222e; color:#fff; padding:13px 20px; border-radius:14px; font-size:14px; font-weight:650; box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; z-index:200; max-width:88vw; text-align:center}
  .toast.montre{opacity:1; transform:translateX(-50%) translateY(0)}

  #impression{display:none}
  @media print{
    body{background:#fff}
    #app,.fab,.toast{display:none !important}
    #impression{display:block !important}
    .p-tete{text-align:center; margin-bottom:8mm}
    .p-tete h1{margin:0; font-size:20pt}
    .p-tete .p-date{font-size:9pt; color:#444; margin-top:2mm}
    .p-cols{display:grid; grid-template-columns:1fr 1fr; gap:8mm}
    .p-zone{break-inside:avoid; margin-bottom:6mm}
    .p-zone h2{font-size:13pt; margin:0 0 2mm; padding-bottom:1mm; border-bottom:2px solid #000}
    .p-row{display:flex; gap:4mm; padding:1.5mm 0; border-bottom:.4pt solid #bbb; font-size:10.5pt}
    .p-num{font-weight:800; min-width:10mm}
    .p-nom{flex:1}
    .p-code{font-weight:800; letter-spacing:1pt; min-width:20mm; text-align:right}
    @page{margin:12mm}
  }
</style>
</head>
<body>

<!-- Écran de code (désactivé par défaut) -->
<div class="verrou" id="verrou">
  <div class="verrou-carte">
    <div style="font-size:38px">🔒</div>
    <h2>Vestiaires</h2>
    <p>Entre le code d'accès</p>
    <input id="verrouCode" type="tel" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <div class="verrou-err" id="verrouErr"></div>
    <button class="btn primaire large" style="margin-top:14px" id="verrouBtn">Ouvrir</button>
  </div>
</div>

<div id="app">
  <div class="appbar">
    <div class="appbar-row">
      <div>
        <h1>🔒 Vestiaires</h1>
        <div class="sous">La Table de Cana</div>
      </div>
      <div class="right">
        <button class="icone-btn" id="btnInstaller" title="Installer l'appli" style="display:none">📲</button>
        <button class="icone-btn" id="btnImprimer" title="Imprimer (A4)">🖨️</button>
        <button class="icone-btn" id="btnReglages" title="Réglages">⚙️</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat pointlib"><span class="n" id="statLibres">0</span><span class="l">casiers libres</span></div>
      <div class="stat"><span class="n" id="statOcc">0</span><span class="l">occupés</span></div>
    </div>
    <div style="font-size:11.5px; margin-top:9px; display:flex; align-items:center; gap:6px">
      <span id="statutTxt" style="opacity:.9">…</span>
      <span style="margin-left:auto; opacity:.65">v7 · 16/09</span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="hommes">🚹 Hommes <span class="pastille" id="cntH"></span></button>
    <button class="tab" data-tab="femmes">🚺 Femmes <span class="pastille" id="cntF"></span></button>
    <button class="tab" data-tab="couloir">🚪 Couloir <span class="pastille" id="cntC"></span></button>
    <button class="tab" data-tab="codes">🔑 Codes</button>
    <button class="tab" data-tab="histo">🕓 Historique</button>
  </div>

  <main>
    <div class="recherche-wrap" id="rechercheWrap">
      <input class="recherche" id="recherche" type="search" placeholder="🔎 Chercher un prénom, un numéro, un code…">
    </div>
    <div id="contenu"></div>
  </main>

  <button class="fab" id="fab"><span class="plus">＋</span><span id="fabTxt">Ajouter</span></button>
</div>

<!-- Fenêtre casier -->
<div class="voile" id="fenCasier">
  <div class="fenetre">
    <div class="poignee"></div>
    <div class="fen-tete" id="fenCasierTitre">Nouveau casier</div>
    <div class="fen-corps">
      <div class="champ">
        <label>Vestiaire</label>
        <select id="fZone">
          <option value="hommes">🚹 Vestiaire Hommes</option>
          <option value="femmes">🚺 Vestiaire Femmes</option>
          <option value="couloir">🚪 Couloir</option>
        </select>
      </div>
      <div class="duo">
        <div class="champ"><label>Numéro</label><input id="fNum" type="text" placeholder="ex. 12"></div>
        <div class="champ"><label>Code cadenas</label><input id="fCode" type="text" inputmode="numeric" placeholder="ex. 724"></div>
      </div>
      <div class="champ">
        <label>Prénom</label>
        <input id="fPrenom" type="text" placeholder="Prénom (laisser vide si libre)">
      </div>
      <div class="champ">
        <label>Statut</label>
        <div class="segment" id="fStatut">
          <button type="button" data-v="occupe">Occupé</button>
          <button type="button" data-v="reserve">Réservé</button>
          <button type="button" data-v="libre">Libre</button>
        </div>
      </div>
      <div class="champ">
        <label>Note (facultatif)</label>
        <input id="fNote" type="text" placeholder="ex. cadenas à changer">
      </div>
    </div>
    <div class="fen-pied">
      <button class="lien-suppr" id="fSupprimer" style="display:none">🗑️ Supprimer</button>
      <button class="btn" id="fAnnuler">Annuler</button>
      <button class="btn primaire" id="fEnregistrer">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Fenêtre réglages -->
<div class="voile" id="fenReglages">
  <div class="fenetre">
    <div class="poignee"></div>
    <div class="fen-tete">⚙️ Réglages</div>
    <div class="fen-corps">
      <div class="reglage-item">
        <label style="display:block; font-size:13px; font-weight:700; color:var(--gris); margin-bottom:7px">📲 Installer sur le téléphone</label>
        <button class="btn large" id="rInstaller">Ajouter à l'écran d'accueil</button>
      </div>
      <div class="reglage-item">
        <label style="display:block; font-size:13px; font-weight:700; color:var(--gris); margin-bottom:7px">💾 Copie de secours</label>
        <div style="display:flex; gap:10px">
          <button class="btn" style="flex:1" id="rExport">Sauvegarder</button>
          <button class="btn" style="flex:1" id="rImport">Importer</button>
        </div>
        <input type="file" id="fichierImport" accept="application/json,.json" style="display:none">
      </div>
      <div class="reglage-item">
        <label style="display:block; font-size:13px; font-weight:700; color:var(--gris); margin-bottom:7px">Protéger par un code</label>
        <div class="segment" id="rLock" style="margin-bottom:11px">
          <button type="button" data-v="off">Non</button>
          <button type="button" data-v="on">Oui</button>
        </div>
        <input id="rCode" type="text" inputmode="numeric" maxlength="8" placeholder="Code (ex. 2026)" style="display:none; width:100%; padding:13px 14px; border:1px solid var(--bord2); border-radius:12px">
      </div>
      <div class="reglage-item">
        <label style="display:block; font-size:13px; font-weight:700; color:var(--gris); margin-bottom:7px">Historique &amp; liste</label>
        <button class="btn large" id="rViderHisto" style="margin-bottom:9px">🗑️ Vider l'historique</button>
        <button class="btn large" id="rReset">↺ Recharger la liste d'origine</button>
      </div>
    </div>
    <div class="fen-pied">
      <button class="btn" id="rFermer">Fermer</button>
      <button class="btn primaire" id="rEnregistrer">Enregistrer</button>
    </div>
  </div>
</div>

<div id="impression"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================================================================
   VESTIAIRES — La Table de Cana (version jolie + installable)
   Sauvegarde : window.storage si dispo (dans Claude), sinon
   localStorage (une fois installée sur le tél via ton lien GitHub).
   Règle d'or : on ne remplace JAMAIS des données par le modèle.
   ================================================================ */
const CLE = "vestiaires-cana-v1";

/* ---- Stockage adaptatif ---- */
const aCloud = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function");
let LS = null;
try{ const k="__t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); LS = window.localStorage; }catch(e){ LS = null; }
async function rawGet(){
  if(aCloud){ try{ const r=await window.storage.get(CLE,true); return (r&&r.value)?r.value:null; }catch(e){ return null; } }
  if(LS){ try{ return LS.getItem(CLE); }catch(e){ return null; } }
  return null;
}
async function rawSet(v){
  if(aCloud){ try{ const r=await window.storage.set(CLE,v,true); return !!r; }catch(e){ return false; } }
  if(LS){ try{ LS.setItem(CLE,v); return true; }catch(e){ return false; } }
  return false;
}

/* ---- Modèle de départ (liste réelle) ---- */
function nouvelId(){ return "c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }
function modeleDepart(){
  const mk = (numero,prenom,code,statut)=>({ id:nouvelId(), numero:String(numero), prenom, code, statut, note:"" });
  const hommes = [
    mk("1","HAKIM","724","occupe"), mk("2","IBRAHIMA M","725","occupe"),
    mk("3","DAMIR","952","occupe"), mk("4","ALI","614","occupe"),
    mk("5","KASSAM","742","occupe"), mk("6","RIAD (chauffeur)","368","occupe"),
    mk("7","","198","libre"), mk("8","MOHAMED P","697","occupe"),
    mk("9","WADNEL","849","occupe"), mk("10","ALIEU","493","occupe"),
    mk("11","CHARLES","624","occupe"), mk("12","DADA","948","occupe"),
    mk("13","IBRAHIM P","848","occupe"), mk("14","KINGOMA","794","occupe"),
    mk("15","CHEF","","reserve"), mk("16","","612","libre"),
    mk("17","HUGO","753","occupe"), mk("18","SOULE","728","occupe")
  ];
  const femmes = [
    mk("1","LEILA B","226","occupe"), mk("2","ZAWOIDI","617","occupe"),
    mk("3","LEILA B","358","occupe"), mk("4","LEILA K","912","occupe"),
    mk("5","ZAKIA","648","occupe"), mk("6","ZOHRA","418","occupe"),
    mk("7","ISABELLE","649","occupe"), mk("8","","342","libre"),
    mk("9","BLESSING","985","occupe"), mk("10","FARIDA","536","occupe"),
    mk("11","DICKEL","849","occupe"), mk("12","EMINE","149","occupe"),
    mk("13","NADJIA","742","occupe"), mk("14","AHIN","612","occupe"),
    mk("15","","752","libre"), mk("16","HOUARIA","","occupe"),
    mk("C1","IME","645","reserve"), mk("D4","IME","428","reserve"),
    mk("6F","","845","libre"), mk("5E","","632","libre"), mk("3A","","569","libre")
  ];
  const couloir = [];
  for(let i=1;i<=6;i++){ couloir.push(mk(i,"","","libre")); }
  return {
    version:4, updatedAt:0,
    zones:{
      hommes:{label:"Vestiaire Hommes", casiers:hommes},
      femmes:{label:"Vestiaire Femmes", casiers:femmes},
      couloir:{label:"Couloir", casiers:couloir}
    },
    codesGeneraux:[
      {id:nouvelId(),label:"Boîte à clef",code:"1056"},
      {id:nouvelId(),label:"Trottinette",code:"4792"},
      {id:nouvelId(),label:"Poulailler",code:"624"}
    ],
    historique:[],
    lock:{enabled:false,code:""}
  };
}

const ORDRE=["hommes","femmes","couloir"];
const LABELS={hommes:"Vestiaire Hommes",femmes:"Vestiaire Femmes",couloir:"Couloir"};
let state=null, filtre="", ongletActif="hommes", editionEnCours=false, deferredPrompt=null;

/* ---- Utilitaires ---- */
function $(id){return document.getElementById(id);}
function echapper(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function maintenantTexte(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;}

/* ---- Normalisation ---- */
function nettoyerCasier(c){
  if(!c||typeof c!=="object")return null;
  const statut=["occupe","libre","reserve"].includes(c.statut)?c.statut:"libre";
  return {id:c.id||nouvelId(),numero:String(c.numero==null?"":c.numero),prenom:String(c.prenom==null?"":c.prenom),code:String(c.code==null?"":c.code),statut,note:String(c.note==null?"":c.note)};
}
function normaliser(d){
  const base=modeleDepart();
  if(!d||typeof d!=="object")return base;
  const out={version:4,updatedAt:Number(d.updatedAt)||0,zones:{},codesGeneraux:[],historique:[],lock:{enabled:false,code:""}};
  const zsrc=(d.zones&&typeof d.zones==="object")?d.zones:{};
  for(const k of ORDRE){
    const z=zsrc[k]||{};
    out.zones[k]={label:(typeof z.label==="string"&&z.label.trim())?z.label:LABELS[k],casiers:Array.isArray(z.casiers)?z.casiers.map(nettoyerCasier).filter(Boolean):[]};
  }
  if(!zsrc.couloir&&out.zones.couloir.casiers.length===0)out.zones.couloir.casiers=base.zones.couloir.casiers;
  out.codesGeneraux=Array.isArray(d.codesGeneraux)&&d.codesGeneraux.length?d.codesGeneraux.map(c=>({id:c.id||nouvelId(),label:String(c.label||"Code"),code:String(c.code||"")})):base.codesGeneraux;
  out.historique=Array.isArray(d.historique)?d.historique.map(h=>({id:h.id||nouvelId(),ts:Number(h.ts)||0,dateTxt:String(h.dateTxt||""),texte:String(h.texte||"")})):[];
  if(d.lock&&typeof d.lock==="object")out.lock={enabled:!!d.lock.enabled,code:String(d.lock.code||"")};
  return out;
}

/* ---- Partage en ligne (Firebase) + cache local ---- */
const FB = "https://code-vestiaires-default-rtdb.europe-west1.firebasedatabase.app/vestiaires.json";
let enLigne = true;

function majStatut(etat){
  const t=$("statutTxt"); if(!t)return;
  const d=new Date(),p=n=>String(n).padStart(2,"0"),h=`${p(d.getHours())}:${p(d.getMinutes())}`;
  if(etat==="cloud"){ t.textContent=`🟢 Partagé ✓ ${h}`; t.style.color=""; t.style.opacity=".92"; }
  else if(etat==="local"){ t.textContent="🟡 Hors ligne — gardé sur l'appareil"; t.style.color="#ffe6b0"; t.style.opacity="1"; }
  else if(etat==="fail"){ t.textContent="⚠️ NON enregistré"; t.style.color="#ffd6ca"; t.style.opacity="1"; }
  else { t.textContent=`… ${h}`; t.style.opacity=".8"; }
}

/* Cache local (window.storage dans Claude, sinon localStorage) */
async function lireLocal(){ const v=await rawGet(); if(v){ try{ return normaliser(JSON.parse(v)); }catch(e){ return null; } } return null; }
async function ecrireLocal(){ try{ return await rawSet(JSON.stringify(state)); }catch(e){ return false; } }

/* Boîte commune en ligne */
async function cloudGet(){
  const r=await fetch(FB+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("http "+r.status);
  const j=await r.json();
  return j?normaliser(j):null;
}
async function cloudPut(obj){
  try{ const r=await fetch(FB,{method:"PUT",body:JSON.stringify(obj)}); return r.ok; }
  catch(e){ return false; }
}

/* Enregistre : cache local + boîte commune */
async function ecrireStockage(){
  state.updatedAt=Date.now();
  const okLocal=await ecrireLocal();
  const okCloud=await cloudPut(state);
  enLigne=okCloud;
  if(okCloud) majStatut("cloud");
  else if(okLocal) majStatut("local");
  else majStatut("fail");
  return okLocal||okCloud;
}
async function enregistrer(rerender=true){
  if(rerender) rendre();
  const ok=await ecrireStockage();
  if(!ok) toast("⚠️ Rien n'a pu être enregistré. Vérifie ta connexion internet.",4500);
  return ok;
}

/* Relit la boîte commune pour voir les changements des autres */
async function synchro(){
  if(editionEnCours) return;
  try{
    const remote=await cloudGet(); enLigne=true;
    if(remote && (remote.updatedAt||0)>(state.updatedAt||0)){
      state=remote; await ecrireLocal(); rendre(); majStatut("cloud"); toast("🔄 Liste mise à jour");
    }
  }catch(e){ enLigne=false; }
}

/* ================================================================
   AFFICHAGE
   ================================================================ */
function correspond(c){ if(!filtre)return true; const f=filtre.toLowerCase(); return (c.prenom||"").toLowerCase().includes(f)||(c.numero||"").toLowerCase().includes(f)||(c.code||"").toLowerCase().includes(f); }
function triCasiers(a,b){ const na=parseInt(a.numero,10),nb=parseInt(b.numero,10); if(!isNaN(na)&&!isNaN(nb))return na-nb; if(!isNaN(na))return -1; if(!isNaN(nb))return 1; return String(a.numero).localeCompare(String(b.numero)); }

function majEntete(){
  let libres=0,occ=0;
  for(const k of ORDRE){ for(const c of state.zones[k].casiers){ if(c.statut==="libre")libres++; else occ++; } }
  $("statLibres").textContent=libres; $("statOcc").textContent=occ;
  const cnt=k=>state.zones[k].casiers.length;
  $("cntH").textContent=cnt("hommes"); $("cntF").textContent=cnt("femmes"); $("cntC").textContent=cnt("couloir");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("actif",t.dataset.tab===ongletActif));
  $("rechercheWrap").style.display=(ongletActif==="histo")?"none":"block";
  const fab=$("fab");
  if(ongletActif==="histo"){ fab.classList.add("cache"); }
  else{ fab.classList.remove("cache"); $("fabTxt").textContent = ongletActif==="codes"?"Ajouter un code":"Ajouter un casier"; }
}

function rendre(){
  majEntete();
  const c=$("contenu");
  if(ongletActif==="codes"){ c.innerHTML=vueCodes(); return; }
  if(ongletActif==="histo"){ c.innerHTML=vueHisto(); return; }
  const z=state.zones[ongletActif];
  const casiers=z.casiers.slice().sort(triCasiers);
  const visibles=casiers.filter(correspond);
  if(casiers.length===0){ c.innerHTML=`<div class="vide-msg"><span class="emo">🗄️</span>Aucun casier ici pour l'instant.<br>Touche <b>＋ Ajouter</b> en bas.</div>`; return; }
  if(visibles.length===0){ c.innerHTML=`<div class="vide-msg"><span class="emo">🔎</span>Aucun résultat pour « ${echapper(filtre)} ».</div>`; return; }
  const libres=visibles.filter(x=>x.statut==="libre");
  const autres=visibles.filter(x=>x.statut!=="libre");
  let html="";
  if(libres.length){
    html+=`<div class="groupe-titre libre"><span class="rond"></span>CASIERS LIBRES — ${libres.length}<span class="trait"></span></div>`;
    html+=`<div class="grille">`+libres.map(cas=>carte(ongletActif,cas)).join("")+`</div>`;
  }
  if(autres.length){
    html+=`<div class="groupe-titre occ">Occupés / réservés — ${autres.length}<span class="trait"></span></div>`;
    html+=`<div class="grille">`+autres.map(cas=>carte(ongletActif,cas)).join("")+`</div>`;
  }
  c.innerHTML=html;
}

function carte(zoneKey,c){
  const vide=!c.prenom.trim();
  const prenom=vide?`<span class="prenom vide">— libre —</span>`:`<span class="prenom">${echapper(c.prenom)}</span>`;
  const etatTxt=c.statut==="occupe"?"Occupé":c.statut==="reserve"?"Réservé":"Libre";
  const code=c.code.trim()?`<span class="code-val">${echapper(c.code)}</span>`:`<span class="code-val vide">aucun</span>`;
  const note=c.note.trim()?`<div class="note">📝 ${echapper(c.note)}</div>`:"";
  const liberer=(c.statut!=="libre")?`<button class="pill liberer" data-action="liberer" data-zone="${zoneKey}" data-id="${c.id}">↩︎ Libérer</button>`:"";
  return `<div class="casier ${c.statut}" data-action="modifier" data-zone="${zoneKey}" data-id="${c.id}">
    <div class="cas-haut"><span class="num">${echapper(c.numero||"?")}</span>${prenom}<span class="etat ${c.statut}">${etatTxt}</span></div>
    <div class="code-box"><span class="code-lab">Cadenas</span>${code}</div>
    ${note}
    <div class="cas-bas">
      <button class="pill modifier" data-action="modifier" data-zone="${zoneKey}" data-id="${c.id}">✏️ Modifier</button>
      ${liberer}
    </div>
  </div>`;
}

function vueCodes(){
  let h=`<div class="grille">`;
  for(const g of state.codesGeneraux){
    h+=`<div class="code-carte">
      <button class="cc-suppr" data-action="suppr-code" data-id="${g.id}" title="Supprimer">×</button>
      <div class="cc-lab">🔑 ${echapper(g.label)}</div>
      <input type="text" inputmode="numeric" value="${echapper(g.code)}" data-code-id="${g.id}" placeholder="code…">
    </div>`;
  }
  h+=`</div>`;
  return h;
}
function vueHisto(){
  if(state.historique.length===0) return `<div class="vide-msg"><span class="emo">🕓</span>Aucun départ enregistré pour l'instant.</div>`;
  const liste=state.historique.slice().sort((a,b)=>b.ts-a.ts).slice(0,120);
  return `<div class="histo-carte">`+liste.map(h=>`<div class="histo-ligne"><span class="histo-date">${echapper(h.dateTxt)}</span><span class="histo-txt">${echapper(h.texte)}</span></div>`).join("")+`</div>`;
}

/* ================================================================
   ACTIONS
   ================================================================ */
function trouver(zoneKey,id){ const z=state.zones[zoneKey]; return z?z.casiers.find(c=>c.id===id)||null:null; }
function ajouterHistorique(t){ state.historique.push({id:nouvelId(),ts:Date.now(),dateTxt:maintenantTexte(),texte:t}); }

async function libererCasier(zoneKey,id){
  const c=trouver(zoneKey,id); if(!c)return;
  const qui=c.prenom.trim()||"casier";
  if(!confirm(`Libérer le casier ${c.numero} (${qui}) ?\nLe prénom et le code seront effacés, et le départ noté dans l'historique.`))return;
  ajouterHistorique(`Casier ${c.numero} (${state.zones[zoneKey].label}) libéré — ${c.prenom.trim()||"—"}${c.code.trim()?" · code "+c.code.trim():""}`);
  c.prenom="";c.code="";c.statut="libre";c.note="";
  await enregistrer(); toast(`Casier ${c.numero} libéré ✓`);
}
async function supprimerCasier(zoneKey,id){
  const z=state.zones[zoneKey]; z.casiers=z.casiers.filter(x=>x.id!==id);
  await enregistrer(); toast("Casier supprimé");
}

/* ---- Fenêtre casier ---- */
let editionId=null,editionZone=null,statutChoisi="occupe";
function choisirStatut(v){ statutChoisi=v; document.querySelectorAll("#fStatut button").forEach(b=>b.classList.toggle("actif",b.dataset.v===v)); }
function ouvrirCasier(mode,zoneKey,id){
  editionEnCours=true;
  if(mode==="modifier"){
    const c=trouver(zoneKey,id); if(!c){editionEnCours=false;return;}
    editionId=id; editionZone=zoneKey;
    $("fenCasierTitre").textContent="Modifier le casier";
    $("fSupprimer").style.display="block";
    $("fZone").value=zoneKey; $("fNum").value=c.numero; $("fPrenom").value=c.prenom; $("fCode").value=c.code; $("fNote").value=c.note;
    choisirStatut(c.statut);
  }else{
    editionId=null; editionZone=null;
    $("fenCasierTitre").textContent="Nouveau casier";
    $("fSupprimer").style.display="none";
    $("fZone").value=(zoneKey&&zoneKey!=="codes"&&zoneKey!=="histo")?zoneKey:"hommes";
    $("fNum").value="";$("fPrenom").value="";$("fCode").value="";$("fNote").value="";
    choisirStatut("occupe");
  }
  $("fenCasier").classList.add("ouvert");
  setTimeout(()=>$("fNum").focus(),80);
}
function fermerCasier(){ $("fenCasier").classList.remove("ouvert"); editionEnCours=false; }
async function enregistrerCasier(){
  const zone=$("fZone").value, numero=$("fNum").value.trim(), prenom=$("fPrenom").value.trim(), code=$("fCode").value.trim(), note=$("fNote").value.trim();
  if(!numero){ toast("Indique au moins un numéro."); $("fNum").focus(); return; }
  let statut=statutChoisi; if(prenom&&statut==="libre")statut="occupe";
  if(editionId){
    const c=trouver(editionZone,editionId);
    if(c){
      if(zone!==editionZone){ state.zones[editionZone].casiers=state.zones[editionZone].casiers.filter(x=>x.id!==editionId); c.numero=numero;c.prenom=prenom;c.code=code;c.statut=statut;c.note=note; state.zones[zone].casiers.push(c); }
      else{ c.numero=numero;c.prenom=prenom;c.code=code;c.statut=statut;c.note=note; }
    }
  }else{ state.zones[zone].casiers.push({id:nouvelId(),numero,prenom,code,statut,note}); }
  ongletActif=zone;
  fermerCasier(); await enregistrer(); toast(editionId?"Modifié ✓":"Ajouté ✓");
}

/* ---- Réglages ---- */
let lockChoisi="off";
function majLock(){ document.querySelectorAll("#rLock button").forEach(b=>b.classList.toggle("actif",b.dataset.v===lockChoisi)); $("rCode").style.display=lockChoisi==="on"?"block":"none"; }
function ouvrirReglages(){ editionEnCours=true; lockChoisi=state.lock.enabled?"on":"off"; majLock(); $("rCode").value=state.lock.code||""; $("fenReglages").classList.add("ouvert"); }
function fermerReglages(){ $("fenReglages").classList.remove("ouvert"); editionEnCours=false; }
async function enregistrerReglages(){
  if(lockChoisi==="on"){ const code=$("rCode").value.trim(); if(!code){toast("Choisis un code ou mets « Non ».");return;} state.lock={enabled:true,code}; }
  else state.lock={enabled:false,code:""};
  fermerReglages(); await enregistrer(false); toast("Réglages enregistrés ✓");
}

/* ---- Export / Import ---- */
function exporter(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date(),p=n=>String(n).padStart(2,"0");
  a.href=url; a.download=`vestiaires_sauvegarde_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast("Sauvegarde téléchargée 💾");
}
function importer(file){
  const r=new FileReader();
  r.onload=async()=>{ try{ const o=JSON.parse(r.result); if(!confirm("Remplacer la liste actuelle par ce fichier ?"))return; state=normaliser(o); await enregistrer(); toast("Liste importée ✓"); }catch(e){ toast("Fichier illisible."); } };
  r.readAsText(file);
}

/* ---- Impression ---- */
function preparerImpression(){
  const bloc=k=>{ const zn=state.zones[k],cas=zn.casiers.slice().sort(triCasiers); let r=`<div class="p-zone"><h2>${echapper(zn.label)}</h2>`; if(!cas.length)r+=`<div class="p-row"><span class="p-nom" style="color:#777">(vide)</span></div>`; for(const c of cas)r+=`<div class="p-row"><span class="p-num">${echapper(c.numero)}</span><span class="p-nom">${echapper(c.prenom.trim()||"—")}</span><span class="p-code">${echapper(c.code.trim()||"—")}</span></div>`; return r+`</div>`; };
  let gen=`<div class="p-zone"><h2>Codes généraux</h2>`; for(const g of state.codesGeneraux)gen+=`<div class="p-row"><span class="p-nom">${echapper(g.label)}</span><span class="p-code">${echapper(g.code.trim()||"—")}</span></div>`; gen+=`</div>`;
  $("impression").innerHTML=`<div class="p-tete"><h1>Vestiaires — La Table de Cana</h1><div class="p-date">Mis à jour le ${maintenantTexte()}</div></div><div class="p-cols">${bloc("hommes")}${bloc("femmes")}</div><div class="p-cols" style="margin-top:6mm">${bloc("couloir")}${gen}</div>`;
}

/* ---- Installation (PWA) ---- */
function estInstallee(){ try{ return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true; }catch(e){ return false; } }
function montreBoutonInstaller(){ const b=$("btnInstaller"); if(b && !estInstallee()) b.style.display="inline-flex"; }
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; montreBoutonInstaller(); });
window.addEventListener("appinstalled",()=>{ const b=$("btnInstaller"); if(b)b.style.display="none"; deferredPrompt=null; toast("Appli installée ✓"); });
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw-vestiaires.js").catch(()=>{}); }); }
async function installer(){
  if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; return; }
  const ua=navigator.userAgent||"";
  const iOS=/iPad|iPhone|iPod/.test(ua);
  if(iOS){ alert("Sur iPhone :\n\n1. Touche le bouton Partager (carré avec une flèche ↑) en bas de Safari.\n2. Choisis « Sur l'écran d'accueil ».\n3. Touche « Ajouter ».\n\nL'icône Vestiaires apparaîtra comme une vraie appli."); }
  else{ alert("Sur Android :\n\n1. Touche le menu ⋮ en haut à droite du navigateur.\n2. Choisis « Ajouter à l'écran d'accueil » (ou « Installer l'application »).\n3. Confirme.\n\nL'icône Vestiaires apparaîtra comme une vraie appli."); }
}

/* ---- Verrou ---- */
function verifierVerrou(){ if(state.lock&&state.lock.enabled&&state.lock.code){ $("verrou").classList.add("ouvert"); setTimeout(()=>$("verrouCode").focus(),120); } }
function deverrouiller(){ if($("verrouCode").value.trim()===state.lock.code){ $("verrou").classList.remove("ouvert"); $("verrouErr").textContent=""; $("verrouCode").value=""; } else { $("verrouErr").textContent="Code incorrect."; $("verrouCode").value=""; $("verrouCode").focus(); } }

/* ---- Toast ---- */
let toastTimer=null;
function toast(msg,duree=2600){ const t=$("toast"); t.textContent=msg; t.classList.add("montre"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("montre"),duree); }

/* ================================================================
   ÉVÉNEMENTS
   ================================================================ */
function brancher(){
  $("tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(!t)return; ongletActif=t.dataset.tab; filtre=""; $("recherche").value=""; rendre(); window.scrollTo({top:0,behavior:"smooth"}); });
  $("recherche").oninput=e=>{ filtre=e.target.value.trim(); rendre(); };
  $("fab").onclick=()=>{ if(ongletActif==="codes"){ state.codesGeneraux.push({id:nouvelId(),label:"Nouveau code",code:""}); enregistrer(); toast("Code ajouté — modifie-le."); } else { ouvrirCasier("ajouter",ongletActif); } };
  $("btnImprimer").onclick=()=>{ preparerImpression(); setTimeout(()=>window.print(),80); };
  $("btnReglages").onclick=ouvrirReglages;
  $("btnInstaller").onclick=installer;

  $("contenu").addEventListener("click",e=>{
    const b=e.target.closest("[data-action]"); if(!b)return;
    const{action,zone,id}=b.dataset;
    if(action==="modifier"){ e.stopPropagation(); ouvrirCasier("modifier",zone,id); }
    else if(action==="liberer"){ e.stopPropagation(); libererCasier(zone,id); }
    else if(action==="suppr-code"){ if(confirm("Supprimer ce code ?")){ state.codesGeneraux=state.codesGeneraux.filter(x=>x.id!==id); enregistrer(); } }
  });
  $("contenu").addEventListener("change",async e=>{ const inp=e.target.closest("[data-code-id]"); if(!inp)return; const g=state.codesGeneraux.find(x=>x.id===inp.dataset.codeId); if(g){ g.code=inp.value.trim(); await enregistrer(false); toast("Code enregistré ✓"); } });

  $("fAnnuler").onclick=fermerCasier;
  $("fEnregistrer").onclick=enregistrerCasier;
  $("fSupprimer").onclick=async()=>{ if(!editionId)return; if(!confirm("Supprimer définitivement ce casier ?"))return; const z=editionZone,i=editionId; fermerCasier(); await supprimerCasier(z,i); };
  document.querySelectorAll("#fStatut button").forEach(b=>b.onclick=()=>choisirStatut(b.dataset.v));
  $("fenCasier").addEventListener("click",e=>{ if(e.target.id==="fenCasier")fermerCasier(); });
  $("fCode").addEventListener("keydown",e=>{ if(e.key==="Enter")enregistrerCasier(); });

  $("rFermer").onclick=fermerReglages;
  $("rEnregistrer").onclick=enregistrerReglages;
  $("rInstaller").onclick=installer;
  $("rExport").onclick=exporter;
  $("rImport").onclick=()=>$("fichierImport").click();
  $("fichierImport").onchange=e=>{ if(e.target.files[0])importer(e.target.files[0]); e.target.value=""; };
  document.querySelectorAll("#rLock button").forEach(b=>b.onclick=()=>{ lockChoisi=b.dataset.v; majLock(); });
  $("rViderHisto").onclick=async()=>{ if(!confirm("Vider TOUT l'historique ? (irréversible)"))return; state.historique=[]; await enregistrer(); toast("Historique vidé."); };
  $("rReset").onclick=async()=>{ if(!confirm("Remplacer TOUTE la liste par la liste d'origine (pré-remplie) ?\nTes modifications récentes seront perdues."))return; state=modeleDepart(); ongletActif="hommes"; fermerReglages(); await enregistrer(); toast("Liste d'origine rechargée ✓"); };
  $("fenReglages").addEventListener("click",e=>{ if(e.target.id==="fenReglages")fermerReglages(); });

  $("verrouBtn").onclick=deverrouiller;
  $("verrouCode").addEventListener("keydown",e=>{ if(e.key==="Enter")deverrouiller(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ fermerCasier(); fermerReglages(); } });
}

/* ================================================================
   DÉMARRAGE
   ================================================================ */
async function demarrer(){
  brancher();
  // 1) affichage instantané depuis le cache local (si présent)
  const local = await lireLocal();
  if(local) state = local;
  // 2) on récupère la version partagée (boîte commune)
  let remote=null, online=false;
  try{ remote = await cloudGet(); online=true; }catch(e){ online=false; }
  if(online){
    if(remote && (!state || (remote.updatedAt||0) >= (state.updatedAt||0))){
      state = remote; await ecrireLocal(); majStatut("cloud");
    }else if(state){
      await cloudPut(state); majStatut("cloud");           // local plus récent ou boîte vide -> on envoie
    }else{
      state = modeleDepart(); await cloudPut(state); await ecrireLocal(); majStatut("cloud");
    }
  }else{
    if(!state) state = modeleDepart();
    majStatut("local");
  }
  rendre();
  verifierVerrou();
  montreBoutonInstaller();
  // relecture régulière pour voir les changements des autres appareils
  setInterval(synchro, 6000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) synchro(); });
  window.addEventListener("online", synchro);
}
demarrer();
</script>
