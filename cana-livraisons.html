<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cana Livraisons — Planning PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%}
:root{--ac:#AD1457;--bg:#eef1f6;--card:#fff;--cs:15px;--rh:28px;--pscale:1}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#0f172a;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:0 0 auto;background:linear-gradient(100deg,#9c1248,#AD1457 40%,#C2185B);color:#fff;padding:9px 14px;box-shadow:0 4px 16px rgba(173,20,87,.3);z-index:30}
.row1,.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.25)}
h1{font-size:17px;margin:0;font-weight:900;white-space:nowrap;display:flex;gap:7px;align-items:center}
.spacer{flex:1}
.nav{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);padding:4px;border-radius:12px}
button{font-family:inherit;font-weight:700;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
button:active{transform:scale(.96)}
.nav button{background:#fff;color:var(--ac);font-size:18px;padding:5px 14px;line-height:1}.nav button:hover{background:#ffe3ef}
#dateLabel{color:#fff;font-weight:800;min-width:230px;text-align:center;font-size:15px}
#search{padding:8px 12px;border-radius:9px;border:0;font-size:14px;width:190px;font-weight:600}
.btn-today{background:#1b5e20;color:#fff}.btn-print{background:#0d47a1;color:#fff}
.btn-nav{background:#fff;color:var(--ac);font-size:15px;padding:9px 16px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-weight:800}.btn-nav:hover{background:#ffe3ef}
.palette{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.16);padding:4px 7px;border-radius:12px}
.palette small{color:#fff;font-weight:700}
.sw{width:23px;height:23px;border-radius:6px;border:2px solid #fff;cursor:pointer;padding:0;font-size:9px;color:#333}
.sw.auto{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#F8BBD0 4px,#F8BBD0 8px)}
.ctl{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.16);padding:3px 7px;border-radius:12px;color:#fff;font-weight:700;font-size:12px}
.ctl button{background:#fff;color:var(--ac);padding:3px 9px}
#saved{color:#d7ffd9;font-weight:700;font-size:11.5px;min-width:150px}
#count{color:#fff;font-weight:700;font-size:12px;background:rgba(0,0,0,.18);padding:3px 9px;border-radius:20px}
.tools{display:flex;gap:5px;flex-wrap:wrap}.tools button{background:rgba(255,255,255,.92);color:#0f172a}.tools button.danger{background:#ffcdd2;color:#b71c1c}.tools button.on{background:#0d47a1;color:#fff}
main{flex:1 1 auto;overflow:auto;padding:8px 10px}
table{border-collapse:collapse;width:100%;height:100%;background:var(--card);box-shadow:0 6px 20px rgba(15,23,42,.1);table-layout:fixed}
th,td{border:1px solid #c9ced6;overflow:hidden}
td.ed{padding:2px 6px;font-weight:700;cursor:text;height:auto;min-height:var(--rh);white-space:pre-wrap;word-break:break-word;vertical-align:top}
td.ed:focus{outline:3px solid var(--ac);outline-offset:-3px}
td.cellcs{font-size:var(--cs)}
td.sel{outline:3px solid #0d47a1;outline-offset:-3px;box-shadow:inset 0 0 0 100px rgba(13,71,161,.14)}
.h18{font-size:18px!important;font-weight:900!important;text-align:center}
.debcell{font-size:15px!important;font-weight:900!important;text-align:center;color:#0d47a1}
.timecell{background:#e9edf2;font-weight:800;text-align:center;width:66px;font-size:12px}
.lbl{background:#1f2937;color:#fff;font-weight:800;text-align:center;font-size:11px;width:66px}
#navbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:8px;background:rgba(173,20,87,.96);padding:6px 8px;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#navbar button{background:#fff;color:var(--ac);font-size:15px;padding:9px 18px}
#results{position:fixed;right:14px;top:120px;width:min(680px,92vw);max-height:70vh;overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px 16px;display:none;z-index:50}
#results h3{margin:0 0 8px;color:var(--ac)}#results td,#results th{padding:5px 8px;text-align:left;font-size:13px;border:1px solid #eee}
#results a{color:#0d47a1;font-weight:700;text-decoration:none}.badge{background:#1b5e20;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
#results .close{position:sticky;top:0;float:right;background:#eee;color:#333;border-radius:8px}
.attcell{text-align:center;font-size:11px;background:#FFF8E1;vertical-align:middle}
.attcell .fn{display:block;color:#0d47a1;cursor:pointer;text-decoration:underline;font-weight:700;font-size:11px;line-height:1.3}
.attadd{background:#fff;border:1px solid #ccc;border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:700;color:#AD1457}
.attrm{color:#b71c1c;cursor:pointer;font-weight:700;margin-left:4px}
.fsbadge{padding:5px 12px;border-radius:20px;font-weight:800;font-size:12px;white-space:nowrap}
.fson{background:#1b5e20;color:#fff}
.fsoff{background:#ffca28;color:#5d4037}
#driverPrint{display:none}
@media print{body.printdriver main,body.printdriver #navbar{display:none!important}
 body.printdriver #driverPrint{display:block}
 #driverPrint .dpage{page-break-after:always;padding:3mm}
 #driverPrint h1{font-size:24px;margin:0}#driverPrint .sub{font-size:15px;color:#333;margin:2px 0 8px}
 #driverPrint .meta{font-size:16px;font-weight:800;margin-bottom:10px;color:#AD1457}
 #driverPrint table{width:100%;border-collapse:collapse}
 #driverPrint td{border:1.5px solid #222;padding:7px 9px;font-size:16px;font-weight:700}
 #driverPrint td.t{width:72px;background:#eee;text-align:center}}
#printArea{display:none}
@media print{
 body.printing header,body.printing main,body.printing #navbar,body.printing #results,body.printing #modal,body.printing #driverPrint{display:none!important}
 body.printing #printArea{display:block}
 #printArea h1{text-align:center;font-size:17px;margin:0 0 5px;font-weight:900}
 #printArea .pg{width:100%;border-collapse:collapse;table-layout:fixed}
 #printArea .pg td{border:1px solid #777;padding:2px 5px;font-weight:700;overflow:hidden;font-size:12px;white-space:pre-wrap;word-break:break-word;vertical-align:top;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #printArea .pg .lbl{background:#1f2937;color:#fff;text-align:center;font-size:10px}
 #printArea .pg .tcell{background:#e9edf2;text-align:center;font-size:10px}
 #printArea .pg .h18{font-weight:900;text-align:center;font-size:13px}
 #printArea .pg .deb{font-weight:900;text-align:center;color:#0d47a1}
 #printArea .pg .hd{font-weight:900;text-align:center;background:#dfe3ea;font-size:12px}
 #printArea .brk{page-break-after:always}
}
.print-title{display:none}
td.hasbon{position:relative}
td.hasbon::after{content:"📎";position:absolute;top:-2px;right:1px;font-size:11px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:18px}
#modal .box{background:#fff;border-radius:16px;max-width:1100px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#modal h2{margin:0 0 8px;color:var(--ac);font-size:18px}
#modal table{width:100%;height:auto;box-shadow:none;table-layout:auto}
#modal td,#modal th{border:1px solid #ddd;padding:5px 7px;height:auto;font-size:13px;text-align:left}
#modal input,#modal select{font-family:inherit;font-size:13px;padding:5px 6px;border:1px solid #ccc;border-radius:6px;width:100%}
#modal .act{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#modal .place{background:#1b5e20;color:#fff;padding:11px 22px;font-size:15px}
#modal .cancel{background:#eee;color:#333;padding:11px 20px}
@media print{
 header,#results,#navbar,#modal,.attadd,.attrm{display:none!important}
 html,body{height:auto;overflow:visible}
 main{padding:0;overflow:visible;height:auto}
 
 table{box-shadow:none}
 #grid{zoom:var(--pscale,1)}
 tr{page-break-inside:avoid}
 td.ed{height:auto}
 .h18{font-size:19px!important}.debcell{font-size:16px!important}.timecell,.lbl{font-size:12px!important}
 .print-title{display:block!important;text-align:center;font-weight:900;font-size:17px;margin:0 0 4px}
}
</style></head>
<body>
<header>
 <div class="row1">
   <h1>🚚 CANA LIVRAISONS</h1>
   <div class="nav"><button onclick="go(-1)" title="Jour précédent">◀</button><span id="dateLabel"></span><button onclick="go(1)" title="Jour suivant">▶</button></div>
   <button class="btn-today" onclick="today()">📅 Aujourd'hui</button>
   <input type="date" id="datePick" onchange="pick(this.value)">
   <span id="count"></span>
   <span id="fsStatus" class="fsbadge fsoff">⚠️ Sauvegarde PC : clique 📁</span>
   <div class="spacer"></div>
   <button class="btn-nav" onclick="go(-1)">◀ Jour précédent</button>
   <button class="btn-nav" onclick="go(1)">Jour suivant ▶</button>
   <div class="spacer"></div>
   <input id="search" placeholder="🔎 Rechercher…" oninput="search(this.value)">
   <button class="btn-print" onclick="printDay()">🖨️ Imprimer (jour)</button>
   <button class="btn-chauf" onclick="clOuvrir()">📱 Chauffeurs</button>
   <button class="btn-chauf" style="background:#1b5e20!important" onclick="bnPanel()">🗂️ Bons</button>
   <button class="btn-cli" onclick="clFichesOuvrir()">📇 Clients</button>
   <button class="btn-cli" id="hcBtn" onclick="hcPanel()">🛒 Hors carte</button>
   <button class="btn-cli" onclick="pqPanel()">🚚 Camions</button>
   <button class="btn-cli" onclick="clDiagnostic()">🩺 Vérifier</button>
   <button class="btn-cli" onclick="clSuiviOuvrir()">📸 Suivi</button>
   <button class="btn-cli" onclick="clMsgOuvrir()">💬</button>
   <span id="clModeBadge" onclick="clOuvrir()" title="Clique pour ouvrir l’envoi et décocher le mode test" style="display:none;cursor:pointer;background:#fff3cd;color:#7a4b00;font-weight:900;font-size:12.5px;padding:5px 10px;border-radius:9px">🧪 MODE TEST : rien ne part aux chauffeurs</span>
   <span id="clAutoBadge" style="display:none;color:#fff;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:9px"></span>
 </div>
 <div class="row2">
   <div class="palette"><small>🎨</small><span id="swatches"></span></div>
   <div class="ctl"><span>🔠 Page</span><button onmousedown="event.preventDefault();cs(-1)">A−</button><span id="csval">14</span><button onmousedown="event.preventDefault();cs(1)">A+</button></div>
   <div class="ctl"><span>🔎 Case</span><button onmousedown="event.preventDefault();cellSize(-1)">A−</button><button onmousedown="event.preventDefault();cellSize(1)">A+</button></div>
   <span id="saved"></span>
   <div class="spacer"></div>
   <div class="tools">
     <button onclick="document.getElementById('bonsimp').click()" style="background:#0d47a1;color:#fff">📥 Importer bons</button>
     <button onclick="undo()" title="Annuler (Ctrl+Z)">↶ Annuler</button>
     <button onclick="printByDriver()">🖨️ Jour/chauffeur</button>
     <button onclick="printDriverWeek()">🗓️ Semaine/chauffeur</button>
     <button onclick="printWeekA3()">🗓️ Semaine A3</button>
     <button id="selBtn" onclick="toggleSel()">🖱️ Sélection multiple</button>
     <button onclick="clearSel()">🧽 Effacer sélection</button>
     <button onclick="copySel(false)">📋 Copier</button>
     <button onclick="copySel(true)">✂️ Couper</button>
     <button onclick="pasteSel()">📌 Coller</button>
     <button onclick="dupNext()">📑 Dupliquer → lendemain</button>
     <button id="fileBtn" onclick="linkFile()" style="background:#1b5e20;color:#fff">📁 Sauvegarde PC</button>
     <button onclick="openExisting()">📂 Rouvrir fichier</button>
     <button onclick="linkBackupDir()">🗂️ Sauvegardes auto</button>
     <button onclick="saveFile()">💾 Copie</button>
     <button onclick="document.getElementById('imp').click()">📂 Restaurer copie</button>
     <button onclick="exportCSV()">⬇️ Historique</button>
     <button onclick="sabSummary()" style="background:#6a1b9a;color:#fff">📊 Samedis</button>
     <button class="danger" onclick="clearDay()">🧹 Vider jour</button>
   </div>
   <input type="file" id="imp" accept=".json" style="display:none" onchange="loadFile(this.files[0])">
   <input type="file" id="bonsimp" accept="application/pdf" multiple style="display:none" onchange="importBons(this.files);this.value='';">
 </div>
</header>
<main><div class="print-title" id="ptitle"></div><div id="grid" style="height:100%"></div></main>
<div id="results"></div>
<div id="driverPrint"></div>
<div id="printArea"></div>
<div id="modal"><div class="box"><h2>📥 Bons d'expédition lus — vérifie puis place</h2><div id="modalBody"></div><div class="act"><button class="cancel" onclick="closeModal()">Annuler</button><button class="place" onclick="placeBons()">✅ Placer dans le planning</button></div></div></div>

 return {date,heure,heurePour:pour,heureLiv:liv,fen,chauffeur:drivers.join(' / '),camion:truck,client,bonNo,col:''};
}
function reconstructText(items){const L={};items.forEach(function(it){const y=Math.round((it.transform&&it.transform[5])||0);(L[y]=L[y]||[]).push([(it.transform&&it.transform[4])||0,it.str]);});const ys=Object.keys(L).map(Number).sort(function(a,b){return b-a;});return ys.map(function(y){return L[y].sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];}).join(' ').replace(/\s+/g,' ').trim();}).filter(Boolean).join('\n');}
async function makeBonPdf(srcBytes,pages){const src=await PDFLib.PDFDocument.load(srcBytes);const out=await PDFLib.PDFDocument.create();const cp=await out.copyPages(src,pages);cp.forEach(function(pg){out.addPage(pg);});const bytes=await out.save();return new Blob([bytes],{type:'application/pdf'});}
async function importBons(files){
 if(!files||!files.length)return;
 if(!window.pdfjsLib){alert("Le lecteur PDF n'est pas disponible (verifie la connexion internet pour la 1re utilisation).");return;}
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){}
 parsedBons=[];
 for(const f of files){
   try{
     const ab=await f.arrayBuffer();const srcBytes=new Uint8Array(ab);
     const pdf=await pdfjsLib.getDocument({data:srcBytes.slice(0)}).promise;
     let groups=[],lastNo=null;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const t=reconstructText(tc.items);
       const nm=t.match(/N\u00b0\s*(C\d+)/);const no=nm?nm[1]:lastNo;lastNo=no||lastNo;
       if(groups.length&&groups[groups.length-1].no===no){groups[groups.length-1].text+=' \n'+t;groups[groups.length-1].pages.push(i-1);}
       else groups.push({no:no,text:t,pages:[i-1]});
     }
     groups.forEach(function(g){const b=parseBon(g.text);if(b.date||b.client||b.bonNo){b.name=((b.client||'bon').replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,24)||'bon')+'.pdf';b.pages=g.pages;b.srcBytes=srcBytes;b.blob=f;b.skip=false;parsedBons.push(b);}});
   }catch(e){parsedBons.push({name:f.name,error:true,skip:true,date:'',heure:'',chauffeur:'',camion:'',client:'',fen:'',bonNo:'',col:''});}
 }
 parsedBons.sort(function(a,b){return ((a.date||'')+(a.heure||'')).localeCompare((b.date||'')+(b.heure||''));});
 showReview();
}

function placeBons(){
 snapshot(); let placed=0;
 parsedBons.forEach(function(b){
   if(b.skip||b.error||!b.date)return;
   ensure(b.date);var day=store[b.date];
   var drivers=(b.chauffeur||"").split(/[\/+&,]+/).map(function(s){return s.trim();}).filter(Boolean);
   var ci=-1;
   if(b.col){ci=(+b.col)-1;}                       // colonne choisie 1-6
   else{
     var nt=norm(b.camion);
     // le prénom du livreur passe en premier (c'est lui qui recevra la mission sur son téléphone)
     if(drivers.length)for(var j=0;j<6;j++){if(day.ch[j].t&&drivers.some(function(dr){return norm(day.ch[j].t).includes(norm(dr));})){ci=j;break;}}
     if(ci<0&&nt)for(var i=0;i<6;i++){if(day.cam[i].t&&norm(day.cam[i].t).includes(nt)){ci=i;break;}}
     if(ci<0)for(var k=0;k<6;k++){if(!day.cam[k].t&&!day.ch[k].t){ci=k;break;}}
     if(ci<0)ci=0;
   }
   if(ci<0||ci>5)ci=0;
   if(b.camion&&!day.cam[ci].t)day.cam[ci].t=b.camion;
   if(drivers.length&&!day.ch[ci].t)day.ch[ci].t=drivers.join("/");
   var ri=TIMES.indexOf(snap(b.heure));if(ri<0)ri=0;
   while(ri<TIMES.length&&day.cells[ri+"_"+ci]&&day.cells[ri+"_"+ci].t)ri++;
   if(ri>=TIMES.length){ri=TIMES.indexOf(snap(b.heure));if(ri<0)ri=0;}
   var txt=(b.client||"⚠ CLIENT ?")+(b.heure?" "+b.heure.replace(":","H"):"");
   var o=cel(txt);o.c="#43A047";
   var id="f"+Date.now()+Math.floor(Math.random()*1e6);o.att={id,name:b.name||"bon.pdf"};try{o.bon={no:b.bonNo||"",client:b.client||"",heure:b.heure||"",adresse:b.adresse||"",tel:b.tel||"",code:b.code||"",texte:(b.texte||"").slice(0,3000)};clFicheFromBon(b);}catch(e){}try{bnAutoCloud(b,o);}catch(e){}
   if(b.srcBytes&&b.pages&&window.PDFLib){makeBonPdf(b.srcBytes,b.pages).then(function(bl){idbPut(id,bl);}).catch(function(){if(b.blob)idbPut(id,b.blob);});}else if(b.blob){idbPut(id,b.blob);}
   day.cells[ri+"_"+ci]=o;placed++;
 });
 lsSave();closeModal();
 var first=parsedBons.find(function(b){return !b.skip&&!b.error&&b.date;});
 if(first){cur=first.date;render();fit();}
 alert(placed+" bon(s) placé(s) ✅  (double-clic sur une case 📎 pour rouvrir le bon)");
}

 const CE=selMode?"":"contenteditable";

function selectRect(r1,c1,r2,c2){sel.clear();document.querySelectorAll("td.sel").forEach(e=>e.classList.remove("sel"));const R1=Math.min(r1,r2),R2=Math.max(r1,r2),C1=Math.min(c1,c2),C2=Math.max(c1,c2);for(let R=R1;R<=R2;R++)for(let C=C1;C<=C2;C++){const id=idFor(R,C);sel.add(id);const e=document.getElementById(id);if(e)e.classList.add("sel");}}

function copySel(cut){
 let co=selCoords();
 if(!co.length){alert("Sélectionne une case ou une colonne d'abord (bouton « 🖱️ Sélection multiple » puis glisse).");return;}
 let minR=Math.min.apply(null,co.map(x=>x[0])),minC=Math.min.apply(null,co.map(x=>x[1]));
 clip=co.map(function(rc){var o=readO(rc[0],rc[1]);return{dr:rc[0]-minR,dc:rc[1]-minC,t:o.t,c:o.c,s:o.s||0};});
 if(cut){snapshot();co.forEach(function(rc){writeO(rc[0],rc[1],{t:"",c:"",s:0});});lsSave();render();}
 alert((cut?"✂️ Coupé":"📋 Copié")+" : "+clip.length+" case(s).\nClique la case de DESTINATION (coin haut-gauche) — tu peux changer de jour — puis « 📌 Coller ».");
}

}

// ----- clavier : flèches ↑ ↓ ← → + Entrée + Tab -----
function caretStart(){const s=getSelection();return !s.rangeCount||s.anchorOffset===0;}
function caretEnd(el){const s=getSelection();return !s.rangeCount||s.anchorOffset>=(el.innerText||"").length;}
function focusRC(R,C){R=Math.max(0,Math.min(NR-1,R));C=Math.max(0,Math.min(5,C));const el=document.getElementById(idFor(R,C));if(el){el.focus();try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&(e.key||"").toLowerCase()==="z"){e.preventDefault();undo();return;}if(selMode){if((e.ctrlKey||e.metaKey)&&["c","x","v"].includes((e.key||"").toLowerCase())){e.preventDefault();var kk=e.key.toLowerCase();if(kk==="c")copySel(false);else if(kk==="x")copySel(true);else pasteSel();}return;}const a=document.activeElement;const pr=a&&parseId(a.id);if(!pr)return;let[R,C]=pr;
 if(e.key==="ArrowUp"){e.preventDefault();focusRC(R-1,C);}
 else if(e.key==="ArrowDown"){e.preventDefault();focusRC(R+1,C);}
 else if(e.key==="ArrowLeft"){if(caretStart()){e.preventDefault();focusRC(R,C-1);}}
 else if(e.key==="ArrowRight"){if(caretEnd(a)){e.preventDefault();focusRC(R,C+1);}}
 else if(e.key==="Tab"){e.preventDefault();let nc=C+1,nr=R;if(nc>5){nc=0;nr=R+1;}focusRC(nr,nc);}
});

function gridTable(cols,heads){
 var h='<table class="pg"><colgroup><col style="width:15mm">'+cols.map(function(){return '<col>';}).join("")+'</colgroup>';
 if(heads){h+='<tr><td class="lbl"></td>'+cols.map(function(c){return '<td class="hd">'+esc(c.head||"")+'</td>';}).join("")+'</tr>';}

 for(var ri=0;ri<TIMES.length;ri++){(function(ri){h+='<tr><td class="tcell">'+TIMES[ri]+'</td>'+cols.map(function(c){var o=c.cell(ri)||{};return pgCell(o.c||autoCell(o.t),o.t);}).join("")+'</tr>';})(ri);}
 return h+'</table>';
}

   var cols=days.map(function(d){var dd=store[d];return {ci:ci,head:shortDay(d),cam:dd.cam[ci],ch:dd.ch[ci],deb:dd.deb[ci],cell:function(ri){return dd.cells[ri+"_"+ci];}};});
   html+='<div class="brk"><h1>'+esc(DRIVERS[ci])+' — semaine du '+days[0].split("-").reverse().join("/")+'</h1>'+gridTable(cols,true)+'</div>';
 })(i);}
 if(!n){alert("Rien à imprimer cette semaine.");return;}
 openPrint("A4 landscape",185,html);
}

function clIgnoreList(){return (clCfg.ignore||'').split(/[\n;]+/).map(function(s){return norm(s).replace(/[^A-Z0-9]/g,'');}).filter(function(s){return s.length>=4;});}
function clIgnored(v){var k=norm(v).replace(/[^A-Z0-9]/g,'');return clIgnoreList().some(function(x){return k.indexOf(x)>=0||x.indexOf(k)>=0;});}
function clExtract(T,client){
  var F=(T||'').replace(/[ \t]+/g,' ');
  var start=0;
  if(client){var i=norm(F).indexOf(norm(client));if(i>=0)start=i;}
  function firstMatch(re,txt){var m,all=[];re.lastIndex=0;while((m=re.exec(txt))){all.push(m);}return all;}
  // téléphone : on cherche d'abord APRÈS le nom du client
  var telRe=/0[1-9](?:[\s.\-]?\d{2}){4}/g, tel='';
  [F.slice(start),F].some(function(zone){return firstMatch(telRe,zone).some(function(m){var v=m[0].replace(/[\s.\-]/g,'').replace(/(\d{2})(?=\d)/g,'$1 ');if(!clIgnored(v)){tel=v;return true;}return false;});});
  // adresse : numéro + voie, puis code postal + ville
  var adrRe=/\d{1,4}\s*(?:bis|ter)?[,\s]+(?:rue|avenue|av\.?|boulevard|bd|chemin|ch\.?|impasse|all[ée]e|place|cours|quai|traverse|route|montée|mont[ée]e|square|parc|r[ée]sidence|lotissement|zac|za)\b[^\n]{0,60}/gi;
  var cpRe=/\b(13\d{3}|83\d{3}|84\d{3}|04\d{3}|30\d{3}) +([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ \-']{2,30})/g;
  var adr='';
  [F.slice(start),F].some(function(zone){return firstMatch(adrRe,zone).some(function(m){var v=m[0].trim().replace(/\s+(T[EÉ]L|TEL|FAX|MAIL)\b.*$/i,'').replace(/\s+/g,' ');if(!clIgnored(v)){adr=v;return true;}return false;});});
  if(adr){var cpIn=adr.match(/\b\d{5}\b/);if(!cpIn){var after=F.slice(F.indexOf(adr));var c=firstMatch(cpRe,after.slice(0,160));if(c.length){var cp=c[0][1]+' '+c[0][2].replace(/\s+(T[EÉ]L|TEL|FAX|MAIL|CODE)\b.*$/i,'').trim();if(!clIgnored(cp))adr+=', '+cp;}}}
  if(adr.length>110)adr=adr.slice(0,110);
  var code=(F.match(/(?:code\s*(?:d['’]\s*)?acc[eè]s|digicode)\s*:?\s*([^\n]{1,30})/i)||[])[1]||'';
  var mail=(F.slice(start).match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/)||[])[0]||'';
  if(mail&&clIgnored(mail))mail='';
  return {adresse:adr,tel:tel,code:code.trim(),email:mail};
}
// on enrichit la lecture des bons sans toucher à l'original
var _clParseBon=parseBon;
parseBon=function(T){var b=_clParseBon(T);var x=clExtract(T,b.client);b.adresse=x.adresse;b.tel=x.tel;b.code=x.code;b.email=x.email;b.texte=(T||'').slice(0,6000);var f=clFiche(b.client);if(f){if(!b.adresse)b.adresse=f.adresse||'';if(!b.tel)b.tel=f.tel||'';}return b;};

// ---------- fiches clients ----------
function clKey(nom){return norm(nom||'').replace(/\b\d{1,2}\s*[H:]\s*\d{0,2}\b.*$/,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function clFiche(nom){var k=clKey(nom);if(!k)return null;if(clFiches[k])return clFiches[k];for(var x in clFiches){if(x.length>=4&&(k.indexOf(x)===0||x.indexOf(k)===0))return clFiches[x];}return null;}
function clFicheFromBon(b){
  var k=clKey(b.client);if(!k)return;
  var f=clFiches[k]||{nom:b.client,adresse:'',tel:'',code:'',email:''};
  // on ne remplace jamais ce que tu as écrit toi-même
  if(!f.adresse&&b.adresse)f.adresse=b.adresse;
  if(!f.tel&&b.tel)f.tel=b.tel;
  if(!f.code&&b.code)f.code=b.code;
  if(!f.email&&b.email)f.email=b.email;
  clFiches[k]=f;clSaveFiches();
}

// ---------- lecture d'une journée de la grille ----------
function clClean(t){return (t||'').replace(/\s+/g,' ').trim();}
function clIsAbs(t){var n=norm(t).trim();return CL_ABS.indexOf(n)>=0;}
function clClientName(t){return clClean(t).replace(/\s+(?:\d{1,2}\s*[Hh:]\s*\d{0,2})(?:\s*(?:A|À|-|ET)\s*\d{1,2}\s*[Hh:]?\s*\d{0,2})?\s*(?:MAX)?$/i,'').trim();}
function clHeureIn(t){var m=(t||'').match(/\b(\d{1,2})\s*[Hh:]\s*(\d{2})?\b/);if(!m)return '';var h=+m[1];if(h>23)return '';return p(h)+':'+(m[2]||'00');}
function clKnownClient(t){var k=clKey(clClientName(t));if(!k||k.length<3)return false;if(clFiches[k])return true;return (SEEDF.regulars||[]).some(function(r){var rk=clKey(r.c);return rk.length>=4&&!/CLEF|BOITE|CHARGER|BRANCHER|RETOUR|PREPARATION|COMMANDE/.test(rk)&&(k===rk||k.indexOf(rk)===0);});}
function clNames(lbl){
  var s=norm(lbl||'').replace(/M\s*\/\s*H/g,'MH');
  var heure=clHeureIn(s);
  var parts=s.replace(/\b\d{1,2}\s*H\s*\d{0,2}\b/g,' ').split(/[\/+&,;]+/).map(function(x){return x.replace(/[^A-Z ]/g,' ').trim();}).filter(Boolean);
  var ids=[],noms=[];
  parts.forEach(function(pn){CL_APP.forEach(function(a){var an=a.nom==='M/H'?'MH':a.nom;if(pn===an||pn.split(' ').indexOf(an)>=0||(an==='MH'&&/MAITRE/.test(pn))){if(ids.indexOf(a.id)<0){ids.push(a.id);noms.push(a.nom);}}});});
  return {ids:ids,noms:noms,heure:heure};
}
function clDay(d){
  var day=store[d];if(!day)return [];
  var cols=[];
  for(var c=0;c<6;c++){
    var nm=clNames(day.ch[c].t);
    var col={c:c,label:clClean(day.ch[c].t),ids:nm.ids,noms:nm.noms,camion:clClean(day.cam[c].t),debut:clHeureIn(day.deb[c].t)||nm.heure,items:[],absent:''};
    var block=null;
    for(var r=0;r<TIMES.length;r++){
      var o=day.cells[r+'_'+c];var t=clClean(o&&o.t);
      if(!t){block=null;continue;}
      if(clIsAbs(t)){if(!col.absent)col.absent=t.toUpperCase();block=null;continue;}
      var isClient=!!(o.att||o.bon)||CL_CLIENT_COLORS.indexOf((o.c||'').toUpperCase())>=0||clKnownClient(t);
      if(/^(TOURNEE|CAMION|CHARGER|DECHARGER|REPRISE|RETOUR|CHERCHER|DEPOSER|PARTIR|FAIRE|VIDER|METTRE|PRENDRE|NETTOYER|LAVAGE|RANGEMENT|PREPARATION)\b/.test(norm(t))&&!o.att)isClient=false;
      if(isClient){
        var nom=(o.bon&&o.bon.client)||clClientName(t);
        var f=clFiche(nom)||{};
        col.items.push({type:'client',r:r,heure:(o.bon&&o.bon.heure)||clHeureIn(t)||TIMES[r],texte:t,client:nom,
          adresse:(f.adresse||(o.bon&&o.bon.adresse)||''),tel:(f.tel||(o.bon&&o.bon.tel)||''),code:(f.code||(o.bon&&o.bon.code)||''),
          bonNo:(o.bon&&o.bon.no)||'',cid:(o.bon&&o.bon.cid)||'',bonTexte:(o.bon&&o.bon.texte)||'',aBon:!!o.att});
        block=null;
      }else{
        if(block)block.texte+=' '+t;
        else{block={type:'note',r:r,heure:TIMES[r],texte:t};col.items.push(block);}
      }
    }
    cols.push(col);
  }
  return cols;
}
// ---------- format attendu par l'appli chauffeur ----------
function clPayload(d){
  var cols=clDay(d);
  var drivers=CL_APP.map(function(a){return {name:a.nom==='M/H'?'MAITRE_HOTEL':a.nom,truck:'',start:'',end:'',actif:true};});
  var tasks={},resume={},sans=[];
  cols.forEach(function(col){
    if(!col.items.length&&!col.absent)return;
    if(!col.ids.length){if(col.items.length)sans.push(col);return;}
    col.ids.forEach(function(id){
      if(col.camion)drivers[id].truck=col.camion+((typeof pqDe==='function'&&pqDe(col.camion))?' · '+pqDe(col.camion):'');
      if(col.debut)drivers[id].start=col.debut;
      var avec=col.noms.filter(function(n){return n!==CL_APP[id].nom;}).join(' + ');
      resume[id]=resume[id]||{absent:col.absent,camion:col.camion,debut:col.debut,avec:avec,items:[]};
      col.items.forEach(function(it){
        var key=d+'|'+id+'|'+it.heure;
        var tk=it.type==='client'
          ?{client:it.client,task:it.texte,adresse:it.adresse,tel:it.tel,codeAcces:it.code,numero:it.bonNo,bonCle:it.cid||undefined,source:'planning',
             _fiche:it.bonTexte?{texteBrut:it.bonTexte,numero:it.bonNo}:undefined}
          :{client:'',task:it.texte,source:'planning'};
        if(avec)tk.avec=avec;
        (tasks[key]=tasks[key]||[]).push(tk);
        resume[id].items.push(it);
      });
    });
  });
  return {donnees:{drivers:drivers,tasks:tasks,cur:d,source:'CANA_LIVRAISONS',envoye:new Date().toISOString()},resume:resume,sans:sans};
}

function clEtat(id,it){

  var eq=clPartners(id);

function bnB64(bytes){var s='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH){s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));}return btoa(s);}
function bnFromB64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function bnId(){return Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);}
function bnTaille(n){return n>1048576?(n/1048576).toFixed(1)+' Mo':Math.round(n/1024)+' Ko';}

// ---------- lecture en ligne ----------
var BN_SEL='date,updated_at,client:donnees->>client,type:donnees->>type,no:donnees->>no,heure:donnees->>heure,tournee:donnees->>tournee,service:donnees->>service,chauffeur:donnees->>chauffeur,email:donnees->>email,tel:donnees->>tel,adresse:donnees->>adresse,taille:donnees->>taille,supprime:donnees->>supprime,signataire:donnees->>signataire,signeA:donnees->>signeA,vehicule:donnees->>vehicule';
async function bnLire(prefix){
  var u=CL_SUPA+'/rest/v1/planning?date=like.'+encodeURIComponent(prefix)+'*&select='+BN_SEL+'&order=date.asc&limit=500';
  var r=await fetch(u,{headers:clH(),cache:'no-store'});
  if(r.ok)return await r.json();
  // si la base ne sait pas lire champ par champ : on lit tout (plus lent)
  r=await fetch(CL_SUPA+'/rest/v1/planning?date=like.'+encodeURIComponent(prefix)+'*&select=date,updated_at,donnees&limit=300',{headers:clH(),cache:'no-store'});
  if(!r.ok)throw new Error('code '+r.status);
  return (await r.json()).map(function(x){var o=x.donnees;if(typeof o==='string'){try{o=JSON.parse(o);}catch(e){o={};}}o=o||{};return {date:x.date,updated_at:x.updated_at,client:o.client,type:o.type,no:o.no,heure:o.heure,tournee:o.tournee,service:o.service,chauffeur:o.chauffeur,email:o.email,tel:o.tel,adresse:o.adresse,taille:o.taille,supprime:o.supprime,signataire:o.signataire,signeA:o.signeA,vehicule:o.vehicule};});
}
async function bnCharger(d){

  return bnList;
}

function bnNorm(s){return norm(s||'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}

function bnRapprocher(brut){

  var d=new Date(y,mo,+m[1]);if(!m[3]&&(d-now)<-60*864e5)d.setFullYear(y+1);

  var iN=L.findIndex(function(l){return /nom\s*client/i.test(l);}),iA=L.findIndex(function(l){return /^adresse/i.test(l)||/adresse\s+de/i.test(l);});

  if(iN>=0){var a=L[iN].replace(/.*nom\s*client\s*:?/i,'');if(a)morceaux.push(a);for(var j=iN+1;j<(iA>iN?iA:iN+4)&&j<L.length;j++)morceaux.push(L[j]);
    for(var k=iN-1;k>=0&&k>=iN-4;k--){if(/bon de livraison/i.test(L[k]))break;morceaux.unshift(L[k]);}}
  // on ne garde que les vrais mots en MAJUSCULES (le nom du client est écrit en gros) : le bruit du scan disparaît
  var brut=morceaux.map(function(l){return l.replace(/LA TABLE DE CANA|\bMARSEILLE\b|Cuisine.*$/gi,' ');}).join(' ').split(/\s+/).filter(function(w){return w==='-'||/^[A-ZÀ-Ý0-9'’]{2,}$/.test(w.replace(/[:;,.]+$/,''))&&/[A-Z]/.test(w);}).map(function(w){return w.replace(/[:;,.]+$/,'');}).join(' ').replace(/(\s-)+\s*$/,'').replace(/^-\s*/,'').replace(/\s+/g,' ').trim();
  if(/\bSOIR\b/i.test(T))b.service='SOIR';else if(/\bMIDI\b|D[EÉ]JEUNER/i.test(T))b.service='MIDI';
  var connu=scan?bnRapprocher(brut):'';

  var adrL=(iA>=0?L.slice(iA,iA+2).join(' '):T).replace(/.*?(adresse de|livraison)\s*:?/i,' ');
  var ma=adrL.match(/\d{1,4}\s*(?:bis|ter)?,?\s+[A-Za-zÀ-ÿ][^\n]*?\b\d{5}\s+[A-Za-zÀ-ÿ\-]+/);
  if(ma&&!clIgnored(ma[0]))b.adresse=ma[0].replace(/\s+/g,' ').trim();

async function bnAutoVider(){
  var n=0,err=0;clBadge('☁️ Rangement des bons…','#0d47a1');
  while(bnFile.length){var x=bnFile[0];
    try{var blob=await makeBonPdf(x.b.srcBytes,x.b.pages);var f=clFiche(x.b.client)||{};
      var key=await bnEnvoyerBase({id:(x.b.bonNo||'').replace(/[^A-Za-z0-9]/g,'')||undefined,type:'FTBE',jour:x.b.date,client:x.b.client||'',no:x.b.bonNo||'',heure:x.b.heure||'',chauffeur:x.b.chauffeur||'',adresse:f.adresse||x.b.adresse||'',tel:f.tel||x.b.tel||'',email:f.email||x.b.email||'',fichier:x.b.name||''},blob);
      if(x.o&&x.o.bon){x.o.bon.cid=key;}n++;}
    catch(e){err++;}
    bnFile.shift();}
  try{lsSave();}catch(e){}
  clBadge(err?'⚠️ '+err+' bon(s) non rangé(s) (internet ?)':'☁️ '+n+' bon(s) rangé(s) pour les chauffeurs',err?'#b71c1c':'#1b5e20');
}

async function bnEnvoyerClient(key){
  try{
    var r=await fetch(CL_SUPA+'/rest/v1/planning?date=eq.'+encodeURIComponent(key)+'&select=donnees',{headers:clH(),cache:'no-store'});var rows=await r.json();var o=rows[0].donnees;if(typeof o==='string')o=JSON.parse(o);
    var f=clFiche(o.client)||{};var email=o.email||f.email||'';
    if(!email){email=prompt('Email du client « '+o.client+' » ? (il sera enregistré dans sa fiche)','');if(!email)return;email=email.trim();var k=clKey(o.client);clFiches[k]=clFiches[k]||{nom:o.client,adresse:'',tel:'',code:'',email:''};clFiches[k].email=email;clSaveFiches();}
    var signe=key.indexOf('BONSIGNE_')===0;var nomF='Bon_'+String(o.client).replace(/[^A-Za-z0-9]+/g,'_')+'_'+(o.jour||'')+(signe?'_signe':'')+'.pdf';
    var file=new File([bnFromB64(o.pdf)],nomF,{type:'application/pdf'});
    var texte='Bonjour,\n\nVeuillez trouver ci-joint le bon de livraison'+(signe?' signé':'')+' du '+(o.jour||'').split('-').reverse().join('/')+' ('+o.client+').\n\nCordialement,\nLa Table de Cana Marseille';
    try{await navigator.clipboard.writeText(email);}catch(e){}
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Bon de livraison — '+o.client,text:texte});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=nomF;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){location.href='mailto:'+email+'?subject='+encodeURIComponent('Bon de livraison — '+o.client)+'&body='+encodeURIComponent(texte);},700);
    setTimeout(function(){alert('📎 Le bon « '+nomF+' » est dans tes Téléchargements.\nTon email s’ouvre avec l’adresse du client : glisse le fichier dedans et envoie.');},1200);
  }catch(e){alert('❌ Impossible de préparer l’envoi ('+e.message+').');}
}

async function clFetch(url,opt,essais){
  essais=essais||3;var last=null;
  for(var i=0;i<essais;i++){
    try{var ctl=new AbortController();var t=setTimeout(function(){ctl.abort();},45000);
      var r=await fetch(url,Object.assign({cache:'no-store'},opt||{},{signal:ctl.signal}));clearTimeout(t);
      if(r.ok||r.status<500)return r;last=new Error('serveur '+r.status);}
    catch(e){last=new Error(e&&e.name==='AbortError'?'trop long (connexion lente)':'connexion impossible');}
    await bnAttente(900*(i+1));
  }
  throw last;
}
async function bnPost(row){
  var r=await clFetch(CL_SUPA+'/rest/v1/planning',{method:'POST',headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'},clH()),body:JSON.stringify(row)});
  if(!r.ok){var t='';try{t=(await r.text()).slice(0,140);}catch(e){}throw new Error('refusé '+r.status+' '+t);}
}
async function bnStockerPdf(pid,bytes){
  var b64=bnB64(bytes);var n=Math.max(1,Math.ceil(b64.length/BN_CH));
  for(var i=0;i<n;i++){await bnPost({date:'BONPDF_'+pid+'_'+String(i).padStart(3,'0'),donnees:{d:b64.slice(i*BN_CH,(i+1)*BN_CH),i:i,n:n},updated_at:new Date().toISOString()});}
  return n;
}
function bnCles(pid,n){var a=[];for(var i=0;i<n;i++)a.push('BONPDF_'+pid+'_'+String(i).padStart(3,'0'));return a;}
async function bnLirePdf(meta){
  if(meta.pdf)return bnFromB64(meta.pdf);
  if(!meta.pid||!meta.parts)throw new Error('PDF absent');
  var cles=bnCles(meta.pid,+meta.parts);var parts=[];
  for(var j=0;j<cles.length;j+=20){var lot=cles.slice(j,j+20);
    var r=await clFetch(CL_SUPA+'/rest/v1/planning?date=in.('+lot.map(encodeURIComponent).join(',')+')&select=date,donnees',{headers:clH()});
    if(!r.ok)throw new Error('code '+r.status);(await r.json()).forEach(function(x){var o=x.donnees;if(typeof o==='string')o=JSON.parse(o);parts[o.i]=o.d;});}
  for(var k=0;k<cles.length;k++)if(typeof parts[k]!=='string')throw new Error('morceau '+(k+1)+'/'+cles.length+' manquant');
  return bnFromB64(parts.join(''));
}
async function bnMeta(key){
  var r=await clFetch(CL_SUPA+'/rest/v1/planning?date=eq.'+encodeURIComponent(key)+'&select=donnees',{headers:clH()});
  if(!r.ok)throw new Error('code '+r.status);var rows=await r.json();if(!rows.length)throw new Error('bon introuvable');
  var o=rows[0].donnees;if(typeof o==='string')o=JSON.parse(o);return o;
}
// ---------- remplacements des fonctions du module « bons » ----------
async function bnLire(prefix){
  var r=await clFetch(CL_SUPA+'/rest/v1/planning?date=like.'+encodeURIComponent(prefix)+'*&select=date,updated_at,donnees&order=date.asc&limit=1000',{headers:clH()});
  if(!r.ok)throw new Error('code '+r.status);
  return (await r.json()).map(function(x){var o=x.donnees;if(typeof o==='string'){try{o=JSON.parse(o);}catch(e){o={};}}o=Object.assign({},o||{});delete o.pdf;o.date=x.date;o.updated_at=x.updated_at;return o;});
}
async function bnPdf(key){var m=await bnMeta(key);return new Blob([await bnLirePdf(m)],{type:'application/pdf'});}
async function bnEnvoyerBase(meta,blob){
  var bytes=new Uint8Array(await blob.arrayBuffer());
  if(bytes.length>25*1048576)throw new Error('fichier trop gros ('+bnTaille(bytes.length)+')');
  var id=meta.id||bnId();var key='BON_'+meta.jour+'_'+id;var pid=id+'x'+Date.now().toString(36);
  var n=await bnStockerPdf(pid,bytes);
  await bnPost({date:key,donnees:Object.assign({},meta,{id:id,pid:pid,parts:n,taille:bytes.length,ajouteLe:new Date().toISOString()}),updated_at:new Date().toISOString()});
  delete bnCache[meta.jour];
  return key;
}
async function bnSupprimer(key,nom){
  if(!confirm('Retirer le bon « '+nom+' » ?\nLes chauffeurs ne le verront plus (il reste récupérable dans la base).'))return;
  try{var m=await bnMeta(key);m.supprime=true;m.supprimeLe=new Date().toISOString();await bnPost({date:key,donnees:m,updated_at:new Date().toISOString()});delete bnCache[m.jour];}
  catch(e){alert('❌ Impossible de retirer ce bon ('+e.message+').');}
  bnPanel();
}
async function bnCharger(d){
  var a=await bnLire('BON_'+d+'_');var s=[];try{s=await bnLire('BONSIGNE_'+d+'_');}catch(e){}
  var sig={};s.forEach(function(x){sig[x.date.replace('BONSIGNE_','BON_')]=x;});
  bnList=a.filter(function(x){return !x.supprime||String(x.supprime)==='false';}).map(function(x){x.signe=sig[x.date]||null;return x;});
  bnList.sort(function(x,y){return (x.type||'').localeCompare(y.type||'')||(x.tournee||'').localeCompare(y.tournee||'')||(x.heure||'').localeCompare(y.heure||'')||(x.client||'').localeCompare(y.client||'');});
  bnCache[d]={t:Date.now(),l:bnList};
  return bnList;
}
async function bnOuvrir(key){var w=window.open('','_blank');try{if(w)w.document.write('<p style="font-family:Arial;padding:20px">⏳ Ouverture du bon…</p>');var b=await bnPdf(key);var u=URL.createObjectURL(b);if(w)w.location.href=u;else window.open(u,'_blank');}catch(e){if(w)w.close();alert('❌ Impossible d’ouvrir ce bon ('+e.message+').');}}
async function bnEnvoyerClient(key){
  try{
    var o=await bnMeta(key);var bytes=await bnLirePdf(o);
    var f=clFiche(o.client)||{};var email=o.email||f.email||'';
    if(!email){email=prompt('Email du client « '+o.client+' » ?\n(il sera enregistré pour les prochaines fois)','');if(!email)return;email=email.trim();bnEmailEnregistrer(o.client,email);}
    var signe=key.indexOf('BONSIGNE_')===0;var nomF='Bon_'+String(o.client).replace(/[^A-Za-z0-9]+/g,'_')+'_'+(o.jour||'')+(signe?'_signe':'')+'.pdf';
    var file=new File([bytes],nomF,{type:'application/pdf'});
    var texte='Bonjour,\n\nVeuillez trouver ci-joint le bon de livraison'+(signe?' signé':'')+' du '+(o.jour||'').split('-').reverse().join('/')+' ('+o.client+').\n\nCordialement,\nLa Table de Cana Marseille';
    try{await navigator.clipboard.writeText(email);}catch(e){}
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Bon de livraison — '+o.client,text:texte});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=nomF;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){location.href='mailto:'+email+'?subject='+encodeURIComponent('Bon de livraison — '+o.client)+'&body='+encodeURIComponent(texte);},700);
    setTimeout(function(){alert('📎 Le bon « '+nomF+' » est dans tes Téléchargements.\nTon email s’ouvre avec l’adresse du client : glisse le fichier dedans et envoie.');},1200);
  }catch(e){alert('❌ Impossible de préparer l’envoi ('+e.message+').');}
}
function bnEmailEnregistrer(client,email){var k=clKey(client);if(!k||!email)return;clFiches[k]=clFiches[k]||{nom:client,adresse:'',tel:'',code:'',email:''};clFiches[k].email=email;delete clFiches[k]._auto;clSaveFiches();}

// ---------- adresse Resto-Co : lecture plus souple (adresse sur 2 lignes, coordonnées Cana à droite) ----------
var _bnParseRC=bnParseRestoCo;
// lecture exacte des bons Airtable (PDF « texte ») : nom tel quel, adresse complète, « Ouvrir portail » = code d'accès
function bnAirtable(T,b){
  var L=(T||'').split('\n').map(function(l){return l.replace(/\s+/g,' ').trim();}).filter(Boolean);
  var iB=L.findIndex(function(l){return /bon de livraison/i.test(l);}),iA=L.findIndex(function(l){return /^adresse\b/i.test(l);}),iT=L.findIndex(function(l){return /^t[ée]l\s*:/i.test(l);});
  if(iA<0||iT<iA)return b;
  var nom=L.slice(iB+1,iA).map(function(l){return l.replace(/nom client\s*:?/i,'').trim();}).filter(Boolean).join(' ').replace(/\s*-\s*$/,'').replace(/\s+-\s+/g,' - ').replace(/\s+/g,' ').trim();
  if(nom){b.client=nom;if(b.service&&!new RegExp('\\b'+b.service+'\\b','i').test(norm(nom)))b.client=nom+' - '+b.service;}
  var adr=L.slice(iA,iT).map(function(l){return l.replace(/^adresse\s*(de)?\s*:?/i,'').replace(/^livraison\s*:?/i,'').replace(/467\s+Chemin du littoral(\s+13016)?/i,'').replace(/\b04\s?96\s?15\s?74\s?30\b/,'').trim();})
    .filter(function(l){return l&&!/^marseille$/i.test(l);}).join(' ').replace(/\s+/g,' ').trim();
  if(adr&&!clIgnored(adr))b.adresse=adr;
  var tl=L[iT].replace(/^t[ée]l\s*:?/i,'').replace(/\b04\s?96\s?15\s?74\s?30\b/,'').trim();
  if(/[A-Za-z]{3}/.test(tl)){b.code=tl;b.tel='';}
  else{var t=(tl.match(/(?:^|[^\d])(0[1-9](?:[\s.]?\d{2}){4})(?![\d])/g)||[]).map(function(x){return x.replace(/[^\d]/g,'').replace(/(\d{2})(?=\d)/g,'$1 ');});b.tel=t.join(' / ');}
  return b;
}
bnParseRestoCo=function(T,scan){
  var b=_bnParseRC(T,scan);
  if(!scan)b=bnAirtable(T,b);
  if(!b.adresse){
    var L=(T||'').split('\n').map(function(l){return l.replace(/\s+/g,' ').trim();});
    var i=L.findIndex(function(l){return /adresse/i.test(l);});
    if(i>=0){
      var z=L.slice(i,i+4).filter(function(l){return !/^t[ée]l\b|tourn[ée]e|liaison/i.test(l);}).join(' ');
      z=z.replace(/467\s+Chemin du littoral(\s+13016)?(\s+Marseille)?/ig,' ').replace(/adresse\s*(de)?|livraison\s*:?|:/ig,' ').replace(/\s+/g,' ').trim();
      var m=z.match(/\d{1,4}\s*(?:bis|ter)?[ ,]+[A-Za-zÀ-ÿ'][^]*?\b\d{5}\s+[A-Za-zÀ-ÿ\-]+/);
      b.adresse=(m?m[0]:z).slice(0,110).trim();if(b.adresse.length<6||clIgnored(b.adresse))b.adresse='';
    }
  }
  return b;
};
function bnHash(t){var h=5381;for(var i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36);}
// un même bon redéposé (même client, même jour) REMPLACE l'ancien au lieu de faire un doublon
var _bnRangerBase=bnRanger;
bnRanger=async function(){var vu={};bnDepot.forEach(function(b){if(!b.erreur&&b.client&&b.jour&&(!b.no||/^R/.test(b.no))&&b.type!=='FTBE'){var k=bnNorm(b.client)+'|'+b.jour;vu[k]=(vu[k]||0)+1;b.no='R'+bnHash(k+(vu[k]>1?'|'+vu[k]:''));}});return _bnRangerBase();};
// emails / téléphones saisis sur les téléphones des chauffeurs → reviennent dans les fiches du logiciel
async function bnFichesRecuperer(){
  try{var r=await clFetch(CL_SUPA+'/rest/v1/planning?date=eq.FICHES_CLIENTS&select=donnees&limit=1',{headers:clH()},2);if(!r.ok)return;var rows=await r.json();if(!rows.length)return;
    var d=rows[0].donnees;if(typeof d==='string')d=JSON.parse(d);var F=(d&&d.fiches)||{};var ch=false;
    Object.keys(F).forEach(function(n){var e=F[n]||{};if(!(e.email||e.tel||e.adresse))return;var k=clKey(n);if(!k)return;var f=clFiches[k];
      if(!f){clFiches[k]={nom:n,adresse:e.adresse||'',tel:e.tel||'',code:e.codeAcces||'',email:e.email||''};ch=true;return;}
      [['adresse','adresse'],['tel','tel'],['email','email'],['code','codeAcces']].forEach(function(x){if(!f[x[0]]&&e[x[1]]){f[x[0]]=e[x[1]];ch=true;}});});
    if(ch){try{localStorage.setItem('cana_liv_fiches',JSON.stringify(clFiches));}catch(e){}}
  }catch(e){}
}
setTimeout(bnFichesRecuperer,1500);setInterval(function(){if(!document.hidden)bnFichesRecuperer();},300000);
// ---------- bons du jour en mémoire (pour relier les cases du planning aux bons Resto-Co) ----------
var bnCache={};
async function bnCacheJour(d){var c=bnCache[d];if(c&&Date.now()-c.t<120000)return c.l;
  var a=await bnLire('BON_'+d+'_');var l=a.filter(function(x){return !x.supprime||String(x.supprime)==='false';});bnCache[d]={t:Date.now(),l:l};return l;}
function bnMots(s){return bnNorm(s).split(' ').filter(function(w){return w.length>=4&&!/^(SOIR|MIDI|CHRS|LHSS|UNITE|LES|DES|AVEC)$/.test(w);});}
function bnPourCase(d,texte,heure){
  var c=bnCache[d];if(!c)return null;var ws=bnMots(clClientName(texte));
  var tous=bnNorm(clClientName(texte)).split(' ').filter(function(w){return w&&!/^(SOIR|MIDI)$/.test(w);});
  if(!ws.length&&tous.length<2)return null;
  var ok=c.l.filter(function(b){var cl=bnNorm(b.client);var mots=cl.split(' ');
    return ws.length?ws.every(function(w){return cl.indexOf(w)>=0;})&&tous.every(function(w){return w.length>=4||mots.indexOf(w)>=0;}):tous.every(function(w){return mots.indexOf(w)>=0;});});
  if(ok.length>1&&heure){var soir=heure>='15:00';var s2=ok.filter(function(b){return (b.service||'')===(soir?'SOIR':'MIDI')||new RegExp(soir?'SOIR':'MIDI').test(norm(b.client));});if(s2.length)ok=s2;}
  return ok.length===1?ok[0]:(ok.length?ok:null);
}
// les livraisons envoyées aux chauffeurs portent la clé de leur bon
var _bnClDay=clDay;
clDay=function(d){var cols=_bnClDay(d);cols.forEach(function(col){col.items.forEach(function(it){if(it.type==='client'){var b=it.cid?null:bnPourCase(d,it.texte,it.heure);if(b){var b1=Array.isArray(b)?b[0]:b;if(!Array.isArray(b))it.cid=b.date;if(!it.adresse)it.adresse=b1.adresse||'';if(!it.tel)it.tel=b1.tel||'';if(!it.code)it.code=b1.codeAcces||'';}}});});return cols;};
var _bnEnvRes=clEnvoiSilencieuxRes;clEnvoiSilencieuxRes=async function(d){try{await bnCacheJour(d);}catch(e){}return _bnEnvRes(d);};
var _bnEnvSil=clEnvoiSilencieux;clEnvoiSilencieux=async function(d){try{await bnCacheJour(d);}catch(e){}return _bnEnvSil(d);};
var _bnEnvoyer=clEnvoyer;clEnvoyer=async function(){try{await bnCacheJour(cur);}catch(e){}return _bnEnvoyer();};
// petite icône 📄 sur les cases qui ont un bon rangé
function bnMarquer(){
  document.querySelectorAll('td.bnok').forEach(function(td){td.classList.remove('bnok');});
  var c=bnCache[cur];if(!c||!store[cur])return;
  for(var ci=0;ci<6;ci++)for(var r=0;r<TIMES.length;r++){var o=store[cur].cells[r+'_'+ci];if(!o||!o.t||o.att)continue;
    if(bnPourCase(cur,o.t,TIMES[r])){var td=document.getElementById('c_'+r+'_'+ci);if(td)td.classList.add('bnok');}}
}
var _bnRender=render,_bnRT=null;
render=function(){_bnRender.apply(this,arguments);try{bnMarquer();}catch(e){}var d=cur;clearTimeout(_bnRT);_bnRT=setTimeout(function(){bnCacheJour(d).then(function(){if(cur===d)bnMarquer();}).catch(function(){});},500);};
var _bnOpenBon2=openBon;openBon=function(R,C){
  var o=store[cur]&&store[cur].cells[(R-3)+'_'+C];
  if(o&&o.t&&!o.att){var b=bnPourCase(cur,o.t,TIMES[R-3]);if(b&&!Array.isArray(b)){bnOuvrir(b.date);return;}if(Array.isArray(b)){bnDay=cur;bnPanel();return;}}
  _bnOpenBon2(R,C);
};
// ---------- après avoir rangé des bons : les chauffeurs reçoivent la mise à jour ----------
var _bnRanger=bnRanger;
bnRanger=async function(){
  var jours={};bnDepot.forEach(function(b){if(!b.erreur&&b.ok&&b.jour)jours[b.jour]=1;});
  await _bnRanger();
  bnClientsReguliers();
  if(!clCfg.test&&clCfg.auto){var auj=clAuj();for(var d in jours){delete bnCache[d];if(d>=auj&&store[d])await clEnvoiSilencieuxRes(d);}}
  try{render();}catch(e){}
};
// ---------- tous les clients réguliers ont leur fiche (adresse, tél, email) ----------
function bnClientsReguliers(){
  var ch=false;function aj(nom,src){var k=clKey(nom);if(!k||k.length<3||/CLEF|BOITE|CHARGER|RETOUR|LAVAGE|REVISION|CAMION|PREPARATION|COMMANDE|TOURNEE/.test(k))return;
    if(!clFiches[k]){clFiches[k]={nom:nom,adresse:src.adresse||'',tel:src.tel||'',code:'',email:src.email||'',regulier:true};ch=true;}
    else{var f=clFiches[k];if(f._auto){delete f._auto;ch=true;}['adresse','tel','email'].forEach(function(x){if(!f[x]&&src[x]){f[x]=src[x];ch=true;}});}}
  try{(SEEDF.regulars||[]).forEach(function(r){aj(r.c,{});});}catch(e){}
  Object.keys(bnCache).forEach(function(d){(bnCache[d].l||[]).forEach(function(b){aj(b.client,b);});});
  if(ch)clSaveFiches();
}
setTimeout(bnClientsReguliers,2000);
// la liaison s'active pour 35 jours (un mois et plus)
clActiverLiaison=async function(){
  if(!confirm('Activer la liaison avec l’application chauffeur ?\n\n• Tout ce que tu écris dans le planning (aujourd’hui et les jours à venir) part tout seul sur les téléphones, 8 secondes après.\n• Les 35 prochains jours déjà remplis sont envoyés tout de suite.'))return;
  clCfg.test=false;clCfg.auto=true;clSaveCfg();clModeBadge();
  var d=new Date(),n=0,err=0;
  for(var i=0;i<35;i++){var k=fmtD(d);if(store[k]&&Object.keys(store[k].cells||{}).some(function(x){return store[k].cells[x]&&store[k].cells[x].t;})){
      clBadge('⏳ Envoi '+dayLabel(k)+'…','#0d47a1');if(await clEnvoiSilencieuxRes(k))n++;else err++;}
    d.setDate(d.getDate()+1);}
  clBadge(err?'⚠️ '+err+' jour(s) non envoyés':'✅ '+n+' jour(s) envoyés aux chauffeurs',err?'#b71c1c':'#1b5e20');
  alert(err?'⚠️ '+n+' jour(s) envoyé(s), '+err+' en échec.\nClique « 🩺 Vérifier » pour voir ce qui bloque.':'✅ Liaison active : '+n+' jour(s) envoyé(s) aux chauffeurs (jusqu’à 5 semaines).\nÀ partir de maintenant, tout part tout seul.');
};
