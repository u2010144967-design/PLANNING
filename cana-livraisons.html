<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%}
:root{--ac:#AD1457;--bg:#eef1f6;--card:#fff;--cs:15px;--rh:28px;--pscale:1}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#0f172a;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:0 0 auto;background:linear-gradient(100deg,#9c1248,#AD1457 40%,#C2185B);color:#fff;padding:9px 14px;box-shadow:0 4px 16px rgba(173,20,87,.3);z-index:30}
.row1,.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.25)}
h1{font-size:17px;margin:0;font-weight:900;white-space:nowrap;display:flex;gap:7px;align-items:center}
.spacer{flex:1}
.nav{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);padding:4px;border-radius:12px}
button{font-family:inherit;font-weight:700;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
button:active{transform:scale(.96)}
.nav button{background:#fff;color:var(--ac);font-size:18px;padding:5px 14px;line-height:1}.nav button:hover{background:#ffe3ef}
#dateLabel{color:#fff;font-weight:800;min-width:230px;text-align:center;font-size:15px}
#search{padding:8px 12px;border-radius:9px;border:0;font-size:14px;width:190px;font-weight:600}
.btn-today{background:#1b5e20;color:#fff}.btn-print{background:#0d47a1;color:#fff}
.btn-nav{background:#fff;color:var(--ac);font-size:15px;padding:9px 16px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-weight:800}.btn-nav:hover{background:#ffe3ef}
.palette{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.16);padding:4px 7px;border-radius:12px}
.palette small{color:#fff;font-weight:700}
.sw{width:23px;height:23px;border-radius:6px;border:2px solid #fff;cursor:pointer;padding:0;font-size:9px;color:#333}
.sw.auto{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#F8BBD0 4px,#F8BBD0 8px)}
.ctl{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.16);padding:3px 7px;border-radius:12px;color:#fff;font-weight:700;font-size:12px}
.ctl button{background:#fff;color:var(--ac);padding:3px 9px}
#saved{color:#d7ffd9;font-weight:700;font-size:11.5px;min-width:150px}
#count{color:#fff;font-weight:700;font-size:12px;background:rgba(0,0,0,.18);padding:3px 9px;border-radius:20px}
.tools{display:flex;gap:5px;flex-wrap:wrap}.tools button{background:rgba(255,255,255,.92);color:#0f172a}.tools button.danger{background:#ffcdd2;color:#b71c1c}.tools button.on{background:#0d47a1;color:#fff}
main{flex:1 1 auto;overflow:auto;padding:8px 10px}
table{border-collapse:collapse;width:100%;height:100%;background:var(--card);box-shadow:0 6px 20px rgba(15,23,42,.1);table-layout:fixed}
th,td{border:1px solid #c9ced6;overflow:hidden}
td.ed{padding:2px 6px;font-weight:700;cursor:text;height:auto;min-height:var(--rh);white-space:pre-wrap;word-break:break-word;vertical-align:top}
td.ed:focus{outline:3px solid var(--ac);outline-offset:-3px}
td.cellcs{font-size:var(--cs)}
td.sel{outline:3px solid #0d47a1;outline-offset:-3px;box-shadow:inset 0 0 0 100px rgba(13,71,161,.14)}
.h18{font-size:18px!important;font-weight:900!important;text-align:center}
.debcell{font-size:15px!important;font-weight:900!important;text-align:center;color:#0d47a1}
.timecell{background:#e9edf2;font-weight:800;text-align:center;width:66px;font-size:12px}
.lbl{background:#1f2937;color:#fff;font-weight:800;text-align:center;font-size:11px;width:66px}
#navbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:8px;background:rgba(173,20,87,.96);padding:6px 8px;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#navbar button{background:#fff;color:var(--ac);font-size:15px;padding:9px 18px}
#results{position:fixed;right:14px;top:120px;width:min(680px,92vw);max-height:70vh;overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px 16px;display:none;z-index:50}
#results h3{margin:0 0 8px;color:var(--ac)}#results td,#results th{padding:5px 8px;text-align:left;font-size:13px;border:1px solid #eee}
#results a{color:#0d47a1;font-weight:700;text-decoration:none}.badge{background:#1b5e20;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
#results .close{position:sticky;top:0;float:right;background:#eee;color:#333;border-radius:8px}
.attcell{text-align:center;font-size:11px;background:#FFF8E1;vertical-align:middle}
.attcell .fn{display:block;color:#0d47a1;cursor:pointer;text-decoration:underline;font-weight:700;font-size:11px;line-height:1.3}
.attadd{background:#fff;border:1px solid #ccc;border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:700;color:#AD1457}
.attrm{color:#b71c1c;cursor:pointer;font-weight:700;margin-left:4px}
.fsbadge{padding:5px 12px;border-radius:20px;font-weight:800;font-size:12px;white-space:nowrap}
.fson{background:#1b5e20;color:#fff}
.fsoff{background:#ffca28;color:#5d4037}
#driverPrint{display:none}
@media print{body.printdriver main,body.printdriver #navbar{display:none!important}
 body.printdriver #driverPrint{display:block}
 #driverPrint .dpage{page-break-after:always;padding:3mm}
 #driverPrint h1{font-size:24px;margin:0}#driverPrint .sub{font-size:15px;color:#333;margin:2px 0 8px}
 #driverPrint .meta{font-size:16px;font-weight:800;margin-bottom:10px;color:#AD1457}
 #driverPrint table{width:100%;border-collapse:collapse}
 #driverPrint td{border:1.5px solid #222;padding:7px 9px;font-size:16px;font-weight:700}
 #driverPrint td.t{width:72px;background:#eee;text-align:center}}
#printArea{display:none}
@media print{
 body.printing header,body.printing main,body.printing #navbar,body.printing #results,body.printing #modal,body.printing #driverPrint{display:none!important}
 body.printing #printArea{display:block}
 #printArea h1{text-align:center;font-size:17px;margin:0 0 5px;font-weight:900}
 #printArea .pg{width:100%;border-collapse:collapse;table-layout:fixed}
 #printArea .pg td{border:1px solid #777;padding:2px 5px;font-weight:700;overflow:hidden;font-size:12px;white-space:pre-wrap;word-break:break-word;vertical-align:top;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #printArea .pg .lbl{background:#1f2937;color:#fff;text-align:center;font-size:10px}
 #printArea .pg .tcell{background:#e9edf2;text-align:center;font-size:10px}
 #printArea .pg .h18{font-weight:900;text-align:center;font-size:13px}
 #printArea .pg .deb{font-weight:900;text-align:center;color:#0d47a1}
 #printArea .pg .hd{font-weight:900;text-align:center;background:#dfe3ea;font-size:12px}
 #printArea .brk{page-break-after:always}
}
.print-title{display:none}
td.hasbon{position:relative}
td.hasbon::after{content:"📎";position:absolute;top:-2px;right:1px;font-size:11px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:18px}
#modal .box{background:#fff;border-radius:16px;max-width:1100px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#modal h2{margin:0 0 8px;color:var(--ac);font-size:18px}
#modal table{width:100%;height:auto;box-shadow:none;table-layout:auto}
#modal td,#modal th{border:1px solid #ddd;padding:5px 7px;height:auto;font-size:13px;text-align:left}
#modal input,#modal select{font-family:inherit;font-size:13px;padding:5px 6px;border:1px solid #ccc;border-radius:6px;width:100%}
#modal .act{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#modal .place{background:#1b5e20;color:#fff;padding:11px 22px;font-size:15px}
#modal .cancel{background:#eee;color:#333;padding:11px 20px}
@media print{
 header,#results,#navbar,#modal,.attadd,.attrm{display:none!important}
 html,body{height:auto;overflow:visible}
 main{padding:0;overflow:visible;height:auto}
 
 table{box-shadow:none}
 #grid{zoom:var(--pscale,1)}
 tr{page-break-inside:avoid}
 td.ed{height:auto}
 .h18{font-size:19px!important}.debcell{font-size:16px!important}.timecell,.lbl{font-size:12px!important}
 .print-title{display:block!important;text-align:center;font-weight:900;font-size:17px;margin:0 0 4px}
}
</style></head>

 return {date,heure,heurePour:pour,heureLiv:liv,fen,chauffeur:drivers.join(' / '),camion:truck,client,bonNo,col:''};
}
function reconstructText(items){const L={};items.forEach(function(it){const y=Math.round((it.transform&&it.transform[5])||0);(L[y]=L[y]||[]).push([(it.transform&&it.transform[4])||0,it.str]);});const ys=Object.keys(L).map(Number).sort(function(a,b){return b-a;});return ys.map(function(y){return L[y].sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];}).join(' ').replace(/\s+/g,' ').trim();}).filter(Boolean).join('\n');}
async function makeBonPdf(srcBytes,pages){const src=await PDFLib.PDFDocument.load(srcBytes);const out=await PDFLib.PDFDocument.create();const cp=await out.copyPages(src,pages);cp.forEach(function(pg){out.addPage(pg);});const bytes=await out.save();return new Blob([bytes],{type:'application/pdf'});}
async function importBons(files){
 if(!files||!files.length)return;
 if(!window.pdfjsLib){alert("Le lecteur PDF n'est pas disponible (verifie la connexion internet pour la 1re utilisation).");return;}
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){}
 parsedBons=[];
 for(const f of files){
   try{
     const ab=await f.arrayBuffer();const srcBytes=new Uint8Array(ab);
     const pdf=await pdfjsLib.getDocument({data:srcBytes.slice(0)}).promise;
     let groups=[],lastNo=null;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const t=reconstructText(tc.items);
       const nm=t.match(/N\u00b0\s*(C\d+)/);const no=nm?nm[1]:lastNo;lastNo=no||lastNo;
       if(groups.length&&groups[groups.length-1].no===no){groups[groups.length-1].text+=' \n'+t;groups[groups.length-1].pages.push(i-1);}
       else groups.push({no:no,text:t,pages:[i-1]});
     }
     groups.forEach(function(g){const b=parseBon(g.text);if(b.date||b.client||b.bonNo){b.name=((b.client||'bon').replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,24)||'bon')+'.pdf';b.pages=g.pages;b.srcBytes=srcBytes;b.blob=f;b.skip=false;parsedBons.push(b);}});
   }catch(e){parsedBons.push({name:f.name,error:true,skip:true,date:'',heure:'',chauffeur:'',camion:'',client:'',fen:'',bonNo:'',col:''});}
 }
 parsedBons.sort(function(a,b){return ((a.date||'')+(a.heure||'')).localeCompare((b.date||'')+(b.heure||''));});
 showReview();
}

function placeBons(){
 snapshot(); let placed=0;
 parsedBons.forEach(function(b){
   if(b.skip||b.error||!b.date)return;
   ensure(b.date);var day=store[b.date];
   var drivers=(b.chauffeur||"").split(/[\/+&,]+/).map(function(s){return s.trim();}).filter(Boolean);
   var ci=-1;
   if(b.col){ci=(+b.col)-1;}                       // colonne choisie 1-6
   else{
     var nt=norm(b.camion);
     // le prénom du livreur passe en premier (c'est lui qui recevra la mission sur son téléphone)
     if(drivers.length)for(var j=0;j<6;j++){if(day.ch[j].t&&drivers.some(function(dr){return norm(day.ch[j].t).includes(norm(dr));})){ci=j;break;}}
     if(ci<0&&nt)for(var i=0;i<6;i++){if(day.cam[i].t&&norm(day.cam[i].t).includes(nt)){ci=i;break;}}
     if(ci<0)for(var k=0;k<6;k++){if(!day.cam[k].t&&!day.ch[k].t){ci=k;break;}}
     if(ci<0)ci=0;
   }
   if(ci<0||ci>5)ci=0;
   if(b.camion&&!day.cam[ci].t)day.cam[ci].t=b.camion;
   if(drivers.length&&!day.ch[ci].t)day.ch[ci].t=drivers.join("/");
   var ri=TIMES.indexOf(snap(b.heure));if(ri<0)ri=0;
   while(ri<TIMES.length&&day.cells[ri+"_"+ci]&&day.cells[ri+"_"+ci].t)ri++;
   if(ri>=TIMES.length){ri=TIMES.indexOf(snap(b.heure));if(ri<0)ri=0;}
   var txt=(b.client||"⚠ CLIENT ?")+(b.heure?" "+b.heure.replace(":","H"):"");
   var o=cel(txt);o.c="#43A047";
   var id="f"+Date.now()+Math.floor(Math.random()*1e6);o.att={id,name:b.name||"bon.pdf"};try{o.bon={no:b.bonNo||"",client:b.client||"",heure:b.heure||"",adresse:b.adresse||"",tel:b.tel||"",code:b.code||"",texte:(b.texte||"").slice(0,3000)};clFicheFromBon(b);}catch(e){}try{bnAutoCloud(b,o);}catch(e){}
   if(b.srcBytes&&b.pages&&window.PDFLib){makeBonPdf(b.srcBytes,b.pages).then(function(bl){idbPut(id,bl);}).catch(function(){if(b.blob)idbPut(id,b.blob);});}else if(b.blob){idbPut(id,b.blob);}
   day.cells[ri+"_"+ci]=o;placed++;
 });
 lsSave();closeModal();
 var first=parsedBons.find(function(b){return !b.skip&&!b.error&&b.date;});
 if(first){cur=first.date;render();fit();}
 alert(placed+" bon(s) placé(s) ✅  (double-clic sur une case 📎 pour rouvrir le bon)");
}

 const CE=selMode?"":"contenteditable";

function selectRect(r1,c1,r2,c2){sel.clear();document.querySelectorAll("td.sel").forEach(e=>e.classList.remove("sel"));const R1=Math.min(r1,r2),R2=Math.max(r1,r2),C1=Math.min(c1,c2),C2=Math.max(c1,c2);for(let R=R1;R<=R2;R++)for(let C=C1;C<=C2;C++){const id=idFor(R,C);sel.add(id);const e=document.getElementById(id);if(e)e.classList.add("sel");}}

function copySel(cut){
 let co=selCoords();
 if(!co.length){alert("Sélectionne une case ou une colonne d'abord (bouton « 🖱️ Sélection multiple » puis glisse).");return;}
 let minR=Math.min.apply(null,co.map(x=>x[0])),minC=Math.min.apply(null,co.map(x=>x[1]));
 clip=co.map(function(rc){var o=readO(rc[0],rc[1]);return{dr:rc[0]-minR,dc:rc[1]-minC,t:o.t,c:o.c,s:o.s||0};});
 if(cut){snapshot();co.forEach(function(rc){writeO(rc[0],rc[1],{t:"",c:"",s:0});});lsSave();render();}
 alert((cut?"✂️ Coupé":"📋 Copié")+" : "+clip.length+" case(s).\nClique la case de DESTINATION (coin haut-gauche) — tu peux changer de jour — puis « 📌 Coller ».");
}

}

function exportCSV(){let rows=[["Date","Jour","Chauffeur","Camion","Debut","Heure","Client"]];Object.keys(store).sort().forEach(d=>{const day=store[d];const wi=(new Date(d+"T00:00").getDay()+6)%7;Object.keys(day.cells).forEach(k=>{const o=day.cells[k];if(!o.t)return;const[ri,ci]=k.split("_").map(Number);rows.push([d,JF[wi],day.ch[ci].t||DRIVERS[ci],day.cam[ci].t,day.deb[ci].t,TIMES[ri],o.t]);});});dl(new Blob(["\ufeff"+rows.map(r=>r.map(x=>'"'+(x||"").replace(/"/g,'""')+'"').join(";")).join("\n")],{type:"text/csv"}),"historique_livraisons.csv");}
function dl(blob,name){try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){alert("Ouvre le fichier depuis ton PC pour que la sauvegarde marche.");}}
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{store=JSON.parse(e.target.result);lsSave();render();fit();alert("Sauvegarde chargée ✅");}catch(x){alert("Fichier non valide.");}};r.readAsText(f);}
function search(q){const r=document.getElementById("results");q=q.trim().toUpperCase();if(q.length<2){r.style.display="none";return;}let hits=[];Object.keys(store).sort().forEach(d=>{const day=store[d];Object.keys(day.cells).forEach(k=>{const o=day.cells[k];if(o.t&&o.t.toUpperCase().includes(q)){const[ri,ci]=k.split("_").map(Number);hits.push({d,t:TIMES[ri],drv:day.ch[ci].t||DRIVERS[ci],cam:day.cam[ci].t,v:o.t});}});});let html=`<button class="close" onclick="document.getElementById('results').style.display='none'">✕</button><h3>🔎 « ${q} » <span class="badge">${hits.length}</span></h3>`;if(hits.length){html+='<table><tr><th>Date</th><th>Jour</th><th>Chauffeur</th><th>Camion</th><th>Heure</th><th>Client</th></tr>';hits.slice(0,400).forEach(x=>{const wi=(new Date(x.d+"T00:00").getDay()+6)%7;html+=`<tr><td><a href="#" onclick="pick('${x.d}');return false;">${x.d.split("-").reverse().join("/")}</a></td><td>${JF[wi].slice(0,3)}</td><td>${esc(x.drv)}</td><td>${esc(x.cam||"")}</td><td>${x.t}</td><td>${esc(x.v)}</td></tr>`;});html+='</table>';}else html+="<p>Aucun résultat.</p>";r.innerHTML=html;r.style.display="block";}
function fit(){try{var m=document.querySelector("main");var rh=Math.max(22,Math.floor((m.clientHeight-8)/NR));document.documentElement.style.setProperty("--rh",rh+"px");}catch(e){}}
window.addEventListener("beforeprint",function(){try{if(document.body.classList.contains("printdriver"))return;var t=document.getElementById("grid").querySelector("table");if(!t)return;var availW=1075,availH=705;var sc=Math.min(availW/t.scrollWidth,availH/t.scrollHeight);if(!isFinite(sc)||sc<=0)sc=1;sc=Math.min(sc,1);document.documentElement.style.setProperty("--pscale",sc);}catch(e){}});
window.addEventListener("afterprint",function(){document.documentElement.style.setProperty("--pscale",1);});
// ----- clavier : flèches ↑ ↓ ← → + Entrée + Tab -----
function caretStart(){const s=getSelection();return !s.rangeCount||s.anchorOffset===0;}
function caretEnd(el){const s=getSelection();return !s.rangeCount||s.anchorOffset>=(el.innerText||"").length;}
function focusRC(R,C){R=Math.max(0,Math.min(NR-1,R));C=Math.max(0,Math.min(5,C));const el=document.getElementById(idFor(R,C));if(el){el.focus();try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&(e.key||"").toLowerCase()==="z"){e.preventDefault();undo();return;}if(selMode){if((e.ctrlKey||e.metaKey)&&["c","x","v"].includes((e.key||"").toLowerCase())){e.preventDefault();var kk=e.key.toLowerCase();if(kk==="c")copySel(false);else if(kk==="x")copySel(true);else pasteSel();}return;}const a=document.activeElement;const pr=a&&parseId(a.id);if(!pr)return;let[R,C]=pr;
 if(e.key==="ArrowUp"){e.preventDefault();focusRC(R-1,C);}
 else if(e.key==="ArrowDown"){e.preventDefault();focusRC(R+1,C);}
 else if(e.key==="ArrowLeft"){if(caretStart()){e.preventDefault();focusRC(R,C-1);}}
 else if(e.key==="ArrowRight"){if(caretEnd(a)){e.preventDefault();focusRC(R,C+1);}}
 else if(e.key==="Tab"){e.preventDefault();let nc=C+1,nr=R;if(nc>5){nc=0;nr=R+1;}focusRC(nr,nc);}
});

// ===== SYSTEME D'IMPRESSION (couleur, blocs, remplit la page) =====
function dayLabel(d){var wi=(new Date(d+"T00:00").getDay()+6)%7;return JF[wi]+" "+d.split("-").reverse().join("/");}
function shortDay(d){var wi=(new Date(d+"T00:00").getDay()+6)%7;return JF[wi].slice(0,3)+" "+d.slice(8,10)+"/"+d.slice(5,7);}
function weekDays(d){var dt=new Date(d+"T00:00");var wi=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-wi);var o=[];for(var i=0;i<6;i++){var x=new Date(dt);x.setDate(dt.getDate()+i);o.push(fmtD(x));}return o;}
function pgCell(bg,txt,cls){bg=bg||"#ffffff";return '<td class="'+(cls||"")+'" style="background:'+bg+';color:'+tc(bg)+'">'+esc(txt||"")+'</td>';}
function gridTable(cols,heads){
 var h='<table class="pg"><colgroup><col style="width:15mm">'+cols.map(function(){return '<col>';}).join("")+'</colgroup>';
 if(heads){h+='<tr><td class="lbl"></td>'+cols.map(function(c){return '<td class="hd">'+esc(c.head||"")+'</td>';}).join("")+'</tr>';}
 h+='<tr><td class="lbl">CAMION</td>'+cols.map(function(c){var o=c.cam||{};return pgCell(o.c||autoCam(o.t),o.t,"h18");}).join("")+'</tr>';
 h+='<tr><td class="lbl">CHAUFF.</td>'+cols.map(function(c){var o=c.ch||{};return pgCell(o.c||DCOL[c.ci]||"#eee",o.t,"h18");}).join("")+'</tr>';
 h+='<tr><td class="lbl">DÉBUT</td>'+cols.map(function(c){var o=c.deb||{};return pgCell(o.c||"#E3F2FD",o.t,"deb");}).join("")+'</tr>';
 for(var ri=0;ri<TIMES.length;ri++){(function(ri){h+='<tr><td class="tcell">'+TIMES[ri]+'</td>'+cols.map(function(c){var o=c.cell(ri)||{};return pgCell(o.c||autoCell(o.t),o.t);}).join("")+'</tr>';})(ri);}
 return h+'</table>';
}
function openPrint(page,tableMM,inner){
 var st=document.getElementById("printStyle");if(!st){st=document.createElement("style");st.id="printStyle";document.head.appendChild(st);}
 st.textContent='@media print{@page{size:'+page+';margin:6mm} #printArea .pg{height:'+tableMM+'mm}}';
 document.getElementById("printArea").innerHTML=inner;
 document.body.classList.add("printing");window.print();setTimeout(function(){document.body.classList.remove("printing");},600);
}
function colsDay(day){var cols=[];for(var i=0;i<6;i++){(function(ci){cols.push({ci:ci,cam:day.cam[ci],ch:day.ch[ci],deb:day.deb[ci],cell:function(ri){return day.cells[ri+"_"+ci];}});})(i);}return cols;}
function hasCol(day,ci){return (day.cam[ci].t||day.ch[ci].t||Object.keys(day.cells).some(function(k){return k.slice(-2)==="_"+ci&&day.cells[k].t;}));}
// 1) JOUR - tous chauffeurs - A4 PORTRAIT couleur
function printDay(){var day=store[cur];openPrint("A4 landscape",186,'<h1>'+esc(dayLabel(cur))+'</h1>'+gridTable(colsDay(day)));}
// 2) JOUR - une feuille par chauffeur (grille horaire couleur, avec les espaces)
function printByDriver(){
 var day=store[cur];var html="";var n=0;
 for(var i=0;i<6;i++){(function(ci){ if(!hasCol(day,ci))return; n++;
   var name=day.ch[ci].t||DRIVERS[ci];
   var cols=[{ci:ci,cam:day.cam[ci],ch:day.ch[ci],deb:day.deb[ci],cell:function(ri){return day.cells[ri+"_"+ci];}}];
   html+='<div class="brk"><h1>'+esc(name)+' — '+esc(dayLabel(cur))+'</h1>'+gridTable(cols)+'</div>';
 })(i);}
 if(!n){alert("Rien à imprimer pour ce jour.");return;}
 openPrint("A4 portrait",262,html);
}
// 3) SEMAINE par chauffeur (une feuille par chauffeur, 6 jours en colonnes) - A4 paysage
function printDriverWeek(){
 var days=weekDays(cur);days.forEach(function(d){ensure(d);});
 var html="";var n=0;
 for(var i=0;i<6;i++){(function(ci){
   var any=days.some(function(d){return hasCol(store[d],ci);}); if(!any)return; n++;
   var cols=days.map(function(d){var dd=store[d];return {ci:ci,head:shortDay(d),cam:dd.cam[ci],ch:dd.ch[ci],deb:dd.deb[ci],cell:function(ri){return dd.cells[ri+"_"+ci];}};});
   html+='<div class="brk"><h1>'+esc(DRIVERS[ci])+' — semaine du '+days[0].split("-").reverse().join("/")+'</h1>'+gridTable(cols,true)+'</div>';
 })(i);}
 if(!n){alert("Rien à imprimer cette semaine.");return;}
 openPrint("A4 landscape",185,html);
}
// 4) SEMAINE A3 - tous les chauffeurs (un jour par page A3, couleur)
function printWeekA3(){
 var days=weekDays(cur);var html="";
 days.forEach(function(d){ensure(d);var dd=store[d];html+='<div class="brk"><h1>'+esc(dayLabel(d))+'</h1>'+gridTable(colsDay(dd))+'</div>';});
 openPrint("A3 landscape",272,html);
}

function clIgnoreList(){return (clCfg.ignore||'').split(/[\n;]+/).map(function(s){return norm(s).replace(/[^A-Z0-9]/g,'');}).filter(function(s){return s.length>=4;});}
function clIgnored(v){var k=norm(v).replace(/[^A-Z0-9]/g,'');return clIgnoreList().some(function(x){return k.indexOf(x)>=0||x.indexOf(k)>=0;});}

function clClean(t){return (t||'').replace(/\s+/g,' ').trim();}
function clIsAbs(t){var n=norm(t).trim();return CL_ABS.indexOf(n)>=0;}
function clClientName(t){return clClean(t).replace(/\s+(?:\d{1,2}\s*[Hh:]\s*\d{0,2})(?:\s*(?:A|À|-|ET)\s*\d{1,2}\s*[Hh:]?\s*\d{0,2})?\s*(?:MAX)?$/i,'').trim();}
function clHeureIn(t){var m=(t||'').match(/\b(\d{1,2})\s*[Hh:]\s*(\d{2})?\b/);if(!m)return '';var h=+m[1];if(h>23)return '';return p(h)+':'+(m[2]||'00');}
function clKnownClient(t){var k=clKey(clClientName(t));if(!k||k.length<3)return false;if(clFiches[k])return true;return (SEEDF.regulars||[]).some(function(r){var rk=clKey(r.c);return rk.length>=4&&!/CLEF|BOITE|CHARGER|BRANCHER|RETOUR|PREPARATION|COMMANDE/.test(rk)&&(k===rk||k.indexOf(rk)===0);});}
function clNames(lbl){
  var s=norm(lbl||'').replace(/M\s*\/\s*H/g,'MH');
  var heure=clHeureIn(s);
  var parts=s.replace(/\b\d{1,2}\s*H\s*\d{0,2}\b/g,' ').split(/[\/+&,;]+/).map(function(x){return x.replace(/[^A-Z ]/g,' ').trim();}).filter(Boolean);
  var ids=[],noms=[];
  parts.forEach(function(pn){CL_APP.forEach(function(a){if(!a.nom)return;var an=a.nom==='M/H'?'MH':a.nom;if(pn===an||pn.split(' ').indexOf(an)>=0||(an==='MH'&&/MAITRE/.test(pn))){if(ids.indexOf(a.id)<0){ids.push(a.id);noms.push(a.nom);}}});});
  return {ids:ids,noms:noms,heure:heure};
}
function clDay(d){
  var day=store[d];if(!day)return [];
  var cols=[];
  for(var c=0;c<6;c++){
    var nm=clNames(day.ch[c].t);
    var col={c:c,label:clClean(day.ch[c].t),ids:nm.ids,noms:nm.noms,camion:clClean(day.cam[c].t),debut:clHeureIn(day.deb[c].t)||nm.heure,fin:clHeureIn((day.fin||[])[c]||''),items:[],absent:''};
    var block=null;
    for(var r=0;r<TIMES.length;r++){
      var o=day.cells[r+'_'+c];var t=clClean(o&&o.t);
      if(!t){block=null;continue;}
      if(clIsAbs(t)){if(!col.absent)col.absent=t.toUpperCase();block=null;continue;}
      var livr=norm(t).match(/^(?:\d{1,2}\s*H\s*\d{0,2}\s*)?(?:LIVRAISON|LIVRER|LIVRE|LIV\.?)\s+(.+)$/);
      var isClient=!!(o.att||o.bon)||!!livr||CL_CLIENT_COLORS.indexOf((o.c||'').toUpperCase())>=0||clKnownClient(t);
      if(/^(TOURNEE|CAMION|CHARGER|DECHARGER|REPRISE|RETOUR|CHERCHER|DEPOSER|PARTIR|FAIRE|VIDER|METTRE|PRENDRE|NETTOYER|LAVAGE|RANGEMENT|PREPARATION)\b/.test(norm(t))&&!o.att)isClient=false;
      if(isClient){
        var nom=(o.bon&&o.bon.client)||clClientName(livr?livr[1]:t);
        var f=clFiche(nom)||{};
        col.items.push({type:'client',r:r,heure:(o.bon&&o.bon.heure)||clHeureIn(t)||TIMES[r],texte:t,client:nom,
          adresse:(f.adresse||(o.bon&&o.bon.adresse)||''),tel:(f.tel||(o.bon&&o.bon.tel)||''),code:(f.code||(o.bon&&o.bon.code)||''),email:(f.email||''),
          bonNo:(o.bon&&o.bon.no)||'',cid:(o.bon&&o.bon.cid)||'',bonTexte:(o.bon&&o.bon.texte)||'',aBon:!!o.att});
        block=null;
      }else{
        // chaque case = une mission à son heure (on ne colle plus les cases entre elles)
        col.items.push({type:'note',r:r,heure:clHeureIn(t)||TIMES[r],texte:t});
      }
    }
    cols.push(col);
  }
  return cols;
}
// ---------- format attendu par l'appli chauffeur ----------
function clPayload(d){
  var cols=clDay(d);
  var drivers=CL_APP.map(function(a){return a.nom?{name:a.nomBase||(a.nom==='M/H'?'MAITRE_HOTEL':a.nom),truck:'',start:a.start||'',end:a.end||'',actif:true}:{name:'',actif:false};});
  var tasks={},resume={},sans=[];
  cols.forEach(function(col){
    if(!col.items.length&&!col.absent)return;
    if(!col.ids.length){if(col.items.length)sans.push(col);return;}
    col.ids.forEach(function(id){
      if(col.camion)drivers[id].truck=col.camion+((typeof pqDe==='function'&&pqDe(col.camion))?' · '+pqDe(col.camion):'');
      if(col.debut)drivers[id].start=col.debut;
      if(col.fin)drivers[id].end=col.fin;
      var avec=col.noms.filter(function(n){return n!==CL_APP[id].nom;}).join(' + ');
      resume[id]=resume[id]||{absent:col.absent,camion:col.camion,debut:col.debut,avec:avec,items:[]};
      col.items.forEach(function(it){
        var key=d+'|'+id+'|'+it.heure;
        var tk=it.type==='client'
          ?{client:it.client,task:it.texte,adresse:it.adresse,tel:it.tel,tel2:it.tel2||'',email:it.email||'',codeAcces:it.code,numero:it.bonNo,bonCle:it.cid||undefined,bonCles:it.cids||undefined,source:'planning'}
          :{client:'',task:it.texte,tournee:it.tournee||undefined,source:'planning'};
        if(avec)tk.avec=avec;
        (tasks[key]=tasks[key]||[]).push(tk);
        resume[id].items.push(it);
      });
    });
  });
  return {donnees:{drivers:drivers,tasks:tasks,cur:d,source:'CANA_LIVRAISONS',envoye:new Date().toISOString()},resume:resume,sans:sans};
}
// ---------- envoi ----------
function clH(){return {'apikey':CL_KEY,'Authorization':'Bearer '+CL_KEY};}
function clHW(){return {'apikey':CL_KEY,'Authorization':'Bearer '+CL_KEY,'Content-Type':'application/json'};}
// écrire un jour comme le fait l'app chauffeur : un seul envoi « créer ou remplacer » (pas de PATCH)
async function clUpsert(date,donnees){return fetch(CL_SUPA+'/rest/v1/planning',{method:'POST',headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'},clHW()),body:JSON.stringify({date:date,donnees:donnees,updated_at:new Date().toISOString()})});}
async function clTestLien(){
  var el=document.getElementById('clLien');el.textContent='⏳ Vérification…';
  try{var r=await fetch(CL_SUPA+'/rest/v1/planning?date=eq.CONFIG_PRINCIPALE&select=date&limit=1',{headers:clH(),cache:'no-store'});
    el.textContent=r.ok?'✅ Lien avec l’appli chauffeur : OK (lecture seule, rien n’a été modifié)':'❌ Le serveur répond mal ('+r.status+')';}
  catch(e){el.textContent='❌ Pas de connexion internet ou serveur injoignable';}
}
async function clLireApp(d){
  var r=await fetch(CL_SUPA+'/rest/v1/planning?date=eq.'+d+'&select=donnees,updated_at',{headers:clH(),cache:'no-store'});
  if(!r.ok)throw new Error('code '+r.status);var rows=await r.json();if(!rows||!rows.length)return null;
  var o=rows[0].donnees;if(typeof o==='string'){try{o=JSON.parse(o);}catch(e){o={};}}
  var nb={};Object.keys((o&&o.tasks)||{}).forEach(function(k){var x=k.split('|');if(x[0]!==d)return;var n=((o.tasks[k])||[]).filter(function(t){return t&&(t.client||t.task);}).length;nb[x[1]]=(nb[x[1]]||0)+n;});
  return {nb:nb,maj:rows[0].updated_at,source:(o&&o.source)||'ancien logiciel'};
}
async function clVerifier(){
  var d=cur;var el=document.getElementById('clLien');if(el)el.textContent='⏳ Je regarde ce que les téléphones reçoivent…';
  try{var A=await clLireApp(d);
    if(!A){alert('📭 L’application chauffeur n’a RIEN pour le '+dayLabel(d)+'.\n\n'+(clCfg.test?'C’est normal : le 🧪 mode test est coché, rien n’est parti.\nDécoche-le puis clique « Envoyer ce jour ».':'Clique « 📤 Envoyer ce jour aux chauffeurs ».'));if(el)el.textContent='📭 Rien dans l’appli pour ce jour';return;}
    var lignes=CL_APP.map(function(a){return a.nom+' : '+(A.nb[a.id]||0)+' mission(s)';}).join('\n');
    alert('📲 Ce que l’application chauffeur a pour le '+dayLabel(d)+' :\n\n'+lignes+'\n\nEnvoyé par : '+(A.source==='CANA_LIVRAISONS'?'CANA LIVRAISONS ✅':A.source)+'\nDernière mise à jour : '+new Date(A.maj).toLocaleString('fr-FR')+(d<fmtD(new Date())?'\n\n⚠️ Ce jour est passé : l’appli chauffeur n’affiche que AUJOURD’HUI et les jours suivants.':''));
    if(el)el.textContent='📲 Vérifié : l’appli a ce jour ('+A.source+')';
  }catch(e){alert('❌ Impossible de joindre l’application ('+e.message+'). Vérifie internet.');}
}
async function clEnvoyer(){
  var d=cur;var P=clPayload(d);
  if(clCfg.test){alert('Mode test activé : rien n’est envoyé.\nCe que tu vois à l’écran est exactement ce qui partirait.\n\nPour envoyer pour de vrai : décoche « 🧪 Mode test ».');return;}
  var nb=Object.keys(P.donnees.tasks).length;
  if(!nb){alert('Rien à envoyer pour ce jour.');return;}
  if(P.sans.length&&!confirm(P.sans.length+' colonne(s) sans chauffeur reconnu ne partiront pas.\nContinuer quand même ?'))return;
  if(d<fmtD(new Date())&&!confirm('⚠️ Ce jour est déjà passé : les chauffeurs ne le verront pas (l’appli affiche aujourd’hui et les jours suivants).\nEnvoyer quand même ?'))return;
  if(!confirm('Envoyer le '+dayLabel(d)+' sur le téléphone des chauffeurs ?\n\nLes chauffeurs verront ce planning à jour (il remplace ce qui avait été envoyé pour ce jour).'))return;
  try{
    try{var ex=await fetch(CL_SUPA+'/rest/v1/planning?date=eq.'+d+'&select=donnees',{headers:clH(),cache:'no-store'});var rows=ex.ok?await ex.json():[];if(rows&&rows.length){localStorage.setItem('cana_liv_avant_'+d,JSON.stringify(rows[0].donnees));}}catch(e){}
    var r=await clUpsert(d,P.donnees);
    if(!r.ok)throw new Error('code '+r.status);
    var hist=JSON.parse(localStorage.getItem('cana_liv_envois')||'{}');hist[d]=new Date().toLocaleString('fr-FR');localStorage.setItem('cana_liv_envois',JSON.stringify(hist));
    var A=null;try{A=await clLireApp(d);}catch(e){}
    var det=A?CL_APP.filter(function(a){return A.nb[a.id];}).map(function(a){return '• '+a.nom+' : '+A.nb[a.id]+' mission(s)';}).join('\n'):'';
    alert('✅ Envoyé et vérifié dans l’application chauffeur !\n\n'+det+'\n\nLeur appli se met à jour toute seule (quelques secondes).');
    clOuvrir();
  }catch(e){alert('❌ L’envoi n’a pas marché ('+e.message+').\nRien n’a été perdu : ton planning reste sur ton PC. Vérifie internet et réessaie.');}
}
function clToggleTest(el){
  if(!el.checked){if(!confirm('Passer en mode RÉEL ?\nLe bouton « Envoyer » enverra vraiment la journée sur le téléphone des chauffeurs.')){el.checked=true;return;}}
  clCfg.test=el.checked;clSaveCfg();clModeBadge();clOuvrir();
}

function clFichesOuvrir(focusKey,focusNom){

  // on propose aussi les clients vus dans la grille (cases roses/vertes)
  Object.keys(store).forEach(function(d){var day=store[d];if(!day||!day.cells)return;Object.keys(day.cells).forEach(function(k){var o=day.cells[k];if(!o||!o.t)return;if(o.att||CL_CLIENT_COLORS.indexOf((o.c||'').toUpperCase())>=0){var nm=clClientName(o.t);var kk=clKey(nm);if(kk.length>=3&&!clFiches[kk]&&!/^TOURNEE|CAMION|CHARGER|REPRISE|LIVRAISON|RELIVRAISON/.test(kk))clFiches[kk]={nom:nm,adresse:'',tel:'',code:'',email:'',_auto:1};}});});
  var keys=Object.keys(clFiches).sort();
  var h='<div class="clhead"><h2>📇 Fiches clients ('+keys.length+')</h2><button class="clx" onclick="clClose()">✕</button></div>';
  h+='<div class="clbar"><input id="clfq" placeholder="🔎 Chercher un client…" oninput="clFiltre(this.value)" style="flex:1;min-width:180px">'+
     '<button onclick="clOuvrir()">📱 Retour à l’envoi</button><button onclick="clFichesExport()">💾 Copie des fiches</button>'+
     '<button onclick="document.getElementById(\'clfimp\').click()">📂 Restaurer fiches</button><input type="file" id="clfimp" accept=".json" style="display:none" onchange="clFichesImport(this.files[0])"></div>';
  h+='<p class="clintro">Ces infos partent avec chaque livraison sur le téléphone du chauffeur. Elles se remplissent toutes seules quand tu importes un bon, mais <b>ce que tu écris ici n’est jamais écrasé</b>. L’email servira plus tard à envoyer le bon de livraison au client.</p>';
  h+='<div class="cltwrap"><table class="clt"><tr><th>Client</th><th>Adresse</th><th>Téléphone</th><th>Code d’accès</th><th>Email client</th><th></th></tr>';
  keys.forEach(function(k){var f=clFiches[k];
    h+='<tr data-k="'+esc(k)+'"'+(k===focusKey?' class="clfoc"':'')+'><td><b>'+esc(f.nom||k)+'</b></td>'+
      ['adresse','tel','code','email'].map(function(fld){return '<td><input value="'+esc(f[fld]||'').replace(/"/g,'&quot;')+'" onchange="clFicheSet(\''+k.replace(/'/g,"\\'")+'\',\''+fld+'\',this.value)"></td>';}).join('')+
      '<td><button title="Supprimer la fiche" onclick="clFicheDel(\''+k.replace(/'/g,"\\'")+'\')">🗑</button></td></tr>';});
  h+='</table></div>';
  h+='<details class="clign"><summary>⚙️ Numéros et adresses de La Table de Cana à ne jamais prendre sur les bons</summary><p>Si le logiciel prend par erreur le téléphone ou l’adresse de La Table de Cana au lieu de ceux du client, écris-les ici (un par ligne).</p><textarea rows="3" onchange="clCfg.ignore=this.value;clSaveCfg()">'+esc(clCfg.ignore||'')+'</textarea></details>';
  document.getElementById('clBox').innerHTML=h;document.getElementById('clPanel').style.display='flex';
  if(focusKey){var tr=document.querySelector('tr.clfoc');if(tr){tr.scrollIntoView({block:'center'});var i=tr.querySelector('input');if(i)i.focus();}}
}
function clFiltre(q){q=norm(q);document.querySelectorAll('.clt tr[data-k]').forEach(function(tr){tr.style.display=!q||tr.getAttribute('data-k').indexOf(q)>=0?'':'none';});}
function clFicheSet(k,f,v){clFiches[k]=clFiches[k]||{nom:k};clFiches[k][f]=v.trim();delete clFiches[k]._auto;clSaveFiches();}
function clFicheDel(k){if(confirm('Supprimer la fiche « '+(clFiches[k].nom||k)+' » ?')){delete clFiches[k];clSaveFiches();clFichesOuvrir();}}
function clFichesExport(){dl(new Blob([JSON.stringify(clFiches)],{type:'application/json'}),'fiches_clients_'+new Date().toISOString().slice(0,10)+'.json');}

function clDayRange(d){var a=new Date(d+'T00:00');var b=new Date(a);b.setDate(b.getDate()+1);return [a.toISOString(),b.toISOString()];}
async function clChargerSuivi(d,silent){
  var R=clDayRange(d);

    '&updated_at=gte.'+encodeURIComponent(R[0])+'&updated_at=lt.'+encodeURIComponent(R[1])+'&order=updated_at.asc&limit=300';
  try{
    var r=await fetch(url,{headers:clH(),cache:'no-store'});
    if(!r.ok)throw new Error('code '+r.status);
    var rows=await r.json();
    clSuivi={date:d,t:Date.now(),ev:rows.map(function(x){var o=x.donnees;if(typeof o==='string'){try{o=JSON.parse(o);}catch(e){o={};}}o=o||{};o._k=x.date;o._at=x.updated_at;return o;})};
    clMarquer();return true;
  }catch(e){if(!silent)alert('❌ Impossible de lire le retour des chauffeurs ('+e.message+'). Vérifie internet.');return false;}

// livraisons validées pour un item du planning
function clEtat(id,it){

function bnB64(bytes){var s='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH){s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));}return btoa(s);}
function bnFromB64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}

var BN_SEL='date,updated_at,client:donnees->>client,type:donnees->>type,no:donnees->>no,heure:donnees->>heure,tournee:donnees->>tournee,service:donnees->>service,chauffeur:donnees->>chauffeur,email:donnees->>email,tel:donnees->>tel,adresse:donnees->>adresse,taille:donnees->>taille,supprime:donnees->>supprime,signataire:donnees->>signataire,signeA:donnees->>signeA,vehicule:donnees->>vehicule';

function bnClientsConnus(){

  try{(SEEDF.regulars||[]).forEach(function(r){if(r&&r.c)L[bnNorm(r.c)]=r.c;});}catch(e){}
  bnList.forEach(function(b){if(b.client)L[bnNorm(b.client)]=b.client;});
  return L;
}
function bnRapprocher(brut){
  var q=bnNorm(brut).split(' ').filter(function(w){return w.length>=3&&!/^(SOIR|MIDI|NOM|CLIENT)$/.test(w);});if(!q.length)return '';
  var L=bnClientsConnus(),best='',bs=0;
  Object.keys(L).forEach(function(k){var ws=k.split(' ').filter(function(w){return w.length>=3;});if(!ws.length)return;var n=0;q.forEach(function(w){if(ws.indexOf(w)>=0)n++;});var sc=n/Math.max(ws.length,q.length);if(n>=1&&sc>bs){bs=sc;best=L[k];}});
  return bs>=0.5?best:'';
}
function bnDateTexte(T){
  var m=norm(T).match(/(?:LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI|DIMANCHE)\s+(\d{1,2})\s+(JANVIER|FEVRIER|MARS|AVRIL|MAI|JUIN|JUILLET|AOUT|SEPTEMBRE|OCTOBRE|NOVEMBRE|DECEMBRE)(?:\s+(\d{4}))?/);
  if(!m)return '';var mo=BN_MOIS.indexOf(m[2].toLowerCase());var now=new Date();var y=m[3]?+m[3]:now.getFullYear();
  var d=new Date(y,mo,+m[1]);if(!m[3]&&(d-now)<-60*864e5)d.setFullYear(y+1);
  return fmtD(d);
}
function bnParseRestoCo(T,scan){
  (clCfg.ignore||'').split(/\n+/).forEach(function(x){var dg=x.replace(/\D/g,'');if(dg.length===10)T=T.replace(new RegExp(dg.split('').join('[\\s.]?'),'g'),' ');});
  var L=(T||'').split('\n').map(function(l){return l.replace(/\s+/g,' ').trim();}).filter(Boolean);
  var b={type:'RESTOCO',client:'',adresse:'',tel:'',email:'',tournee:'',service:'',liaison:'',date:''};
  var iN=L.findIndex(function(l){return /nom\s*client/i.test(l);}),iA=L.findIndex(function(l){return /^adresse/i.test(l)||/adresse\s+de/i.test(l);});
  var morceaux=[];
  if(iN>=0){var a=L[iN].replace(/.*nom\s*client\s*:?/i,'');if(a)morceaux.push(a);for(var j=iN+1;j<(iA>iN?iA:iN+4)&&j<L.length;j++)morceaux.push(L[j]);
    for(var k=iN-1;k>=0&&k>=iN-4;k--){if(/bon de livraison/i.test(L[k]))break;morceaux.unshift(L[k]);}}
  // on ne garde que les vrais mots en MAJUSCULES (le nom du client est écrit en gros) : le bruit du scan disparaît
  var brut=morceaux.map(function(l){return l.replace(/LA TABLE DE CANA|\bMARSEILLE\b|Cuisine.*$/gi,' ');}).join(' ').split(/\s+/).filter(function(w){return w==='-'||/^[A-ZÀ-Ý0-9'’]{2,}$/.test(w.replace(/[:;,.]+$/,''))&&/[A-Z]/.test(w);}).map(function(w){return w.replace(/[:;,.]+$/,'');}).join(' ').replace(/(\s-)+\s*$/,'').replace(/^-\s*/,'').replace(/\s+/g,' ').trim();
  if(/\bSOIR\b/i.test(T))b.service='SOIR';else if(/\bMIDI\b|D[EÉ]JEUNER/i.test(T))b.service='MIDI';
  var connu=scan?bnRapprocher(brut):'';
  b.client=connu||brut;if(!/[A-Za-z]{3}/.test(b.client.replace(/\b(SOIR|MIDI)\b/g,''))){b.client='';}
  if(b.client&&b.service&&!new RegExp('\\b'+b.service+'\\b','i').test(b.client))b.client=b.client.replace(/[\s\-]+$/,'')+' - '+b.service;
  var adrL=(iA>=0?L.slice(iA,iA+2).join(' '):T).replace(/.*?(adresse de|livraison)\s*:?/i,' ');
  var ma=adrL.match(/\d{1,4}\s*(?:bis|ter)?,?\s+[A-Za-zÀ-ÿ][^\n]*?\b\d{5}\s+[A-Za-zÀ-ÿ\-]+/);
  if(ma&&!clIgnored(ma[0]))b.adresse=ma[0].replace(/\s+/g,' ').trim();
  var lt=L.find(function(l){return /^t[ée]l/i.test(l);})||'';
  var tels=(lt.match(/0[1-9](?:[\s.]?\d{2}){4}/g)||[]).map(function(t){return t.replace(/[\s.]/g,'').replace(/(\d{2})(?=\d)/g,'$1 ');}).filter(function(t){return !clIgnored(t);});
  b.tel=tels.join(' / ');
  var mt=T.match(/Tourn[ée]e\s*[:+]?\s*([A-Za-zÀ-ÿ]+)/i);if(mt)b.tournee=mt[1].toUpperCase();
  var ml=T.match(/Liaison\s+(FROIDE|CHAUDE)/i);if(ml)b.liaison=ml[1].toUpperCase();
  var em=(T.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g)||[]).filter(function(e){return !clIgnored(e)&&!/latabledecana|latabladecana/i.test(e);});b.email=em[0]||'';
  b.date=bnDateTexte(T);
  return b;
}
function bnType(T,scan){if(/BON\s+D.?EXP|N\u00b0\s*C\d{4,}/i.test(T))return 'FTBE';return 'RESTOCO';}

// ---------- lecture des scans (photocopieuse) ----------
var bnOcrWorker=null;
function bnScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('chargement impossible'));};document.head.appendChild(s);});}
async function bnOcr(canvas,info){
  if(!window.Tesseract)await bnScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js');
  if(!bnOcrWorker){if(info)info('📖 Préparation de la lecture des scans (1re fois : ~20 s)…');bnOcrWorker=await Tesseract.createWorker();await bnOcrWorker.loadLanguage('fra');await bnOcrWorker.initialize('fra');}
  var r=await bnOcrWorker.recognize(canvas);return (r&&r.data&&r.data.text)||'';
}
async function bnRendre(page,scale){var vp=page.getViewport({scale:scale});var c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await page.render({canvasContext:x,viewport:vp}).promise;return c;}
async function bnPdfDepuisImage(canvas,wPt,hPt){
  var jpg=canvas.toDataURL('image/jpeg',0.72);var doc=await PDFLib.PDFDocument.create();var img=await doc.embedJpg(bnFromB64(jpg.split(',')[1]));
  var pg=doc.addPage([wPt,hPt]);pg.drawImage(img,{x:0,y:0,width:wPt,height:hPt});return new Blob([await doc.save()],{type:'application/pdf'});
}

async function bnImporter(files){
  if(!files||!files.length)return;
  if(!window.pdfjsLib||!window.PDFLib){alert("Le lecteur PDF n'est pas disponible (vérifie internet).");return;}
  try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
  bnDepot=[];var info=function(t){var el=document.getElementById('bnInfo');if(el)el.textContent=t;};
  document.getElementById('clBox').innerHTML='<div class="clhead"><h2>📥 Lecture des bons…</h2><button class="clx" onclick="bnPanel(false)">✕</button></div><p class="clintro" id="bnInfo">⏳ Lecture en cours…</p>';
  document.getElementById('clPanel').style.display='flex';
  for(var fi=0;fi<files.length;fi++){var f=files[fi];
    try{
      var src=new Uint8Array(await f.arrayBuffer());var pdf=await pdfjsLib.getDocument({data:src.slice(0)}).promise;var groupes=[],lastNo=null;
      for(var i=1;i<=pdf.numPages;i++){
        info('⏳ '+f.name+' — page '+i+'/'+pdf.numPages);
        var pg=await pdf.getPage(i);var T=reconstructText((await pg.getTextContent()).items);var scan=T.replace(/\s/g,'').length<40;
        var vp1=pg.getViewport({scale:1});var c=await bnRendre(pg,scan?1.7:0.6);var vignette=(function(){var t=document.createElement('canvas');var k=300/c.width;t.width=300;t.height=Math.round(c.height*k);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',0.7);})();
        if(scan){info('🔎 Lecture du scan '+f.name+' — page '+i+'/'+pdf.numPages+' (quelques secondes)…');try{T=await Promise.race([bnOcr(c,info),new Promise(function(_,rj){setTimeout(function(){rj(new Error('trop long'));},90000);})]);}catch(e){T='';}}
        var type=bnType(T,scan);
        if(type==='FTBE'&&!scan){var nm=T.match(/N\u00b0\s*(C\d+)/);var no=nm?nm[1]:lastNo;lastNo=no||lastNo;
          if(groupes.length&&groupes[groupes.length-1].type==='FTBE'&&groupes[groupes.length-1].no===no){var g=groupes[groupes.length-1];g.T+='\n'+T;g.pages.push(i-1);continue;}
          groupes.push({type:'FTBE',no:no,T:T,pages:[i-1],vignette:vignette});}
        else groupes.push({type:type,T:T,pages:[i-1],vignette:vignette,scan:scan,canvas:scan?c:null,w:vp1.width,h:vp1.height});
      }
      for(var gi=0;gi<groupes.length;gi++){var g2=groupes[gi],b;
        if(g2.type==='FTBE'){var p=parseBon(g2.T);b={type:'FTBE',client:p.client||'',date:p.date||'',heure:p.heure||'',no:p.bonNo||'',chauffeur:p.chauffeur||'',adresse:p.adresse||'',tel:p.tel||'',email:p.email||'',tournee:'',service:''};}
        else b=bnParseRestoCo(g2.T,g2.scan);
        var fc=clFiche(b.client)||{};b.adresse=fc.adresse||b.adresse||'';b.tel=fc.tel||b.tel||'';b.email=fc.email||b.email||'';
        b.jour=b.date||bnDay;b.dateLue=!!b.date;b.vignette=g2.vignette;b.src=src;b.pages=g2.pages;b.scan=!!g2.scan;b.canvas=g2.canvas;b.w=g2.w;b.h=g2.h;b.fichier=f.name;b.ok=true;b.lu=!!(g2.T||'').trim();
        bnDepot.push(b);}
    }catch(e){bnDepot.push({erreur:true,fichier:f.name});}
  }
  bnRevue();
}

      '<td>'+(b.type==='FTBE'?inp('heure','heure',70):inp('tournee','tournée',80))+'</td>'+
      '<td>'+inp('adresse','adresse ?',200)+'</td><td>'+inp('tel','tél ?',120)+(b.code?'<div class="bnsm">🔑 '+esc(b.code)+'</div>':'')+'</td><td>'+inp('email','email ?',170)+'</td></tr>';
  });
  h+='</table></div>'+dl;
  h+='<div class="clbar"><button class="clsend" onclick="bnRanger()">☁️ Ranger ces bons (visibles dans l’app chauffeur)</button><button onclick="bnPanel(false)">Annuler</button><span class="cllien" id="bnInfo"></span></div>';
  document.getElementById('clBox').innerHTML=h;document.getElementById('clPanel').style.display='flex';

async function bnRanger(){

  if(!a.length){alert('Aucun bon coché.');return;}
  var manque=a.filter(function(b){return !/[A-Za-z]{3}/.test((b.client||'').replace(/\b(SOIR|MIDI)\b/g,''))||!b.jour;});if(manque.length){alert(manque.length+' bon(s) sans client ou sans date. Complète les cases en rouge.');return;}

    try{
      var blob=b.scan&&b.canvas?await bnPdfDepuisImage(b.canvas,b.w,b.h):await makeBonPdf(b.src,b.pages);
      await bnEnvoyerBase({id:(b.no||'').replace(/[^A-Za-z0-9]/g,'')||undefined,type:b.type,jour:b.jour,client:b.client.trim(),no:b.no||'',heure:b.heure||'',tournee:b.tournee||'',service:b.service||'',liaison:b.liaison||'',chauffeur:b.chauffeur||'',adresse:b.adresse||'',tel:b.tel||'',email:b.email||'',codeAcces:b.code||'',fichier:b.fichier,scan:!!b.scan},blob);

var bnFile=[];
function bnAutoCloud(b,o){

  bnFile.push({b:b,o:o});if(bnFile.length===1)setTimeout(bnAutoVider,300);

async function bnAutoVider(){
  var n=0,err=0;clBadge('☁️ Rangement des bons…','#0d47a1');
  while(bnFile.length){var x=bnFile[0];
    try{var blob=await makeBonPdf(x.b.srcBytes,x.b.pages);var f=clFiche(x.b.client)||{};
      var key=await bnEnvoyerBase({id:(x.b.bonNo||'').replace(/[^A-Za-z0-9]/g,'')||undefined,type:'FTBE',jour:x.b.date,client:x.b.client||'',no:x.b.bonNo||'',heure:x.b.heure||'',chauffeur:x.b.chauffeur||'',adresse:f.adresse||x.b.adresse||'',tel:f.tel||x.b.tel||'',email:f.email||x.b.email||'',fichier:x.b.name||''},blob);
      if(x.o&&x.o.bon){x.o.bon.cid=key;}n++;}
    catch(e){err++;}

// ================= CANA LIVRAISONS 5 : STOCKAGE ROBUSTE (PDF découpé en petits morceaux) + ARCHIVE =================
// Un bon = 1 petite fiche (BON_<jour>_<id>) + son PDF découpé en morceaux (BONPDF_<pid>_000, _001…).
// Avant, le PDF entier partait d'un coup : trop gros pour la base → « Failed to fetch ».
var BN_CH=150000;
function bnAttente(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function clFetch(url,opt,essais){
  essais=essais||3;var last=null;
  for(var i=0;i<essais;i++){
    try{var ctl=new AbortController();var t=setTimeout(function(){ctl.abort();},45000);
      var r=await fetch(url,Object.assign({cache:'no-store'},opt||{},{signal:ctl.signal}));clearTimeout(t);
      if(r.ok||r.status<500)return r;last=new Error('serveur '+r.status);}
    catch(e){last=new Error(e&&e.name==='AbortError'?'trop long (connexion lente)':'connexion impossible');}
    await bnAttente(900*(i+1));
  }
  throw last;
}
async function bnPost(row){
  var r=await clFetch(CL_SUPA+'/rest/v1/planning',{method:'POST',headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'},clHW()),body:JSON.stringify(row)});
  if(!r.ok){var t='';try{t=(await r.text()).slice(0,140);}catch(e){}throw new Error('refusé '+r.status+' '+t);}
}
async function bnStockerPdf(pid,bytes){
  var b64=bnB64(bytes);var n=Math.max(1,Math.ceil(b64.length/BN_CH));
  for(var i=0;i<n;i++){await bnPost({date:'BONPDF_'+pid+'_'+String(i).padStart(3,'0'),donnees:{d:b64.slice(i*BN_CH,(i+1)*BN_CH),i:i,n:n},updated_at:new Date().toISOString()});}
  return n;
}
function bnCles(pid,n){var a=[];for(var i=0;i<n;i++)a.push('BONPDF_'+pid+'_'+String(i).padStart(3,'0'));return a;}
async function bnLirePdf(meta){
  if(meta.pdf)return bnFromB64(meta.pdf);
  if(!meta.pid||!meta.parts)throw new Error('PDF absent');

// lecture exacte des bons Airtable (PDF « texte ») : nom tel quel, adresse complète, « Ouvrir portail » = code d'accès
function bnAirtable(T,b){
  var L=(T||'').split('\n').map(function(l){return l.replace(/\s+/g,' ').trim();}).filter(Boolean);
  var iB=L.findIndex(function(l){return /bon de livraison/i.test(l);}),iA=L.findIndex(function(l){return /^adresse\b/i.test(l);}),iT=L.findIndex(function(l){return /^t[ée]l\s*:/i.test(l);});
  if(iA<0||iT<iA)return b;
  var nom=L.slice(iB+1,iA).map(function(l){return l.replace(/nom client\s*:?/i,'').replace(/LA TABLE DE CANA|Cuisine locale.*$|et engag.*$/ig,'').replace(/^MARSEILLE\s+|\s+MARSEILLE$/,'').trim();}).filter(function(l){return l&&!/^marseille$/i.test(l);}).join(' ').replace(/\s*-\s*$/,'').replace(/\s+-\s+/g,' - ').replace(/\s+/g,' ').trim();
  if(nom){b.client=nom;if(b.service&&!new RegExp('\\b'+b.service+'\\b','i').test(norm(nom)))b.client=nom+' - '+b.service;}
  var adr=L.slice(iA,iT).map(function(l){return l.replace(/^adresse\s*(de)?\s*:?/i,'').replace(/^livraison\s*:?/i,'').replace(/467\s+Chemin du littoral(\s+13016)?/i,'').replace(/\b04\s?96\s?15\s?74\s?30\b/,'').trim();})
    .filter(function(l){return l&&!/^marseille$/i.test(l);}).join(' ').replace(/\s+/g,' ').trim();
  adr=adr.replace(/\b(\w+)\s+\1$/i,'$1');
  if(adr&&!clIgnored(adr))b.adresse=adr;
  var tl=L[iT].replace(/^t[ée]l\s*:?/i,'').replace(/\b04\s?96\s?15\s?74\s?30\b/,'').trim();
  if(/[A-Za-z]{3}/.test(tl)){b.code=tl;b.tel='';}
  else{var t=(tl.match(/(?:^|[^\d])(0[1-9](?:[\s.]?\d{2}){4})(?![\d])/g)||[]).map(function(x){return x.replace(/[^\d]/g,'').replace(/(\d{2})(?=\d)/g,'$1 ');});b.tel=t.join(' / ');}
  return b;
}

async function bnRattraperFTBE(depuis,afficher){

  try{

    for(var j=0;j<jours.length;j++){var d=jours[j],day=store[d];if(!day||!day.cells)continue;
      for(var k in day.cells){var o=day.cells[k];if(!o||!o.att||(o.bon&&o.bon.cid))continue;vus++;

          if(afficher)clBadge('☁️ Rangement des bons FTBE : '+cli,'#0d47a1');
          var key=await bnEnvoyerBase({id:(b.no||'').replace(/[^A-Za-z0-9]/g,'')||o.att.id,type:'FTBE',jour:d,client:cli,no:b.no||'',heure:b.heure||TIMES[ri]||'',adresse:f.adresse||b.adresse||'',tel:f.tel||b.tel||'',email:f.email||'',codeAcces:f.code||b.code||'',fichier:o.att.name||''},blob);
          o.bon=Object.assign({},b,{cid:key,client:cli});n++;clQueue(d);
        }catch(e){err++;}
      }}

function repPlacer(){

// ================= CANA LIVRAISONS 10 : TOURNÉES REGROUPÉES (Resto-Co / Centre aéré) =================
// Une tournée = UNE seule case « TOURNÉE VERTE (7 clients) ». Dedans : la liste des clients et leurs bons.
// Les bons FTBE (traiteur) restent placés un par un, à leur heure.
var TRN_FOND={BLEU:'#90CAF9',JAUNE:'#FFF176',ROSE:'#F48FB1',VIOLET:'#CE93D8',VERT:'#A5D6A7'};
repPlacer=function(){
  ensure(repDay);var day=store[repDay];var M=repMem();var n=0,sans=0,nt=0;
  var cles={};repBons.forEach(function(b){cles[b.date]=1;});
  // on retire les anciens placements de ces bons (cases seules ET tournées)
  Object.keys(day.cells).forEach(function(k){var o=day.cells[k];if(!o)return;
    if(o.bon&&o.bon.cid&&cles[o.bon.cid])delete day.cells[k];
    else if(o.tournee&&(o.tournee.cles||[]).some(function(c){return cles[c];}))delete day.cells[k];});
  function libre(ri,c){while(ri<TIMES.length-1&&day.cells[ri+'_'+c]&&day.cells[ri+'_'+c].t)ri++;return ri;}
  var groupes={};
  repBons.forEach(function(b){var ch=repChoix[b.date];if(ch.c<0){sans++;return;}
    M['cli:'+bnNorm(b.client)]={col:repCols(repDay)[ch.c].nom,h:ch.h};
    if(bnCat(b)!=='FTBE'&&ch.coul){var g=ch.c+'|'+ch.coul;(groupes[g]=groupes[g]||{c:ch.c,coul:ch.coul,h:(M['coul:'+ch.coul]||{}).h||ch.h,bons:[]}).bons.push(b);return;}
    // FTBE (ou bon sans couleur) : une case à son heure exacte
    var ri=TIMES.indexOf(snap(ch.h||'10:00'));if(ri<0)ri=0;ri=libre(ri,ch.c);
    var o=cel(b.client);o.c=CAT_CELL[bnCat(b)]||'#FF71DA';o.bon={cid:b.date,client:b.client,no:b.no||'',heure:TIMES[ri]};day.cells[ri+'_'+ch.c]=o;n++;});
  Object.keys(groupes).forEach(function(g){var G=groupes[g];var ri=TIMES.indexOf(snap(G.h||'08:00'));if(ri<0)ri=0;ri=libre(ri,G.c);
    var nb=G.bons.length;var o=cel('TOURNÉE '+G.coul+' ('+nb+' client'+(nb>1?'s':'')+')');o.c=TRN_FOND[G.coul]||'#E0E0E0';
    o.tournee={couleur:G.coul,cles:G.bons.map(function(b){return b.date;}),clients:G.bons.map(function(b){return b.client;})};
    day.cells[ri+'_'+G.c]=o;nt++;n+=nb;});
  repMemSet(M);lsSave();cur=repDay;render();try{fit();}catch(e){}
  clQueue(repDay);clFlush();
  alert('✅ '+n+' bon(s) répartis'+(nt?' dont '+nt+' tournée(s) regroupée(s) en une seule case':'')+'.'+(sans?'\n'+sans+' bon(s) sans chauffeur (non placés).':'')+'\nTu as encore toute la place pour ajouter d’autres clients dans les colonnes.');
  clClose();
};

      h+='</table></div>';}

// ================= CANA LIVRAISONS 12 : ÉQUIPE DES CHAUFFEURS + UNE APPLI (LIEN) PAR CHAUFFEUR =================
var EQ_URL=''+CANA_BASE+'index.html';
var eqData=null;
var EQ_DEF=[{name:'OTMANE',code:'1111'},{name:'NICOLAS',code:'2222'},{name:'MICKAEL',code:'3333'},{name:'KARIM',code:'4444'},{name:'MAITRE_HOTEL',code:'5555'},{name:'ANTHONY',code:'6666'}];
async function eqLire(){var r=await clFetch(CL_SUPA+'/rest/v1/planning?date=eq.EQUIPE&select=donnees&limit=1',{headers:clH()});if(!r.ok)throw new Error('code '+r.status);var rows=await r.json();var d=rows.length?rows[0].donnees:null;if(typeof d==='string'){try{d=JSON.parse(d);}catch(e){d=null;}}d=d||{};if(!d.drivers||!d.drivers.length)d.drivers=EQ_DEF.map(function(x){return Object.assign({},x,{actif:true});});return d;}
async function eqEcrire(d){d.maj=new Date().toISOString();var r=await clUpsert('EQUIPE',d);if(!r||!r.ok)throw new Error('enregistrement refusé');await clChargerEquipe();}
function eqLien(i,e){return EQ_URL+'?chauffeur='+i;}
function eqCodeLibre(){var pris={};(eqData.drivers||[]).forEach(function(e){pris[String(e.code)]=1;});var c;do{c=String(1000+Math.floor(Math.random()*9000));}while(pris[c]);return c;}
async function eqPanel(){
  var box=document.getElementById('clBox');document.getElementById('clPanel').style.display='flex';
  box.innerHTML='<div class="clhead"><h2>👥 Équipe des chauffeurs</h2><button class="clx" onclick="clClose()">✕</button></div><p class="clintro">⏳ Chargement…</p>';
  try{eqData=await eqLire();}catch(e){box.innerHTML+='<div class="clwarn">❌ Lecture impossible ('+esc(e.message)+').</div>';return;}
  eqDessiner();
}
function eqDessiner(){
  var h='<div class="clhead"><h2>👥 Équipe des chauffeurs — une appli par chauffeur</h2><button class="clx" onclick="clClose()">✕</button></div>';
  h+='<p class="clintro">Chaque chauffeur a <b>son propre lien</b> : quand il l’ouvre, il ne voit <b>que son nom</b>, il tape <b>son code</b> et il arrive sur <b>sa</b> journée. Il peut l’ajouter à l’écran d’accueil. Ton appli à toi reste celle avec tous les chauffeurs. Le nom du chauffeur doit être écrit pareil en haut de sa colonne dans le planning.</p>';
  h+='<div class="cltwrap"><table class="clt"><tr><th>N°</th><th>Chauffeur</th><th>Code</th><th>Son appli</th><th></th></tr>';
  eqData.drivers.forEach(function(e,i){if(e.actif===false)return;var nom=e.name||'';
    h+='<tr><td>'+i+'</td><td><input value="'+esc(nom).replace(/"/g,'&quot;')+'" onchange="eqRenommer('+i+',this.value)" style="font-weight:900;text-transform:uppercase;max-width:170px"></td><td><b>'+esc(e.code)+'</b></td>'+
      '<td style="white-space:nowrap"><button onclick="eqCopier('+i+')">📋 Copier le lien</button> <button onclick="eqQR('+i+')">📱 QR code</button> <button onclick="eqSMS('+i+')">💬 SMS</button></td>'+
      '<td style="white-space:nowrap"><button onclick="eqRemplacer('+i+')">🔁 Remplacer</button> <button onclick="eqArchiver('+i+')">🗄️ Retirer</button></td></tr>';});
  h+='</table></div>';
  var arch=eqData.drivers.map(function(e,i){return {e:e,i:i};}).filter(function(x){return x.e.actif===false&&x.e.name;});
  if(arch.length)h+='<details class="clign"><summary>🗄️ Anciens chauffeurs ('+arch.length+') — leur historique est gardé</summary><p>'+arch.map(function(x){return esc(x.e.name)+' <button onclick="eqReactiver('+x.i+')">↩ Remettre</button>';}).join(' · ')+'</p></details>';
  h+='<div class="clbar"><input id="eqNom" placeholder="Prénom du nouveau chauffeur" style="text-transform:uppercase;min-width:220px"><button class="clsend" onclick="eqAjouter()">➕ Ajouter un chauffeur</button></div>';
  document.getElementById('clBox').innerHTML=h;

async function eqAjouter(){
  var n=(document.getElementById('eqNom').value||'').trim().toUpperCase();if(!n){alert('Écris le prénom du chauffeur.');return;}
  if(eqData.drivers.some(function(e){return e.actif!==false&&norm(e.name)===norm(n);})){alert('Ce chauffeur existe déjà.');return;}
  eqData.drivers.push({name:n,code:eqCodeLibre(),actif:true,start:'06:00',end:'14:00'});
  try{await eqEcrire(eqData);eqDessiner();var i=eqData.drivers.length-1;alert('✅ '+n+' est ajouté (code '+eqData.drivers[i].code+').\n\nÉcris « '+n+' » en haut de sa colonne dans le planning, puis envoie-lui son lien (📋, 📱 QR code ou 💬 SMS).');}
  catch(e){eqData.drivers.pop();alert('❌ '+e.message);}
}
async function eqRemplacer(i){
  var anc=eqData.drivers[i];var n=(prompt('Qui remplace '+anc.name+' ?\n(Prénom du nouveau chauffeur)','')||'').trim().toUpperCase();if(!n)return;
  var nouv={name:n,code:eqCodeLibre(),actif:true,truck:anc.truck||'',start:anc.start||'06:00',end:anc.end||'14:00'};
  anc.actif=false;eqData.drivers.push(nouv);
  try{await eqEcrire(eqData);}catch(e){anc.actif=true;eqData.drivers.pop();alert('❌ '+e.message);return;}
  // on met le nouveau nom dans les colonnes du planning, à partir d'aujourd'hui
  var nb=0;if(confirm('Remplacer « '+anc.name+' » par « '+n+' » en haut des colonnes du planning, à partir d’aujourd’hui ?')){
    var auj=clAuj(),k0=norm(anc.name);Object.keys(store).forEach(function(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<auj)return;var day=store[d];if(!day||!day.ch)return;var ch=false;
      for(var c=0;c<6;c++){var t=day.ch[c].t||'';if(norm(t).indexOf(k0)>=0){day.ch[c].t=t.replace(new RegExp(anc.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),n);ch=true;}}
      if(ch){nb++;clQueue(d);}});
    lsSave();render();clFlush();}

async function syPousser(d){

  // deux personnes ont pu écrire en même temps : on vérifie que nos modifications sont bien en ligne, sinon on les remet
  for(var essai=0;essai<4;essai++){
    await new Promise(function(r){setTimeout(r,350+Math.random()*450);});
    var verif=null;try{verif=await syLireJour(d);}catch(e){break;}

// place le cadre dans la page voulue (et garde une photo de l'ancienne page pour qu'elle ne soit pas vide)
function px3Cible(k){
  var pane=document.querySelector('.pxPane[data-k="'+k+'"]');var pan=document.getElementById('clPanel');if(!pane||!pan)return;
  if(PX3.live&&PX3.live!==k){var old=document.querySelector('.pxPane[data-k="'+PX3.live+'"]');if(old&&pan.parentNode===old){var snap=document.createElement('div');snap.className='px3-snap';snap.innerHTML=document.getElementById('clBox').innerHTML;old.appendChild(snap);}}
  pane.querySelectorAll('.px3-vide,.px3-snap').forEach(function(x){x.remove();});
  if(pan.parentNode!==pane){pane.appendChild(pan);}
  pan.classList.add('integre');pan.style.display='block';PX3.live=k;

// si une fenêtre s'ouvre alors qu'on regarde le planning (ex. double-clic sur une tournée) → elle va dans « Outils » et on y va
function px3Placer(){

}

function mhEstColonne(col){var n=norm(col.label||'').replace(/[^A-Z\/ ]/g,'');return /M\s*\/?\s*H|MAITRE/.test(n);}

clDay=function(d){

  var extra=[];

      var reste=t.slice(p.k.length).trim();var cam='';
      var c=camions.find(function(x){return (' '+reste+' ').indexOf(' '+x.k+' ')>=0;});if(c){cam=c.c;reste=(' '+reste+' ').replace(' '+c.k+' ',' ').trim();}
      reste=reste.replace(/\b(CAMION|CLIENT|LIVRAISON|LIVRER)\b/g,' ').replace(/\s+/g,' ').trim();
      var n=Object.assign({},it);
      if(reste){n.type='client';n.client=reste;n.texte=(cam?cam+' · ':'')+reste;var f=clFiche(reste)||{};n.adresse=f.adresse||'';n.tel=f.tel||'';n.code=f.code||'';n.email=f.email||'';
        var b=bnPourCase(d,reste,it.heure);if(b){var b1=Array.isArray(b)?b[0]:b;if(!Array.isArray(b))n.cid=b.date;else n.cids=b.map(function(x){return x.date;});n.adresse=n.adresse||b1.adresse||'';n.tel=n.tel||b1.tel||'';n.code=n.code||b1.codeAcces||'';}}
