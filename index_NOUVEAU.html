<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest-chauffeur.json">
<title>La Table de Cana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060e1a;--card:#0d1b2e;--border:#1e3a5f;
  --text:#e2e8f0;--muted:#64748b;
  --green:#22c55e;--blue:#3b82f6;--orange:#f97316;
  --purple:#8b5cf6;--red:#ef4444;--teal:#14b8a6;
}
body{font-family:-apple-system,'SF Pro Text',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;max-width:480px;margin:0 auto;position:relative}

/* ──── ÉCRAN (système) ──── */
.screen{display:none;flex-direction:column;min-height:100dvh}
.screen.active{display:flex}

/* ──── LOGIN ──── */
#s-login{background:linear-gradient(180deg,#060e1a 0%,#0a1628 100%);align-items:center;justify-content:center;padding:32px 24px;gap:0}
.login-logo{width:90px;height:90px;background:linear-gradient(135deg,#fff5f0,#fff);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(249,115,22,.3);margin-bottom:28px}
.login-logo .sun{font-size:38px;line-height:1}
.login-logo .brand{font-size:8px;font-weight:900;color:#0f172a;letter-spacing:.5px;margin-top:2px;text-align:center;line-height:1.3}
.login-title{font-size:24px;font-weight:900;color:#fff;text-align:center;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px}
.login-grid{width:100%;display:flex;flex-direction:column;gap:10px}
.login-btn{
  padding:18px;border:2px solid transparent;border-radius:14px;
  font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:12px;
  transition:.15s;color:#fff;
}
.login-btn:active{transform:scale(.97)}
.login-btn .av{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

/* ──── HEADER ──── */
.hdr{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:50;flex-shrink:0;
}
.hdr-back{background:transparent;border:none;color:var(--blue);font-size:24px;cursor:pointer;padding:2px 8px 2px 0;line-height:1}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-size:17px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:1px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;transition:background .4s}

/* ──── CONTENU ──── */
.scroll{flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}

/* ──── CARTE MISSION ──── */
.miss{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:16px;margin-bottom:10px;overflow:hidden;
  cursor:pointer;transition:.15s;
}
.miss:active{transform:scale(.98);opacity:.9}
.miss.done{opacity:.6;border-color:rgba(34,197,94,.3)}
.miss-stripe{height:4px}
.miss-body{padding:12px 14px;display:flex;align-items:flex-start;gap:12px}
.miss-time{text-align:center;min-width:52px;flex-shrink:0}
.miss-heure{font-size:22px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.miss-date{font-size:9px;font-weight:800;color:var(--orange);margin-bottom:2px}
.miss-tfin{font-size:10px;color:var(--muted);margin-top:1px}
.miss-info{flex:1;min-width:0}
.miss-client{font-size:16px;font-weight:900;color:#fff;margin-bottom:5px;line-height:1.2}
.miss-cat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block}
.miss-check{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:.2s}
.miss-check.ok{background:var(--green);border-color:var(--green);color:#fff}

/* ──── VIDE ──── */
.vide{text-align:center;padding:60px 20px;color:var(--muted)}
.vide-ico{font-size:56px;margin-bottom:16px}
.vide-titre{font-size:18px;font-weight:800;color:#e2e8f0;margin-bottom:8px}
.vide-txt{font-size:14px;line-height:1.5}

/* ──── FAB photo ──── */
.fab{
  position:fixed;bottom:24px;right:18px;z-index:40;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  border:none;color:#fff;font-size:28px;cursor:pointer;
  box-shadow:0 6px 24px rgba(124,58,237,.5);
  display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.fab:active{transform:scale(.92)}

/* ──── DÉTAIL ──── */
.det-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.det-label{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.det-val{font-size:15px;font-weight:700;color:#fff}

/* ──── BOUTONS ──── */
.big-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;
  margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:.15s;
}
.big-btn:active{transform:scale(.97)}
.big-btn.green{background:var(--green);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,.3)}
.big-btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.big-btn.purple{background:var(--purple);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.3)}
.big-btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 16px rgba(20,184,166,.3)}
.big-btn.outline{background:transparent;border:2px solid var(--border);color:var(--text)}
.big-btn.done-btn{background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.4);color:var(--green)}

/* ──── PHOTO ──── */
.photo-prev{width:100%;border-radius:14px;margin-bottom:12px;max-height:300px;object-fit:cover;display:none}
.client-list{display:flex;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto;margin-top:8px}
.cli-btn{text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(34,197,94,.06);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px}
.cli-btn:hover{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4)}
input.fi{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:rgba(255,255,255,.05);color:#fff;font-size:16px;font-weight:700;font-family:inherit;transition:.15s}
input.fi:focus{outline:none;border-color:var(--blue);background:rgba(59,130,246,.06)}

/* ──── TOAST ──── */
.toast-msg{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#0d1b2e;border:1px solid #1e3a5f;border-radius:12px;
  padding:12px 22px;font-size:14px;font-weight:700;color:#fff;
  z-index:9999;opacity:0;transition:opacity .3s;
  white-space:nowrap;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast-msg.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div class="login-logo">
    <div class="sun">☀️</div>
    <div class="brand">LA TABLE<br>DE CANA</div>
  </div>
  <div class="login-title">Bonjour 👋</div>
  <div class="login-sub">Qui es-tu aujourd'hui ?</div>
  <div class="login-grid" id="login-grid"></div>
</div>

<!-- MISSIONS -->
<div class="screen" id="s-main">
  <div class="hdr">
    <div class="hdr-info">
      <div class="hdr-title" id="main-name">—</div>
      <div class="hdr-sub" id="main-date">—</div>
    </div>
    <div class="sync-dot" id="sync-dot"></div>
  </div>
  <div class="scroll" id="main-list"></div>
  <button class="fab" onclick="goScreen('s-photo')" title="Photo de preuve">📸</button>
</div>

<!-- DÉTAIL -->
<div class="screen" id="s-detail">
  <div class="hdr">
    <button class="hdr-back" onclick="goScreen('s-main')">←</button>
    <div class="hdr-info">
      <div class="hdr-title" id="det-client">—</div>
      <div class="hdr-sub" id="det-heure">—</div>
    </div>
  </div>
  <div class="scroll" id="det-body"></div>
</div>

<!-- PHOTO -->
<div class="screen" id="s-photo">
  <div class="hdr">
    <button class="hdr-back" onclick="goScreen('s-main')">←</button>
    <div class="hdr-info">
      <div class="hdr-title">📸 Photo de preuve</div>
      <div class="hdr-sub">Envoie une photo au responsable</div>
    </div>
  </div>
  <div class="scroll">
    <!-- Sélection client -->
    <div style="background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.25);border-radius:16px;padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:900;color:var(--orange);margin-bottom:10px">📍 Pour quel client ?</div>
      <input id="photo-cli" class="fi" placeholder="Tape 1 lettre pour chercher…" oninput="filtrerCli(this.value)" autocomplete="off">
      <div class="client-list" id="photo-cli-list"></div>
    </div>
    <!-- Preview + envoi -->
    <img id="photo-prev" class="photo-prev">
    <input type="file" id="photo-file" accept="image/*" capture="environment" style="display:none" onchange="photoChoisie(this)">
    <button class="big-btn blue" onclick="document.getElementById('photo-file').click()">📷 Prendre une photo</button>
    <button class="big-btn purple" id="photo-send" style="display:none" onclick="envoyerPhoto()">📤 Envoyer au responsable</button>
    <div id="photo-status" style="text-align:center;font-size:13px;color:var(--muted);margin-top:8px;min-height:20px"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-msg" id="toast"></div>

<script>
const SUPA='https://lllzlidwtcjwsxbgkygn.supabase.co';
const KEY='sb_publishable_3weqcRqeCv9lwclSAPC2rA_48OAwGcV';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'};

const DRIVERS=[
  {name:'OTMANE',       color:'#3b82f6',emoji:'🚐'},
  {name:'NICOLAS',      color:'#22c55e',emoji:'🚛'},
  {name:'MICKAEL',      color:'#f97316',emoji:'🚚'},
  {name:'KARIM',        color:'#a855f7',emoji:'🚐'},
  {name:"MAITRE D'HOTEL",color:'#ec4899',emoji:'🍽️'},
  {name:'ANTHONY',      color:'#06b6d4',emoji:'🚌'}
];

const CAT={co:{c:'#22c55e',l:'Collectivité'},tr:{c:'#f97316',l:'Traiteur'},ta:{c:'#8b5cf6',l:'Tâche'}};

let CH=null,PLANNING={},CLIENTS=[],_curMiss=null,_photoImg=null,_photoCli='',_pollIv=null;

/* ── SUPABASE ── */
async function sGet(p){
  try{const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});return r.ok?r.json():null;}catch{return null;}
}
async function sPost(body){
  try{
    const r=await fetch(SUPA+'/rest/v1/planning',{method:'POST',headers:H,body:JSON.stringify(body)});
    return r.ok;
  }catch{return false;}
}

/* ── LOGIN ── */
function initLogin(){
  const saved=localStorage.getItem('cana_ch3');
  if(saved)try{CH=JSON.parse(saved);startApp();return;}catch{}
  document.getElementById('login-grid').innerHTML=DRIVERS.map((d,i)=>
    `<button class="login-btn" onclick="login(${i})" style="background:${d.color}18;border-color:${d.color}">
      <span class="av">${d.emoji}</span><span>${d.name}</span>
    </button>`
  ).join('');
}

function login(i){
  CH={id:i,name:DRIVERS[i].name,color:DRIVERS[i].color};
  localStorage.setItem('cana_ch3',JSON.stringify(CH));
  startApp();
}

function startApp(){
  goScreen('s-main');
  document.getElementById('main-name').textContent='🚛 '+CH.name;
  const d=new Date();
  document.getElementById('main-date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
  charger();
  _pollIv=setInterval(charger,5000);
}

/* ── CHARGER ── */
async function charger(){
  const today=new Date().toISOString().slice(0,10);
  const rows=await sGet(`planning?date=gte.${today}&select=date,donnees&order=date.asc&limit=30`);
  if(!rows)return;
  const tasks={},cliSet={};
  rows.forEach(r=>{
    let d=r.donnees;
    if(typeof d==='string')try{d=JSON.parse(d);}catch{d=null;}
    if(!d)return;
    if(d.tasks)Object.assign(tasks,d.tasks);
    if(d.library)Object.values(d.library).flat().forEach(n=>{if(n)cliSet[n]=1;});
    if(d.tasks)Object.values(d.tasks).flat().forEach(t=>{if(t&&t.client)cliSet[t.client.replace(/^[^A-Za-zÀ-ÿ0-9]+/,'').trim()]=1;});
  });
  PLANNING=tasks;
  CLIENTS=Object.keys(cliSet).filter(x=>x&&x.length>1).sort();
  document.getElementById('sync-dot').style.background='#22c55e';
  afficher();
}

function afficher(){
  const today=new Date().toISOString().slice(0,10);
  const missions=[];
  for(let off=0;off<15;off++){
    const d=new Date();d.setDate(d.getDate()+off);
    const ds=d.toISOString().slice(0,10);
    Object.keys(PLANNING).forEach(k=>{
      const[date,di,h]=k.split('|');
      if(date!==ds||parseInt(di)!==CH.id)return;
      (PLANNING[k]||[]).forEach((t,ti)=>{
        if(!t||(!(t.client)&&!(t.task)))return;
        missions.push({key:k,idx:ti,date:ds,h,t,today:ds===today});
      });
    });
  }
  missions.sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):a.h.localeCompare(b.h));

  const done=JSON.parse(localStorage.getItem('cana_done3_'+CH.id)||'{}');
  const list=document.getElementById('main-list');

  if(!missions.length){
    list.innerHTML=`<div class="vide">
      <div class="vide-ico">📭</div>
      <div class="vide-titre">Pas de mission prévue</div>
      <div class="vide-txt">Le responsable n'a pas encore planifié.<br>Reviens dans quelques instants.</div>
    </div>`;return;
  }

  const cat=CAT;
  list.innerHTML=missions.map(m=>{
    const t=m.t,c=cat[t.cat||'co']||cat.co;
    const isDone=!!done[m.key+'_'+m.idx];
    const lbl=t.client||t.task||'';
    const dateLbl=!m.today?new Date(m.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'';
    return `<div class="miss${isDone?' done':''}" onclick="detail('${m.key}',${m.idx})">
      <div class="miss-stripe" style="background:${isDone?'#22c55e':c.c}"></div>
      <div class="miss-body">
        <div class="miss-time">
          ${dateLbl?`<div class="miss-date">${dateLbl}</div>`:''}
          <div class="miss-heure">${m.h}</div>
          ${t.fin?`<div class="miss-tfin">→ ${t.fin}</div>`:''}
        </div>
        <div class="miss-info">
          <div class="miss-client">${lbl}</div>
          <span class="miss-cat" style="background:${c.c}18;color:${c.c}">${c.l}</span>
        </div>
        <div class="miss-check${isDone?' ok':''}">${isDone?'✓':''}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── DÉTAIL ── */
function detail(key,idx){
  const[date,di,h]=key.split('|');
  const t=(PLANNING[key]||[])[idx];if(!t)return;
  _curMiss={key,idx,date,h,t};
  document.getElementById('det-client').textContent=t.client||t.task||'—';
  document.getElementById('det-heure').textContent=h+(t.fin?' → '+t.fin:'');
  const done=JSON.parse(localStorage.getItem('cana_done3_'+CH.id)||'{}');
  const isDone=!!done[key+'_'+idx];

  let html='';
  if(t.adresse)html+=`<div class="det-section"><div class="det-label">📍 Adresse</div><div class="det-val">${t.adresse}</div></div>`;

  html+='<div style="display:flex;flex-direction:column;gap:0">';
  html+=`<button class="big-btn ${isDone?'done-btn':'green'}" onclick="toggleDone('${key}',${idx})">
    ${isDone?'✅ Livré — appuie pour annuler':'✅ Confirmer la livraison'}
  </button>`;
  if(t.adresse){
    const q=encodeURIComponent(t.adresse);
    html+=`<button class="big-btn teal" onclick="window.open('https://waze.com/ul?q=${q}','_blank')">🗺 Ouvrir dans Waze</button>`;
  }
  if(t.tel)html+=`<button class="big-btn blue" onclick="window.location.href='tel:${t.tel.replace(/\s/g,'')}'">📞 Appeler le client — ${t.tel}</button>`;
  html+=`<button class="big-btn purple" onclick="ouvrirPhotoClient('${(t.client||'').replace(/'/g,"\\'")}')">📸 Photo de preuve</button>`;
  html+=`<button class="big-btn outline" onclick="goScreen('s-main')">← Retour aux missions</button>`;
  html+='</div>';
  document.getElementById('det-body').innerHTML=html;
  goScreen('s-detail');
}

async function toggleDone(key,idx){
  const done=JSON.parse(localStorage.getItem('cana_done3_'+CH.id)||'{}');
  const k=key+'_'+idx;
  const t=(PLANNING[key]||[])[idx];if(!t)return;
  if(done[k]){delete done[k];}
  else{
    done[k]=Date.now();
    await sPost({
      date:'EV_LIV_'+Date.now()+'_'+CH.id,
      donnees:{type:'livraison_confirmee',_isEvent:true,chauffeurId:CH.id,chauffeur:CH.name,
        client:t.client||t.task||'',heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
        date:new Date().toISOString().slice(0,10),ts:Date.now()},
      updated_at:new Date().toISOString()
    });
    toast('✅ Livraison confirmée !');
  }
  localStorage.setItem('cana_done3_'+CH.id,JSON.stringify(done));
  afficher();detail(key,idx);
}

/* ── PHOTO ── */
function ouvrirPhotoClient(nom){
  _photoCli=nom;
  document.getElementById('photo-cli').value=nom;
  filtrerCli(nom);
  goScreen('s-photo');
}

function filtrerCli(q){
  _photoCli=q;
  const div=document.getElementById('photo-cli-list');
  if(!q){div.innerHTML='';return;}
  const m=CLIENTS.filter(c=>c.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  div.innerHTML=m.map(c=>`<button class="cli-btn" onclick="choisirCli('${c.replace(/'/g,"\\'")}')">📍 ${c}</button>`).join('');
}
function choisirCli(nom){
  _photoCli=nom;
  document.getElementById('photo-cli').value=nom;
  document.getElementById('photo-cli-list').innerHTML='';
}

function photoChoisie(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    _photoImg=e.target.result;
    const prev=document.getElementById('photo-prev');
    prev.src=_photoImg;prev.style.display='block';
    document.getElementById('photo-send').style.display='flex';
    document.getElementById('photo-status').textContent='';
  };
  rd.readAsDataURL(f);
}

async function envoyerPhoto(){
  if(!_photoImg){document.getElementById('photo-status').textContent='⚠️ Prends d\'abord une photo.';return;}
  document.getElementById('photo-status').textContent='⏳ Envoi en cours…';
  document.getElementById('photo-send').disabled=true;
  const ok=await sPost({
    date:'PHOTO_'+Date.now()+'_'+CH.id,
    donnees:{type:'photo',_isEvent:true,chauffeurId:CH.id,chauffeur:CH.name,
      client:_photoCli||'Sans client',clientPhoto:_photoCli||'',photo:_photoImg,
      heure:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
      date:new Date().toISOString().slice(0,10),ts:Date.now()},
    updated_at:new Date().toISOString()
  });
  if(ok){
    try{const arr=JSON.parse(localStorage.getItem('cana_ph3_'+CH.id)||'[]');arr.unshift({img:_photoImg,client:_photoCli,ts:Date.now()});if(arr.length>30)arr.splice(30);localStorage.setItem('cana_ph3_'+CH.id,JSON.stringify(arr));}catch{}
    document.getElementById('photo-status').textContent='✅ Photo envoyée ! Tu peux en prendre une autre.';
    _photoImg=null;
    document.getElementById('photo-prev').style.display='none';
    document.getElementById('photo-send').style.display='none';
    document.getElementById('photo-send').disabled=false;
    document.getElementById('photo-file').value='';
    toast('📸 Photo envoyée au responsable !');
  }else{
    document.getElementById('photo-status').textContent='❌ Erreur. Vérifie ta connexion.';
    document.getElementById('photo-send').disabled=false;
  }
}

/* ── NAVIGATION ── */
function goScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── TOAST ── */
let _tv=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tv);_tv=setTimeout(()=>el.classList.remove('show'),3000);
}

}
